        <button type="button" class="btn danger small" data-opcao-del="${i}" style="margin-top:8px;">Remover grupo</button>
      </div>`).join('') || `<div class="small-note">Nenhum grupo adicionado ainda.</div>`;
  }
  opcoesListEl.addEventListener('input', e=>{
    const i = e.target.dataset.opcaoNome ?? e.target.dataset.opcaoTipo ?? e.target.dataset.opcaoAlts;
    if(e.target.dataset.opcaoNome!==undefined){ cardFormState.opcoes[e.target.dataset.opcaoNome].nome = e.target.value; }
    if(e.target.dataset.opcaoTipo!==undefined){ cardFormState.opcoes[e.target.dataset.opcaoTipo].tipo = e.target.value; }
    if(e.target.dataset.opcaoAlts!==undefined){ cardFormState.opcoes[e.target.dataset.opcaoAlts].alternativasRaw = e.target.value; }
  });
  opcoesListEl.addEventListener('click', e=>{
    if(e.target.dataset.opcaoDel!==undefined){ cardFormState.opcoes.splice(Number(e.target.dataset.opcaoDel),1); renderOpcoesList(); }
  });
  form.querySelector('#btnAddOpcao').addEventListener('click', ()=>{
    cardFormState.opcoes.push({nome:'', tipo:'unica', alternativasRaw:''}); renderOpcoesList();
  });
  const eventosVinculadosListEl = form.querySelector('#eventosVinculadosList');
  function renderEventosVinculadosList(){
    const eventosOrdenados = eventosOptions();
    const hojeStr = new Date().toISOString().slice(0,10);
    eventosVinculadosListEl.innerHTML = eventosOrdenados.length ? eventosOrdenados.map(o=>{
      const passado = o.data < hojeStr;
      const marcado = cardFormState.eventosVinculados.includes(o.id);
      return `<label style="display:flex; align-items:center; gap:8px; text-transform:none; font-size:14px; font-family:'Cormorant Garamond',serif; padding:4px 0; ${passado?'color:var(--ink-soft);':''}">
        <input type="checkbox" data-evento-vinculado="${o.id}" ${marcado?'checked':''} style="width:auto;"> ${escapeHtml(o.label)}${passado?' (já passou)':''}
      </label>`;
    }).join('') : `<div class="small-note">Nenhum evento cadastrado ainda.</div>`;
  }
  eventosVinculadosListEl.addEventListener('change', e=>{
    const id = e.target.dataset.eventoVinculado;
    if(id===undefined) return;
    if(e.target.checked){ if(!cardFormState.eventosVinculados.includes(id)) cardFormState.eventosVinculados.push(id); }
    else { cardFormState.eventosVinculados = cardFormState.eventosVinculados.filter(x=>x!==id); }
  });
  renderEventosVinculadosList();

  temOpcoesChk.addEventListener('change', ()=>{
    opcoesWrap.style.display = temOpcoesChk.checked ? 'block' : 'none';
    if(temOpcoesChk.checked && cardFormState.opcoes.length===0){ cardFormState.opcoes.push({nome:'', tipo:'unica', alternativasRaw:''}); renderOpcoesList(); }
  });
  renderFaixasList(); renderOpcoesList();

  function limparForm(){
    form.querySelector('#f_item').value=''; form.querySelector('#f_cat').value='';
    form.querySelector('#f_preco').value=''; form.querySelector('#f_ativo').value='true';
    form.querySelector('#f_limite').value='';
    temOpcoesChk.checked = false; opcoesWrap.style.display='none';
    cardFormState.faixas = []; cardFormState.opcoes = []; cardFormState.eventosVinculados = []; cardFormState.editingId = null;
    renderFaixasList(); renderOpcoesList(); renderEventosVinculadosList();
    form.querySelector('#btnAdd').textContent = '+ Adicionar Item';
    form.querySelector('#btnCancelEdit').style.display = 'none';
  }

  form.querySelector('#btnCancelEdit').addEventListener('click', limparForm);

  form.querySelector('#btnAdd').addEventListener('click', async ()=>{
    const item = form.querySelector('#f_item').value.trim();
    const categoria = form.querySelector('#f_cat').value.trim();
    const preco = parseFloat(form.querySelector('#f_preco').value);
    const ativo = form.querySelector('#f_ativo').value==='true';
    const limiteRaw = form.querySelector('#f_limite').value;
    const limite = limiteRaw.trim()==='' ? null : parseInt(limiteRaw,10);
    if(!item || isNaN(preco)){ alert('Preencha nome do item e preço.'); return; }
    const faixasPreco = cardFormState.faixas
      .filter(f=>f.qtdBloco>=2 && f.precoBloco>0)
      .map(f=>({qtdBloco:Number(f.qtdBloco), precoBloco:Number(f.precoBloco), validoAte: f.validoAte || null}));
    const temOpcoes = temOpcoesChk.checked;
    const opcoes = temOpcoes ? cardFormState.opcoes
      .filter(g=>g.nome.trim() && g.alternativasRaw.trim())
      .map(g=>({nome:g.nome.trim(), tipo:g.tipo, alternativas:g.alternativasRaw.split(',').map(s=>s.trim()).filter(Boolean)})) : [];
    const docObj = { item, categoria, preco, ativo, limite, faixasPreco, temOpcoes, opcoes, eventosVinculados: [...cardFormState.eventosVinculados] };
    try{
      if(cardFormState.editingId){
        const itemAntigo = DB.cardapio.find(i=>i.id===cardFormState.editingId);
        await db.collection('cardapio').doc(cardFormState.editingId).set(docObj);
        await auditLog('Atualizou', 'cardapio', `Item "${itemAntigo?itemAntigo.item:item}" editado${itemAntigo && itemAntigo.item!==item ? ` (novo nome: "${item}")` : ''}`);

        if(itemAntigo && itemAntigo.item !== item){
          const atualizarReservas = confirm(`O nome do item mudou de "${itemAntigo.item}" para "${item}".\n\nDeseja atualizar esse nome também nos pedidos já lançados anteriormente com esse item? (Sem isso, o "Limite de Produção" e os relatórios não vão reconhecer os pedidos antigos como o mesmo item.)`);
          if(atualizarReservas){
            const afetadas = DB.reservas.filter(r=>r.item===itemAntigo.item);
            for(const r of afetadas){
              await db.collection('reservas').doc(r.id).update({ item });
            }
            await auditLog('Atualizou', 'reservas', `Nome do item atualizado em ${afetadas.length} pedido(s): "${itemAntigo.item}" → "${item}"`);
          }
        }
      } else {
        await db.collection('cardapio').add(docObj);
        await auditLog('Criou', 'cardapio', `Item "${item}" (${fmtMoney(preco)})`);
      }
      limparForm();
    }catch(e){ alert('Não foi possível salvar o item.'); console.error(e); }
  });

  c.appendChild(el(`<div class="section-title">Itens do Cardápio</div>`));
  const tableWrap = el(`<div class="frame" style="padding:0;"><div class="table-wrap"><table>
    <thead><tr><th>Item</th><th>Categoria</th><th>Preço</th><th>Limite/evento</th><th>Faixas de Qtd.</th><th>Opções</th><th>Eventos</th><th>Ativo</th>${podeMexer?'<th></th>':''}</tr></thead>
    <tbody>${DB.cardapio.length? DB.cardapio.map(i=>{
      const faixasNorm = normalizarPacotes(i.faixasPreco);
      const hojeStr = new Date().toISOString().slice(0,10);
      const faixasTxt = faixasNorm.length ? faixasNorm.slice().sort((a,b)=>a.qtdBloco-b.qtdBloco).map(f=>{
        const venceu = f.validoAte && hojeStr > f.validoAte;
        return `${f.qtdBloco}un por ${fmtMoney(f.precoBloco)}${f.validoAte?` <span style="color:${venceu?'var(--warn)':'var(--ink-soft)'};">(até ${fmtDateBR(f.validoAte)}${venceu?' — vencido':''})</span>`:''}`;
      }).join(' · ') : '—';
      const opcoesTxt = i.temOpcoes && (i.opcoes||[]).length ? (i.opcoes||[]).map(o=>o.nome).join(', ') : '—';
      const eventosTxt = (i.eventosVinculados||[]).length ? `${i.eventosVinculados.length} evento(s) específico(s)` : 'Todos os eventos';
      return `<tr data-id="${i.id}">
      <td>${escapeHtml(i.item)}</td><td>${escapeHtml(i.categoria)}</td><td>${fmtMoney(i.preco)}</td>
      <td>${(i.limite===null||i.limite===undefined)?'—':i.limite}</td>
      <td style="font-size:12px;">${faixasTxt}</td>
      <td style="font-size:12px;">${escapeHtml(opcoesTxt)}</td>
      <td style="font-size:12px;">${escapeHtml(eventosTxt)}</td>
      <td><span class="badge ${i.ativo?'sim':'nao'}">${i.ativo?'Sim':'Não'}</span></td>
      ${podeMexer?`<td style="white-space:nowrap;">
        <button class="btn secondary small" data-edit="${i.id}">Editar</button>
        <button class="btn danger small" data-del="${i.id}">Excluir</button>
      </td>`:''}
    </tr>`;}).join('') : '<tr><td colspan="9" class="empty-state">Nenhum item cadastrado</td></tr>'}</tbody>
  </table></div></div>`);
  c.appendChild(tableWrap);

  tableWrap.querySelectorAll('[data-edit]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const i = DB.cardapio.find(x=>x.id===btn.dataset.edit);
      form.querySelector('#f_item').value = i.item;
      form.querySelector('#f_cat').value = i.categoria||'';
      form.querySelector('#f_preco').value = i.preco;
      form.querySelector('#f_ativo').value = i.ativo ? 'true' : 'false';
      form.querySelector('#f_limite').value = (i.limite===null || i.limite===undefined) ? '' : i.limite;
      cardFormState.faixas = normalizarPacotes(i.faixasPreco);
      cardFormState.opcoes = (i.opcoes||[]).map(o=>({nome:o.nome, tipo:o.tipo, alternativasRaw:(o.alternativas||[]).join(', ')}));
      cardFormState.eventosVinculados = [...(i.eventosVinculados||[])];
      cardFormState.editingId = i.id;
      temOpcoesChk.checked = !!i.temOpcoes;
      opcoesWrap.style.display = i.temOpcoes ? 'block' : 'none';
      renderFaixasList(); renderOpcoesList(); renderEventosVinculadosList();
      form.querySelector('#btnAdd').textContent = 'Salvar Alterações';
      form.querySelector('#btnCancelEdit').style.display = 'inline-block';
      form.scrollIntoView({behavior:'smooth', block:'start'});
    });
  });
  tableWrap.querySelectorAll('[data-del]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      if(!confirm('Excluir este item do cardápio?')) return;
      const item = DB.cardapio.find(i=>i.id===btn.dataset.del);
      await db.collection('cardapio').doc(btn.dataset.del).delete();
      await auditLog('Excluiu', 'cardapio', `Item "${item.item}"`);
    });
  });
}

/* ==================== RESERVAS ==================== */
function renderReservas(c){
  const opts = eventosOptions();
  const itensAtivos = DB.cardapio.filter(i=>i.ativo);
  let editingReservaId = null;

  c.appendChild(el(`<div class="section-title" id="reservaFormTitle">Nova Reserva / Pedido</div>`));
  const formTitle = c.querySelector('#reservaFormTitle');
  if(opts.length===0 || itensAtivos.length===0){
    c.appendChild(el(`<div class="frame empty-state">Cadastre pelo menos um Evento e um Item do Cardápio antes de lançar pedidos.</div>`));
  } else {
    const form = el(`<div class="frame">
      <div class="form-grid">
        <div><label>Evento</label><select id="f_evento">${eventoOptionsHtml(opts)}</select></div>
        <div><label>Horário</label><select id="f_horario"></select></div>
        <div><label>Cliente</label><input type="text" id="f_cliente" list="clientesList" placeholder="Nome do cliente"></div>
        <div><label>Telefone/WhatsApp *</label><input type="text" id="f_telefone" placeholder="(11) 91234-5678"></div>
        <div><label>Item</label><select id="f_item"></select></div>
        <div><label>Quantidade</label><input type="number" min="1" value="1" id="f_qtd"></div>
        <div><label>Forma de Pagamento</label><select id="f_pagto"><option>Dinheiro</option><option>Pix</option><option>Cartão</option></select></div>
        <div><label>Pago?</label><select id="f_pago"><option>Não</option><option>Sim</option></select></div>
        <div><label>Entregue?</label><select id="f_entregue"><option>Não</option><option>Sim</option></select></div>
      </div>
      <div class="small-note" id="precoPreview" style="margin-bottom:4px;"></div>
      <div class="small-note" id="limitePreview" style="margin-bottom:14px;"></div>
      <div id="opcoesItemWrap"></div>
      <div style="margin-bottom:12px;"><label>⚠️ Observação livre (opcional)</label><input type="text" id="f_obs" placeholder="Ex: alergia, embalar separado..."></div>
      <button class="btn" id="btnAdd">+ Adicionar Pedido</button>
      <button class="btn secondary" id="btnCancelEditReserva" style="display:none;">Cancelar edição</button>
      <div class="small-note" id="lancadoPorNote">Lançado automaticamente em nome de: <strong>${escapeHtml(userName())}</strong></div>
      <datalist id="clientesList">${DB.clientes.map(cl=>`<option value="${escapeHtml(cl.nome)}">`).join('')}</datalist>
    </div>`);
    c.appendChild(form);

    const evSel = form.querySelector('#f_evento');
    const horSel = form.querySelector('#f_horario');
    const itemSel = form.querySelector('#f_item');
    const qtdInput = form.querySelector('#f_qtd');
    const clienteInput = form.querySelector('#f_cliente');
    const telefoneInput = form.querySelector('#f_telefone');
    function tentarAutoPreencherTelefone(){
      const cl = DB.clientes.find(x=>normalizarNome(x.nome)===normalizarNome(clienteInput.value));
      if(cl && cl.contato){ telefoneInput.value = cl.contato; }
    }
    clienteInput.addEventListener('input', tentarAutoPreencherTelefone);
    clienteInput.addEventListener('change', tentarAutoPreencherTelefone);
    const pagtoSel = form.querySelector('#f_pagto');
    const pagoSel = form.querySelector('#f_pago');
    const entregueSel = form.querySelector('#f_entregue');
    const obsInput = form.querySelector('#f_obs');
    const precoPreview = form.querySelector('#precoPreview');
    const limitePreview = form.querySelector('#limitePreview');
    const opcoesItemWrap = form.querySelector('#opcoesItemWrap');
    const btnAdd = form.querySelector('#btnAdd');
    const btnCancelEditReserva = form.querySelector('#btnCancelEditReserva');

    function refreshHorarios(){
      const sel = opts.find(o=>o.value===evSel.value);
      horSel.innerHTML = (sel.cultos||['-']).map(h=>`<option>${h}</option>`).join('');
    }
    function refreshItemOptions(){
      const sel = opts.find(o=>o.value===evSel.value);
      const disponiveis = itensAtivos.filter(i=> !(i.eventosVinculados||[]).length || (sel && i.eventosVinculados.includes(sel.id)));
      itemSel.innerHTML = disponiveis.length ? disponiveis.map(i=>`<option value="${i.id}">${escapeHtml(i.item)}</option>`).join('') : `<option value="">— Nenhum item vinculado a este evento —</option>`;
    }
    evSel.addEventListener('change', ()=>{ refreshHorarios(); refreshItemOptions(); refreshOpcoesItem(); refreshPrecoPreview(); });
    refreshHorarios(); refreshItemOptions();

    function itemAtual(){ return DB.cardapio.find(i=>i.id===itemSel.value); }

    function jaReservadoNoEvento(item){
      const sel = opts.find(o=>o.value===evSel.value);
      if(!sel || !item) return 0;
      return DB.reservas.filter(r=>r.data===sel.data && r.tipo===sel.tipo && r.item===item.item && r.id!==editingReservaId).reduce((s,r)=>s+r.qtd,0);
    }

    function refreshOpcoesItem(marcarSelecionadas){
      const item = itemAtual();
      opcoesItemWrap.innerHTML = '';
      if(item && item.temOpcoes && (item.opcoes||[]).length){
        item.opcoes.forEach((grupo, gi)=>{
          const inputType = grupo.tipo==='multipla' ? 'checkbox' : 'radio';
          const jaMarcados = marcarSelecionadas && marcarSelecionadas[grupo.nome] ?
            (Array.isArray(marcarSelecionadas[grupo.nome]) ? marcarSelecionadas[grupo.nome] : [marcarSelecionadas[grupo.nome]]) : [];
          const box = el(`<div class="frame" style="padding:12px; margin-bottom:10px;" data-grupo="${gi}">
            <label style="margin-bottom:8px;">${escapeHtml(grupo.nome)}${grupo.tipo==='unica'?' *':''}</label>
            <div style="display:flex; flex-wrap:wrap; gap:12px;">
              ${grupo.alternativas.map((alt,ai)=>`<label style="display:flex; align-items:center; gap:6px; text-transform:none; font-size:14px; font-family:'Cormorant Garamond',serif;">
                <input type="${inputType}" name="opgrupo_${gi}" value="${escapeHtml(alt)}" ${jaMarcados.includes(alt)?'checked':''} style="width:auto;"> ${escapeHtml(alt)}
              </label>`).join('')}
            </div>
          </div>`);
          opcoesItemWrap.appendChild(box);
        });
      }
    }

    function refreshPrecoPreview(){
      const item = itemAtual();
      const qtd = parseInt(qtdInput.value,10) || 0;
      if(!item){ precoPreview.innerHTML=''; limitePreview.innerHTML=''; return; }
      const selAtual = opts.find(o=>o.value===evSel.value);
      const { total, texto } = calcularValorTotalDetalhado(item, qtd, selAtual?selAtual.data:null);
      precoPreview.innerHTML = qtd>0 ? `<strong>Total do pedido: ${fmtMoney(total)}</strong> <span style="color:var(--ink-soft);">(${fmtMoney(qtd?total/qtd:0)} em média por unidade)</span>${texto?`<br>cálculo: ${escapeHtml(texto)}`:''}` : '';
      if(item.limite!==null && item.limite!==undefined && item.limite>0){
        const jaReservado = jaReservadoNoEvento(item);
        const depois = jaReservado + qtd;
        const restante = item.limite - depois;
        const excede = depois > item.limite;
        limitePreview.innerHTML = `<span style="color:${excede?'var(--warn)':'var(--ink-soft)'}">Reservado até agora: ${jaReservado} de ${item.limite}. Com este pedido: <strong>${depois} de ${item.limite}</strong> (restam ${Math.max(0,restante)})${excede?' — ⚠️ ultrapassa o limite, não vai deixar salvar!':''}</span>`;
      } else {
        limitePreview.innerHTML = '';
      }
    }

    itemSel.addEventListener('change', ()=>{ refreshOpcoesItem(); refreshPrecoPreview(); });
    qtdInput.addEventListener('input', refreshPrecoPreview);
    refreshOpcoesItem(); refreshPrecoPreview();

    function limparFormReserva(){
      evSel.selectedIndex = 0; refreshHorarios(); refreshItemOptions();
      clienteInput.value = ''; telefoneInput.value = ''; itemSel.selectedIndex = 0;
      qtdInput.value = '1'; pagtoSel.value='Dinheiro'; pagoSel.value='Não'; entregueSel.value='Não';
      obsInput.value = '';
      editingReservaId = null;
      formTitle.textContent = 'Nova Reserva / Pedido';
      btnAdd.textContent = '+ Adicionar Pedido';
      btnCancelEditReserva.style.display = 'none';
      form.querySelector('#lancadoPorNote').style.display = '';
      refreshOpcoesItem(); refreshPrecoPreview();
    }
    btnCancelEditReserva.addEventListener('click', limparFormReserva);

    window._carregarReservaParaEdicao = function(r){
      editingReservaId = r.id;
      evSel.value = eventoKey(r.data, r.tipo); refreshHorarios(); refreshItemOptions();
      horSel.value = r.horario;
      clienteInput.value = r.cliente;
      telefoneInput.value = contatoDoCliente(r.cliente) || '';
      const itemMatch = DB.cardapio.find(i=>i.item===r.item);
      if(itemMatch) itemSel.value = itemMatch.id;
      qtdInput.value = r.qtd;
      pagtoSel.value = r.formaPagamento || 'Dinheiro';
      pagoSel.value = r.pago || 'Não';
      entregueSel.value = r.entregue || 'Não';
      obsInput.value = r.observacao || '';
      refreshOpcoesItem(r.opcoesSelecionadas); refreshPrecoPreview();
      formTitle.textContent = `Editar Reserva — ${r.cliente}`;
      btnAdd.textContent = 'Salvar Alterações';
      btnCancelEditReserva.style.display = 'inline-block';
      form.querySelector('#lancadoPorNote').style.display = 'none';
      form.scrollIntoView({behavior:'smooth', block:'start'});
    };

    btnAdd.addEventListener('click', async ()=>{
      const sel = opts.find(o=>o.value===evSel.value);
      let cliente = clienteInput.value.trim();
      const telefone = telefoneInput.value.trim();
      const itemObj = itemAtual();
      const qtd = parseInt(qtdInput.value,10);
      if(!cliente || !itemObj || !qtd || qtd<1){ alert('Preencha cliente, item e quantidade válida.'); return; }
      if(!telefone){ alert('O telefone/WhatsApp do cliente é obrigatório.'); telefoneInput.focus(); return; }
      const telefoneCheck = whatsappUrl(telefone);
      if(!telefoneCheck || telefoneCheck==='INVALIDO'){ alert('Esse telefone não parece válido. Confira o DDD e o número (deve ter DDD + 8 ou 9 dígitos).'); telefoneInput.focus(); return; }

      // checa nome de cliente parecido com um já cadastrado, pra evitar duplicidade (ex: "Elisangela" x "Elizangela")
      const jaExisteExato = DB.clientes.some(cl=>normalizarNome(cl.nome)===normalizarNome(cliente));
      if(!jaExisteExato){
        const similar = encontrarClienteSimilar(cliente);
        if(similar){
          const usarExistente = confirm(`Já existe um cliente cadastrado com nome parecido: "${similar.nome}".\n\nClique OK se for a MESMA pessoa (usar "${similar.nome}").\nClique Cancelar se for uma pessoa DIFERENTE (manter "${cliente}").`);
          if(usarExistente){ cliente = similar.nome; }
        }
      }

      // checa limite de quantidade do item nesse evento — revalida direto no banco (não só no cache local),
      // pra reduzir o risco de duas pessoas venderem a última unidade ao mesmo tempo
      if(itemObj.limite!==null && itemObj.limite!==undefined && itemObj.limite>0){
        let jaReservadoFresco;
        try{
          const snap = await db.collection('reservas')
            .where('data','==',sel.data).where('tipo','==',sel.tipo).where('item','==',itemObj.item).get();
          jaReservadoFresco = snap.docs.filter(d=>d.id!==editingReservaId).reduce((s,d)=>s+(d.data().qtd||0),0);
        }catch(e){
          console.error('Falha ao revalidar limite', e);
          jaReservadoFresco = jaReservadoNoEvento(itemObj);
        }
        if((jaReservadoFresco + qtd) > itemObj.limite){
          alert(`Não é possível lançar este pedido: "${itemObj.item}" já tem ${jaReservadoFresco} de ${itemObj.limite} reservados neste evento. Restam apenas ${Math.max(0,itemObj.limite-jaReservadoFresco)} unidade(s).`);
          return;
        }
      }

      // captura opções selecionadas e valida grupos de escolha única
      const opcoesSelecionadas = {};
      if(itemObj.temOpcoes && (itemObj.opcoes||[]).length){
        for(let gi=0; gi<itemObj.opcoes.length; gi++){
          const grupo = itemObj.opcoes[gi];
          const checked = [...opcoesItemWrap.querySelectorAll(`input[name="opgrupo_${gi}"]:checked`)].map(el=>el.value);
          if(grupo.tipo==='unica' && checked.length===0){ alert(`Selecione uma opção em "${grupo.nome}".`); return; }
          if(checked.length){ opcoesSelecionadas[grupo.nome] = grupo.tipo==='multipla' ? checked : checked[0]; }
        }
      }
      const opcoesTexto = Object.entries(opcoesSelecionadas).map(([k,v])=>`${k}: ${Array.isArray(v)?v.join('/'):v}`).join('; ');
      const valorTotal = calcularValorTotal(itemObj, qtd, sel.data);
      const precoUnit = qtd ? valorTotal/qtd : 0;

      const dadosReserva = {
        data: sel.data, tipo: sel.tipo, horario: horSel.value,
        cliente, item: itemObj.item, qtd, precoUnit, valorTotal,
        opcoesSelecionadas, opcoesTexto,
        observacao: obsInput.value.trim(),
        formaPagamento: pagtoSel.value,
        pago: pagoSel.value,
        entregue: entregueSel.value,
      };

      if(editingReservaId){
        try{
          await db.collection('reservas').doc(editingReservaId).update(dadosReserva);
          await auditLog('Atualizou', 'reservas', `Reserva de ${cliente} editada — ${itemObj.item} (${qtd}x, ${fmtMoney(valorTotal)})`);
          await salvarContatoCliente(cliente, telefone);
          limparFormReserva();
        }catch(e){ alert('Não foi possível salvar a edição.'); console.error(e); }
        return;
      }

      dadosReserva.vendedor = userName();
      await db.collection('reservas').add(dadosReserva);
      await auditLog('Criou', 'reservas', `Pedido de ${cliente} — ${itemObj.item} (${qtd}x) em ${fmtDateBR(sel.data)}`);
      await salvarContatoCliente(cliente, telefone);
    });
  }

  c.appendChild(el(`<div class="section-title">Pedidos Lançados</div>`));
  window._filtros = window._filtros || {evento:'', pago:'', entregue:''};
  window._reservaSort = window._reservaSort || {key:'data', dir:'desc'};
  const SORT_OPCOES = [
    {key:'data', label:'Data'}, {key:'cliente', label:'Cliente'}, {key:'item', label:'Item'},
    {key:'qtd', label:'Quantidade'}, {key:'valor', label:'Valor'}, {key:'pago', label:'Pago'},
    {key:'entregue', label:'Entregue'}, {key:'montada', label:'Montada'}, {key:'vendedor', label:'Lançado por'},
  ];
  const filterWrap = el(`<div class="filters-row">
    <div><label>Evento</label><select id="filtEvento"><option value="">Todos</option>${eventoOptionsHtml(opts, window._filtros.evento)}</select></div>
    <div><label>Pago?</label><select id="filtPago"><option value="">Todos</option><option ${window._filtros.pago==='Sim'?'selected':''}>Sim</option><option ${window._filtros.pago==='Não'?'selected':''}>Não</option></select></div>
    <div><label>Entregue?</label><select id="filtEntregue"><option value="">Todos</option><option ${window._filtros.entregue==='Sim'?'selected':''}>Sim</option><option ${window._filtros.entregue==='Não'?'selected':''}>Não</option></select></div>
    <div><label>Ordenar por</label><select id="ordCampo">${SORT_OPCOES.map(o=>`<option value="${o.key}" ${window._reservaSort.key===o.key?'selected':''}>${o.label}</option>`).join('')}</select></div>
    <div><label>Direção</label><button class="btn secondary small" id="btnOrdDir" type="button">${window._reservaSort.dir==='asc'?'▲ Crescente':'▼ Decrescente'}</button></div>
  </div>`);
  c.appendChild(filterWrap);
  filterWrap.querySelector('#filtEvento').addEventListener('change', e=>{ window._filtros.evento=e.target.value; render(); });
  filterWrap.querySelector('#filtPago').addEventListener('change', e=>{ window._filtros.pago=e.target.value; render(); });
  filterWrap.querySelector('#filtEntregue').addEventListener('change', e=>{ window._filtros.entregue=e.target.value; render(); });
  filterWrap.querySelector('#ordCampo').addEventListener('change', e=>{ window._reservaSort.key=e.target.value; render(); });
  filterWrap.querySelector('#btnOrdDir').addEventListener('click', ()=>{ window._reservaSort.dir = window._reservaSort.dir==='asc'?'desc':'asc'; render(); });

  let list = [...DB.reservas];
  if(window._filtros.evento){ const [d,t]=window._filtros.evento.split('|'); list = list.filter(r=>r.data===d && r.tipo===t); }
  if(window._filtros.pago){ list = list.filter(r=>r.pago===window._filtros.pago); }
  if(window._filtros.entregue){ list = list.filter(r=>r.entregue===window._filtros.entregue); }

  function reservaSortValue(r, key){
    switch(key){
      case 'data': return r.data + ' ' + r.horario;
      case 'cliente': return normalizarNome(r.cliente);
      case 'item': return r.item||'';
      case 'qtd': return r.qtd||0;
      case 'valor': return valorReserva(r);
      case 'pago': return r.pago||'';
      case 'entregue': return r.entregue||'';
      case 'montada': return r.montada||'Não';
      case 'vendedor': return r.vendedor||'';
      default: return '';
    }
  }
  list.sort((a,b)=>{
    const va = reservaSortValue(a, window._reservaSort.key);
    const vb = reservaSortValue(b, window._reservaSort.key);
    let cmp = (typeof va==='number' && typeof vb==='number') ? va-vb : String(va).localeCompare(String(vb));
    return window._reservaSort.dir==='asc' ? cmp : -cmp;
  });

  function reservaCardHtml(r){
    const temObs = (r.observacao&&r.observacao.trim()) || (r.opcoesTexto&&r.opcoesTexto.trim());
    return `<div class="pedido-card ${temObs?'destaque':''}" data-id="${r.id}">
      <div class="pedido-topo">
        <div class="pedido-cliente">${escapeHtml(r.cliente)}${whatsappBtn(contatoDoCliente(r.cliente))}</div>
        <div class="pedido-hora">${fmtDateBR(r.data)} · ${r.tipo} · ${r.horario}</div>
      </div>
      <div class="pedido-item-linha"><span>${escapeHtml(r.item)} × ${r.qtd}</span><span class="valor">${fmtMoney(valorReserva(r))}</span></div>
      <div class="pedido-meta">${r.formaPagamento} · Lançado por ${escapeHtml(r.vendedor||'')}</div>
      ${r.opcoesTexto?`<div class="obs-box">${escapeHtml(r.opcoesTexto)}</div>`:''}
      ${r.observacao?`<div class="obs-box warn">⚠️ ${escapeHtml(r.observacao)}</div>`:''}
      <div class="pills-row">
        <button type="button" class="pill-toggle ${r.pago==='Sim'?'on':''}" data-pago="${r.id}">${r.pago==='Sim'?'✓ Pago':'Pago: Não'}</button>
        <button type="button" class="pill-toggle ${r.entregue==='Sim'?'on':''}" data-ent="${r.id}">${r.entregue==='Sim'?'✓ Entregue':'Entregue: Não'}</button>
        <button type="button" class="pill-toggle ${r.montada==='Sim'?'on':''}" data-montada="${r.id}">${r.montada==='Sim'?'✓ Montada':'Montada: Não'}</button>
      </div>
      <div class="acoes-row">
        <button type="button" data-editreserva="${r.id}">Editar</button>
        <button type="button" data-confirmar="${r.id}" class="${r.confirmadoEm?'confirmado':''}">${r.confirmadoEm?'✓ Avisado (reenviar)':'Avisar Cliente'}</button>
        <button type="button" class="excluir" data-del="${r.id}">Excluir</button>
      </div>
    </div>`;
  }

  // separa em destaque, no topo, todo pedido com observação ou particularidade — pra não passar batido na montagem
  const comParticularidade = list.filter(r=>(r.observacao&&r.observacao.trim()) || (r.opcoesTexto&&r.opcoesTexto.trim()));
  const semParticularidade = list.filter(r=>!((r.observacao&&r.observacao.trim()) || (r.opcoesTexto&&r.opcoesTexto.trim())));

  const groupContainer = el(`<div></div>`);

  if(comParticularidade.length){
    groupContainer.appendChild(el(`<div class="section-title" style="color:var(--warn);">⚠️ Pedidos com Particularidades — Atenção na Montagem <span class="small-note" style="margin:0 0 0 8px;">(${comParticularidade.length})</span></div>`));
    groupContainer.appendChild(el(`<div>${comParticularidade.map(reservaCardHtml).join('')}</div>`));
  }

  // se o evento filtrado tiver mais de um horário, separa visualmente os pedidos (sem particularidade) por horário
  let horariosDoEventoFiltrado = null;
  if(window._filtros.evento){
    const [d,t] = window._filtros.evento.split('|');
    const evObj = DB.eventos.find(e=>e.data===d && e.tipo===t);
    if(evObj && (evObj.cultos||[]).length>1) horariosDoEventoFiltrado = evObj.cultos;
  }

  if(comParticularidade.length || semParticularidade.length){
    groupContainer.appendChild(el(`<div class="section-title" style="margin-top:20px;">Demais Pedidos</div>`));
  }
  if(horariosDoEventoFiltrado){
    const gruposUsados = [...horariosDoEventoFiltrado];
    semParticularidade.forEach(r=>{ if(!gruposUsados.includes(r.horario)) gruposUsados.push(r.horario); });
    let algumGrupo = false;
    gruposUsados.forEach(hor=>{
      const rows = semParticularidade.filter(r=>r.horario===hor);
      if(!rows.length) return;
      algumGrupo = true;
      groupContainer.appendChild(el(`<div class="section-title" style="margin-top:14px; font-size:16px;">🕒 Horário: ${escapeHtml(hor)} <span class="small-note" style="margin:0 0 0 8px;">(${rows.length} pedido${rows.length!==1?'s':''})</span></div>`));
      groupContainer.appendChild(el(`<div>${rows.map(reservaCardHtml).join('')}</div>`));
    });
    if(!algumGrupo){ groupContainer.appendChild(el(`<div class="frame empty-state">Nenhum pedido encontrado</div>`)); }
  } else {
    groupContainer.appendChild(el(`<div>${semParticularidade.length? semParticularidade.map(reservaCardHtml).join('') : '<div class="frame empty-state">Nenhum pedido encontrado</div>'}</div>`));
  }
  c.appendChild(groupContainer);
  const tableWrap = groupContainer;

  tableWrap.querySelectorAll('[data-editreserva]').forEach(btn=>btn.addEventListener('click', ()=>{
    const r = DB.reservas.find(x=>x.id===btn.dataset.editreserva);
    if(r && window._carregarReservaParaEdicao) window._carregarReservaParaEdicao(r);
  }));
  tableWrap.querySelectorAll('[data-pago]').forEach(btn=>btn.addEventListener('click', async ()=>{
    const r = DB.reservas.find(x=>x.id===btn.dataset.pago);
    const novo = r.pago==='Sim'?'Não':'Sim';
    await db.collection('reservas').doc(r.id).update({pago:novo});
    await auditLog('Atualizou', 'reservas', `Pagamento de ${r.cliente} (${r.item}): ${r.pago} → ${novo}`);
  }));
  tableWrap.querySelectorAll('[data-ent]').forEach(btn=>btn.addEventListener('click', async ()=>{
    const r = DB.reservas.find(x=>x.id===btn.dataset.ent);
    const novo = r.entregue==='Sim'?'Não':'Sim';
    await db.collection('reservas').doc(r.id).update({entregue:novo});
    await auditLog('Atualizou', 'reservas', `Entrega de ${r.cliente} (${r.item}): ${r.entregue} → ${novo}`);
  }));
  tableWrap.querySelectorAll('[data-montada]').forEach(btn=>btn.addEventListener('click', async ()=>{
    const r = DB.reservas.find(x=>x.id===btn.dataset.montada);
    const novo = r.montada==='Sim'?'Não':'Sim';
    await db.collection('reservas').doc(r.id).update({montada:novo});
    await auditLog('Atualizou', 'reservas', `Montagem de ${r.cliente} (${r.item}): ${r.montada||'Não'} → ${novo}`);
  }));
  tableWrap.querySelectorAll('[data-confirmar]').forEach(btn=>btn.addEventListener('click', async ()=>{
    const r = DB.reservas.find(x=>x.id===btn.dataset.confirmar);
    const contato = contatoDoCliente(r.cliente);
    const testeUrl = whatsappUrl(contato);
    if(!testeUrl || testeUrl==='INVALIDO'){
      alert(`"${r.cliente}" não tem um telefone válido cadastrado. Cadastre (ou corrija) o telefone dele na aba Clientes antes de enviar a confirmação.`);
      return;
    }
    const url = whatsappUrl(contato, mensagemConfirmacao(r));
    window.open(url, '_blank');
    try{
      await db.collection('reservas').doc(r.id).update({ confirmadoEm: firebase.firestore.FieldValue.serverTimestamp(), confirmadoPor: userName() });
      await auditLog('Atualizou', 'reservas', `Confirmação enviada por WhatsApp para ${r.cliente} (${r.item})`);
    }catch(e){ console.error('Falha ao registrar confirmação', e); }
  }));
  tableWrap.querySelectorAll('[data-del]').forEach(btn=>btn.addEventListener('click', async ()=>{
    if(!confirm('Excluir este pedido?')) return;
    const r = DB.reservas.find(x=>x.id===btn.dataset.del);
    await db.collection('reservas').doc(r.id).delete();
    await auditLog('Excluiu', 'reservas', `Pedido de ${r.cliente} — ${r.item} (${fmtMoney(valorReserva(r))}, pago: ${r.pago})`);
  }));
}

/* ==================== DESPESAS ==================== */
const UNIDADES_PADRAO = ['kg','g','L','ml','unidade','pacote','caixa','dúzia','fardo','saco'];

function renderDespesas(c){
  const opts = eventosOptions();
  let editingDespesaId = null;

  c.appendChild(el(`<div class="section-title" id="despesaFormTitle">Nova Despesa</div>`));
  const formTitle = c.querySelector('#despesaFormTitle');
  if(opts.length===0){
    c.appendChild(el(`<div class="frame empty-state">Cadastre um evento primeiro.</div>`));
  } else {
    const form = el(`<div class="frame">
      <div class="form-grid">
        <div><label>Evento</label><select id="f_evento">${eventoOptionsHtml(opts)}</select></div>
        <div><label>Descrição</label><input type="text" id="f_desc" placeholder="Ex: Massa e recheio"></div>
        <div><label>Categoria</label><input type="text" id="f_cat" placeholder="Ex: Ingredientes"></div>
        <div><label>Quantidade</label><input type="number" step="0.01" min="0" id="f_qtd" placeholder="Ex: 5"></div>
        <div><label>Unidade</label><select id="f_unidade">${UNIDADES_PADRAO.map(u=>`<option value="${u}">${u}</option>`).join('')}<option value="__outra">Outra (digitar)...</option></select></div>
        <div id="f_unidadeOutraWrap" style="display:none;"><label>Qual unidade?</label><input type="text" id="f_unidadeOutra" placeholder="Ex: bandeja"></div>
        <div><label>Valor (R$)</label><input type="number" step="0.01" id="f_valor"></div>
      </div>
      <button class="btn" id="btnAdd">+ Adicionar Despesa</button>
      <button class="btn secondary" id="btnCancelEditDespesa" style="display:none;">Cancelar edição</button>
    </div>`);
    c.appendChild(form);

    const evSel = form.querySelector('#f_evento');
    const descInput = form.querySelector('#f_desc');
    const catInput = form.querySelector('#f_cat');
    const qtdInput = form.querySelector('#f_qtd');
    const unidadeSel = form.querySelector('#f_unidade');
    const unidadeOutraWrap = form.querySelector('#f_unidadeOutraWrap');
    const unidadeOutraInput = form.querySelector('#f_unidadeOutra');
    const valorInput = form.querySelector('#f_valor');
    const btnAdd = form.querySelector('#btnAdd');
    const btnCancelEditDespesa = form.querySelector('#btnCancelEditDespesa');

    unidadeSel.addEventListener('change', ()=>{
      unidadeOutraWrap.style.display = unidadeSel.value==='__outra' ? 'block' : 'none';
    });

    function limparFormDespesa(){
      descInput.value=''; catInput.value=''; qtdInput.value=''; valorInput.value='';
      unidadeSel.value = UNIDADES_PADRAO[0]; unidadeOutraWrap.style.display='none'; unidadeOutraInput.value='';
      editingDespesaId = null;
      formTitle.textContent = 'Nova Despesa';
      btnAdd.textContent = '+ Adicionar Despesa';
      btnCancelEditDespesa.style.display = 'none';
    }
    btnCancelEditDespesa.addEventListener('click', limparFormDespesa);

    window._carregarDespesaParaEdicao = function(d){
      editingDespesaId = d.id;
      evSel.value = eventoKey(d.data, d.tipo);
      descInput.value = d.descricao||'';
      catInput.value = d.categoria||'';
      qtdInput.value = (d.quantidade===null||d.quantidade===undefined) ? '' : d.quantidade;
      if(d.unidade && !UNIDADES_PADRAO.includes(d.unidade)){
        unidadeSel.value = '__outra'; unidadeOutraWrap.style.display='block'; unidadeOutraInput.value = d.unidade;
      } else {
        unidadeSel.value = d.unidade || UNIDADES_PADRAO[0]; unidadeOutraWrap.style.display='none';
      }
      valorInput.value = d.valor;
      formTitle.textContent = `Editar Despesa — ${d.descricao}`;
      btnAdd.textContent = 'Salvar Alterações';
      btnCancelEditDespesa.style.display = 'inline-block';
      form.scrollIntoView({behavior:'smooth', block:'start'});
    };

    btnAdd.addEventListener('click', async ()=>{
      const sel = opts.find(o=>o.value===evSel.value);
      const descricao = descInput.value.trim();
      const categoria = catInput.value.trim();
      const valor = parseFloat(valorInput.value);
      const quantidadeRaw = qtdInput.value.trim();
      const quantidade = quantidadeRaw==='' ? null : parseFloat(quantidadeRaw);
      const unidade = unidadeSel.value==='__outra' ? unidadeOutraInput.value.trim() : unidadeSel.value;
      if(!descricao || isNaN(valor)){ alert('Preencha descrição e valor.'); return; }

      const dadosDespesa = { data:sel.data, tipo:sel.tipo, descricao, categoria, valor, quantidade, unidade: quantidade!==null ? unidade : null };

      if(editingDespesaId){
        try{
          await db.collection('despesas').doc(editingDespesaId).update(dadosDespesa);
          await auditLog('Atualizou', 'despesas', `Despesa "${descricao}" editada (${fmtMoney(valor)})`);
          limparFormDespesa();
        }catch(e){ alert('Não foi possível salvar a edição.'); console.error(e); }
        return;
      }

      dadosDespesa.lancadoPor = userName();
      await db.collection('despesas').add(dadosDespesa);
      await auditLog('Criou', 'despesas', `Despesa "${descricao}" (${fmtMoney(valor)}) em ${fmtDateBR(sel.data)}`);
    });
  }

  c.appendChild(el(`<div class="section-title">Despesas Lançadas</div>`));
  window._filtrosDespesa = window._filtrosDespesa || {evento:''};
  window._despesaSort = window._despesaSort || {key:'data', dir:'desc'};
  const filterWrap = el(`<div class="filters-row">
    <div><label>Evento</label><select id="filtEventoDespesa"><option value="">Todos</option>${eventoOptionsHtml(opts, window._filtrosDespesa.evento)}</select></div>
  </div>`);
  c.appendChild(filterWrap);
  filterWrap.querySelector('#filtEventoDespesa').addEventListener('change', e=>{ window._filtrosDespesa.evento=e.target.value; render(); });

  let list = [...DB.despesas];
  if(window._filtrosDespesa.evento){ const [d,t]=window._filtrosDespesa.evento.split('|'); list = list.filter(x=>x.data===d && x.tipo===t); }

  function despesaSortValue(d, key){
    switch(key){
      case 'data': return d.data||'';
      case 'tipo': return d.tipo||'';
      case 'descricao': return (d.descricao||'').toLowerCase();
      case 'categoria': return (d.categoria||'').toLowerCase();
      case 'quantidade': return d.quantidade===null||d.quantidade===undefined ? -Infinity : Number(d.quantidade);
      case 'valor': return Number(d.valor)||0;
      case 'lancadoPor': return (d.lancadoPor||'').toLowerCase();
      default: return '';
    }
  }
  list.sort((a,b)=>{
    const va = despesaSortValue(a, window._despesaSort.key);
    const vb = despesaSortValue(b, window._despesaSort.key);
    let cmp = (typeof va==='number' && typeof vb==='number') ? va-vb : String(va).localeCompare(String(vb));
    return window._despesaSort.dir==='asc' ? cmp : -cmp;
  });

  const DESP_COLS = [
    {key:'data', label:'Data'}, {key:'tipo', label:'Tipo'}, {key:'descricao', label:'Descrição'},
    {key:'categoria', label:'Categoria'}, {key:'quantidade', label:'Qtd/Unidade'}, {key:'valor', label:'Valor'},
    {key:'lancadoPor', label:'Lançado por'}, {key:null, label:''},
  ];
  const theadHtml = `<thead><tr>${DESP_COLS.map(col=>{
    if(!col.key) return `<th>${col.label}</th>`;
    const ativo = window._despesaSort.key===col.key;
    const seta = ativo ? (window._despesaSort.dir==='asc'?' ▲':' ▼') : '';
    return `<th data-sortcol="${col.key}" style="cursor:pointer; user-select:none;" title="Clique para ordenar">${col.label}${seta}</th>`;
  }).join('')}</tr></thead>`;

  const tableWrap = el(`<div class="frame" style="padding:0;"><div class="table-wrap"><table>${theadHtml}
    <tbody>${list.length? list.map(d=>`<tr data-id="${d.id}">
      <td>${fmtDateBR(d.data)}</td><td>${d.tipo}</td><td>${escapeHtml(d.descricao)}</td><td>${escapeHtml(d.categoria)}</td>
      <td>${(d.quantidade===null||d.quantidade===undefined)?'—':`${d.quantidade} ${escapeHtml(d.unidade||'')}`}</td>
      <td>${fmtMoney(d.valor)}</td><td>${escapeHtml(d.lancadoPor||'')}</td>
      <td style="white-space:nowrap;">
        <button class="btn secondary small" data-editdespesa="${d.id}">Editar</button>
        <button class="btn danger small" data-del="${d.id}">Excluir</button>
      </td>
    </tr>`).join('') : '<tr><td colspan="8" class="empty-state">Nenhuma despesa cadastrada</td></tr>'}</tbody>
  </table></div></div>`);
  c.appendChild(tableWrap);

  tableWrap.querySelectorAll('[data-sortcol]').forEach(th=>th.addEventListener('click', ()=>{
    const key = th.dataset.sortcol;
    if(window._despesaSort.key===key){ window._despesaSort.dir = window._despesaSort.dir==='asc'?'desc':'asc'; }
    else { window._despesaSort = {key, dir:'asc'}; }
    render();
  }));
  tableWrap.querySelectorAll('[data-editdespesa]').forEach(btn=>btn.addEventListener('click', ()=>{
    const d = DB.despesas.find(x=>x.id===btn.dataset.editdespesa);
    if(d && window._carregarDespesaParaEdicao) window._carregarDespesaParaEdicao(d);
  }));
  tableWrap.querySelectorAll('[data-del]').forEach(btn=>btn.addEventListener('click', async ()=>{
    if(!confirm('Excluir esta despesa?')) return;
    const d = DB.despesas.find(x=>x.id===btn.dataset.del);
    await db.collection('despesas').doc(d.id).delete();
    await auditLog('Excluiu', 'despesas', `Despesa "${d.descricao}" (${fmtMoney(d.valor)})`);
  }));
}

/* ==================== CLIENTES ==================== */
function renderClientes(c){
  let editingClienteId = null;

  c.appendChild(el(`<div class="section-title" id="clienteFormTitle">Novo Cliente</div>`));
  const formTitle = c.querySelector('#clienteFormTitle');
  const form = el(`<div class="frame">
    <div class="form-grid">
      <div><label>Nome</label><input type="text" id="f_nome"></div>
      <div><label>Contato</label><input type="text" id="f_contato" placeholder="Telefone/WhatsApp"></div>
      <div><label>Observações</label><input type="text" id="f_obs"></div>
    </div>
    <button class="btn" id="btnAdd">+ Adicionar Cliente</button>
    <button class="btn secondary" id="btnCancelEditCliente" style="display:none;">Cancelar edição</button>
  </div>`);
  c.appendChild(form);
  const nomeInput = form.querySelector('#f_nome');
  const contatoInput = form.querySelector('#f_contato');
  const obsInput = form.querySelector('#f_obs');
  const btnAdd = form.querySelector('#btnAdd');
  const btnCancelEditCliente = form.querySelector('#btnCancelEditCliente');

  function limparFormCliente(){
    nomeInput.value=''; contatoInput.value=''; obsInput.value='';
    editingClienteId = null;
    formTitle.textContent = 'Novo Cliente';
    btnAdd.textContent = '+ Adicionar Cliente';
    btnCancelEditCliente.style.display = 'none';
  }
  btnCancelEditCliente.addEventListener('click', limparFormCliente);

  btnAdd.addEventListener('click', async ()=>{
    const nome = nomeInput.value.trim();
    const contato = contatoInput.value.trim();
    const obs = obsInput.value.trim();
    if(!nome){ alert('Preencha o nome.'); return; }

    if(editingClienteId){
      const clienteAntigo = DB.clientes.find(cl=>cl.id===editingClienteId);
      try{
        await db.collection('clientes').doc(editingClienteId).update({ nome, contato, obs });
        await auditLog('Atualizou', 'clientes', `Cliente "${clienteAntigo.nome}" editado${clienteAntigo.nome!==nome?` (novo nome: "${nome}")`:''}`);

        if(clienteAntigo && clienteAntigo.nome !== nome){
          const atualizarReservas = confirm(`O nome mudou de "${clienteAntigo.nome}" para "${nome}".\n\nDeseja atualizar esse nome também nos pedidos já lançados anteriormente para essa pessoa?`);
          if(atualizarReservas){
            const afetadas = DB.reservas.filter(r=>normalizarNome(r.cliente)===normalizarNome(clienteAntigo.nome));
            for(const r of afetadas){
              await db.collection('reservas').doc(r.id).update({ cliente: nome });
            }
            await auditLog('Atualizou', 'reservas', `Nome do cliente atualizado em ${afetadas.length} pedido(s): "${clienteAntigo.nome}" → "${nome}"`);
          }
        }
        limparFormCliente();
      }catch(e){ alert('Não foi possível salvar as alterações.'); console.error(e); }
      return;
    }

    await db.collection('clientes').add({ nome, contato, obs });
    await auditLog('Criou', 'clientes', `Cliente "${nome}"`);
    nomeInput.value=''; contatoInput.value=''; obsInput.value='';
  });

  c.appendChild(el(`<div class="section-title">Clientes Cadastrados</div>`));
  const list = [...DB.clientes].sort((a,b)=>a.nome.localeCompare(b.nome));
  const tableWrap = el(`<div class="frame" style="padding:0;"><div class="table-wrap"><table>
    <thead><tr><th>Nome</th><th>Contato</th><th>Observações</th><th>Total Comprado</th><th></th></tr></thead>
    <tbody>${list.length? list.map(cl=>{
      const total = DB.reservas.filter(r=>r.cliente.toLowerCase()===cl.nome.toLowerCase()).reduce((s,r)=>s+valorReserva(r),0);
      return `<tr data-id="${cl.id}"><td>${escapeHtml(cl.nome)}</td><td>${escapeHtml(cl.contato)}${whatsappBtn(cl.contato)}</td><td>${escapeHtml(cl.obs)}</td><td>${fmtMoney(total)}</td>
      <td style="white-space:nowrap;"><button class="btn secondary small" data-edit="${cl.id}">Editar</button> <button class="btn danger small" data-del="${cl.id}">Excluir</button></td></tr>`;
    }).join('') : '<tr><td colspan="5" class="empty-state">Nenhum cliente cadastrado</td></tr>'}</tbody>
  </table></div></div>`);
  c.appendChild(tableWrap);

  tableWrap.querySelectorAll('[data-edit]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const cl = DB.clientes.find(x=>x.id===btn.dataset.edit);
      nomeInput.value = cl.nome; contatoInput.value = cl.contato||''; obsInput.value = cl.obs||'';
      editingClienteId = cl.id;
      formTitle.textContent = `Editar Cliente — ${cl.nome}`;
      btnAdd.textContent = 'Salvar Alterações';
      btnCancelEditCliente.style.display = 'inline-block';
      form.scrollIntoView({behavior:'smooth', block:'start'});
    });
  });
  tableWrap.querySelectorAll('[data-del]').forEach(btn=>btn.addEventListener('click', async ()=>{
    if(!confirm('Excluir este cliente?')) return;
    const cl = DB.clientes.find(x=>x.id===btn.dataset.del);
    await db.collection('clientes').doc(cl.id).delete();
    await auditLog('Excluiu', 'clientes', `Cliente "${cl.nome}"`);
  }));
}

/* ==================== AUDITORIA ==================== */
function renderAuditoria(c){
  c.appendChild(el(`<div class="section-title">Histórico de Auditoria</div>`));
  c.appendChild(el(`<div class="small-note" style="margin-bottom:16px;">Registro automático de tudo que é criado, alterado ou excluído no sistema — mostrando quem fez, o quê e quando.</div>`));

  const usuarios = [...new Set(DB.auditoria.map(a=>a.nome))].sort();
  window._filtroAuditUsuario = window._filtroAuditUsuario || '';
  const filterWrap = el(`<div class="filters-row">
    <div><label>Usuário</label><select id="filtUsuario"><option value="">Todos</option>${usuarios.map(u=>`<option ${window._filtroAuditUsuario===u?'selected':''}>${escapeHtml(u)}</option>`).join('')}</select></div>
  </div>`);
  c.appendChild(filterWrap);
  filterWrap.querySelector('#filtUsuario').addEventListener('change', e=>{ window._filtroAuditUsuario = e.target.value; render(); });

  let list = [...DB.auditoria];
  if(window._filtroAuditUsuario){ list = list.filter(a=>a.nome===window._filtroAuditUsuario); }

  const tableWrap = el(`<div class="frame" style="padding:0;"><div class="table-wrap"><table>
    <thead><tr><th>Quando</th><th>Usuário</th><th>Ação</th><th>Área</th><th>Detalhes</th></tr></thead>
    <tbody>${list.length? list.map(a=>`<tr>
      <td style="white-space:nowrap;">${fmtWhen(a.timestamp)}</td>
      <td>${escapeHtml(a.nome)}</td>
      <td><span class="badge acao-${(a.acao||'').toLowerCase()}">${a.acao}</span></td>
      <td>${escapeHtml(a.colecao)}</td>
      <td>${escapeHtml(a.resumo)}</td>
    </tr>`).join('') : '<tr><td colspan="5" class="empty-state">Nenhum registro ainda</td></tr>'}</tbody>
  </table></div></div>`);
  c.appendChild(tableWrap);
}

/* ==================== EQUIPE (somente admin) ==================== */
function renderEquipe(c){
  c.appendChild(el(`<div class="section-title">Gerenciar Equipe</div>`));
  c.appendChild(el(`<div class="small-note" style="margin-bottom:16px;">Só e-mails cadastrados aqui conseguem entrar no sistema. "Administrador" vê tudo, inclusive Auditoria e Equipe. Para "Equipe", você escolhe abaixo se a pessoa também pode cadastrar/editar Eventos e Cardápio (por padrão, não pode).</div>`));

  const form = el(`<div class="frame">
    <div class="form-grid">
      <div><label>E-mail (Google)</label><input type="email" id="f_email" placeholder="pessoa@gmail.com"></div>
      <div><label>Nome</label><input type="text" id="f_nome"></div>
      <div><label>Papel</label><select id="f_papel"><option value="equipe">Equipe</option><option value="admin">Administrador</option></select></div>
    </div>
    <div id="permWrap" style="display:flex; gap:20px; margin:6px 0 14px;">
      <label style="display:flex; align-items:center; gap:6px; text-transform:none; font-size:13.5px;"><input type="checkbox" id="f_permEventos" style="width:auto;"> Pode editar Eventos</label>
      <label style="display:flex; align-items:center; gap:6px; text-transform:none; font-size:13.5px;"><input type="checkbox" id="f_permCardapio" style="width:auto;"> Pode editar Cardápio</label>
    </div>
    <button class="btn" id="btnAdd">+ Adicionar / Atualizar Acesso</button>
    <button class="btn secondary" id="btnCancelEditEquipe" style="display:none;">Cancelar edição</button>
  </div>`);
  c.appendChild(form);

  const papelSel = form.querySelector('#f_papel');
  const permWrap = form.querySelector('#permWrap');
  function refreshPermWrap(){ permWrap.style.opacity = papelSel.value==='admin' ? '0.4' : '1'; }
  papelSel.addEventListener('change', refreshPermWrap);
  refreshPermWrap();

  let editingEmail = null;
  function limparFormEquipe(){
    form.querySelector('#f_email').value=''; form.querySelector('#f_email').removeAttribute('readonly');
    form.querySelector('#f_nome').value=''; papelSel.value='equipe';
    form.querySelector('#f_permEventos').checked=false; form.querySelector('#f_permCardapio').checked=false;
    editingEmail = null; refreshPermWrap();
    form.querySelector('#btnAdd').textContent = '+ Adicionar / Atualizar Acesso';
    form.querySelector('#btnCancelEditEquipe').style.display = 'none';
  }
  form.querySelector('#btnCancelEditEquipe').addEventListener('click', limparFormEquipe);

  form.querySelector('#btnAdd').addEventListener('click', async ()=>{
    const email = (editingEmail || form.querySelector('#f_email').value.trim().toLowerCase());
    const nome = form.querySelector('#f_nome').value.trim();
    const papel = papelSel.value;
    const permissoes = { eventos: form.querySelector('#f_permEventos').checked, cardapio: form.querySelector('#f_permCardapio').checked };
    if(!email || !email.includes('@') || !nome){ alert('Preencha e-mail válido e nome.'); return; }
    try{
      await db.collection('equipe').doc(email).set({ nome, papel, permissoes }, {merge:true});
      await auditLog(editingEmail?'Atualizou':'Criou', 'equipe', `Acesso de ${nome} (${email}): papel ${papel}, permissões ${JSON.stringify(permissoes)}`);
      limparFormEquipe();
    }catch(e){ alert('Não foi possível salvar. Confira se você é administrador.'); console.error(e); }
  });

  c.appendChild(el(`<div class="section-title">Pessoas com Acesso</div>`));
  const list = [...DB.equipe].sort((a,b)=>(a.nome||'').localeCompare(b.nome||''));
  const tableWrap = el(`<div class="frame" style="padding:0;"><div class="table-wrap"><table>
    <thead><tr><th>Nome</th><th>E-mail</th><th>Papel</th><th>Eventos</th><th>Cardápio</th><th></th></tr></thead>
    <tbody>${list.length? list.map(u=>{
      const perm = u.permissoes||{};
      const isU_admin = u.papel==='admin';
      return `<tr data-id="${u.id}">
      <td>${escapeHtml(u.nome||'')}</td><td>${escapeHtml(u.id)}</td>
      <td><span class="badge ${isU_admin?'sim':'nao'}">${isU_admin?'Administrador':'Equipe'}</span></td>
      <td><span class="badge ${(isU_admin||perm.eventos)?'sim':'nao'}">${(isU_admin||perm.eventos)?'Sim':'Não'}</span></td>
      <td><span class="badge ${(isU_admin||perm.cardapio)?'sim':'nao'}">${(isU_admin||perm.cardapio)?'Sim':'Não'}</span></td>
      <td style="white-space:nowrap;">
        <button class="btn secondary small" data-edit="${u.id}">Editar</button>
        <button class="btn secondary small" data-toggle="${u.id}">${isU_admin?'Tornar Equipe':'Tornar Admin'}</button>
        <button class="btn danger small" data-del="${u.id}">Remover Acesso</button>
      </td>
    </tr>`;}).join('') : '<tr><td colspan="6" class="empty-state">Nenhuma pessoa cadastrada</td></tr>'}</tbody>
  </table></div></div>`);
  c.appendChild(tableWrap);

  tableWrap.querySelectorAll('[data-edit]').forEach(btn=>btn.addEventListener('click', ()=>{
    const u = DB.equipe.find(x=>x.id===btn.dataset.edit);
    form.querySelector('#f_email').value = u.id;
    form.querySelector('#f_email').setAttribute('readonly','readonly');
    form.querySelector('#f_nome').value = u.nome||'';
    papelSel.value = u.papel==='admin' ? 'admin' : 'equipe';
    form.querySelector('#f_permEventos').checked = !!(u.permissoes&&u.permissoes.eventos);
    form.querySelector('#f_permCardapio').checked = !!(u.permissoes&&u.permissoes.cardapio);
    editingEmail = u.id;
    refreshPermWrap();
    form.querySelector('#btnAdd').textContent = 'Salvar Alterações';
    form.querySelector('#btnCancelEditEquipe').style.display = 'inline-block';
    form.scrollIntoView({behavior:'smooth', block:'start'});
  }));
  tableWrap.querySelectorAll('[data-toggle]').forEach(btn=>btn.addEventListener('click', async ()=>{
    const u = DB.equipe.find(x=>x.id===btn.dataset.toggle);
    const novoPapel = u.papel==='admin' ? 'equipe' : 'admin';
    try{
      await db.collection('equipe').doc(u.id).set({papel:novoPapel}, {merge:true});
      await auditLog('Atualizou', 'equipe', `Papel de ${u.nome} (${u.id}): ${u.papel||'equipe'} → ${novoPapel}`);
    }catch(e){ alert('Não foi possível alterar. Confira se você é administrador.'); }
  }));
  tableWrap.querySelectorAll('[data-del]').forEach(btn=>btn.addEventListener('click', async ()=>{
    if(!confirm('Remover o acesso desta pessoa? Ela não vai mais conseguir entrar no sistema.')) return;
    const u = DB.equipe.find(x=>x.id===btn.dataset.del);
    try{
      await db.collection('equipe').doc(u.id).delete();
      await auditLog('Excluiu', 'equipe', `Acesso removido de ${u.nome} (${u.id})`);
    }catch(e){ alert('Não foi possível remover. Confira se você é administrador.'); }
  }));
}
</script>
