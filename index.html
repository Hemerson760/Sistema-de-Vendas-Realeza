/* ==================== CONFIGURAÇÃO VISUAL DOS GRÁFICOS ====================
   Padrão compartilhado por todos os gráficos (Chart.js) do sistema. Existia um problema visual
   em vários lugares: com poucos dados (ex: um mês só, um evento só), o Chart.js por padrão estica
   a barra pra ocupar quase todo o espaço disponível, ficando gigante e esteticamente estranha —
   era exatamente o caso do gráfico "Evolução Mensal" com um mês só de dado, que também misturava
   uma barra com uma linha de 1 ponto só (aparecia como um pontinho solto no meio do gráfico, sem
   nenhuma linha de verdade pra desenhar). Esta seção padroniza espessura máxima de barra e
   espaçamento entre elas em todo o sistema, e o gráfico de Evolução Mensal passou a mostrar
   Receita/Despesa/Lucro como três barras (igual ao gráfico de "Comparativo por Tipo de Evento"),
   em vez de misturar barra com linha — mais consistente e sem o artefato do ponto solto. */
const CHART_BAR = { maxBarThickness: 46, categoryPercentage: 0.55, barPercentage: 0.82, borderRadius: 5, borderSkipped: false };
const CHART_BAR_H = { maxBarThickness: 28, categoryPercentage: 0.6, barPercentage: 0.78, borderRadius: 5, borderSkipped: false };
const CHART_FONT = { family: "'Inter', sans-serif", size: 11.5 };
function chartOpts(extra){
  const base = {
    responsive: true,
    maintainAspectRatio: false,
    layout: { padding: { top: 6 } },
    plugins: {
      legend: { position:'bottom', labels:{ boxWidth:11, boxHeight:11, padding:14, font:CHART_FONT, color:'#7a6c52' } },
      tooltip: { backgroundColor:'#33291a', titleFont:CHART_FONT, bodyFont:CHART_FONT, padding:10, cornerRadius:6, boxPadding:4 },
    },
    scales: {
      x: { grid:{ color:'rgba(0,0,0,0.05)', drawTicks:false }, ticks:{ font:CHART_FONT, color:'#7a6c52' }, border:{display:false} },
      y: { grid:{ color:'rgba(0,0,0,0.05)', drawTicks:false }, ticks:{ font:CHART_FONT, color:'#7a6c52' }, border:{display:false} },
    },
  };
  if(!extra) return base;
  return {
    ...base, ...extra,
    plugins: { ...base.plugins, ...(extra.plugins||{}), legend:{...base.plugins.legend, ...((extra.plugins||{}).legend||{})}, tooltip:{...base.plugins.tooltip, ...((extra.plugins||{}).tooltip||{})} },
    scales: extra.scales===null ? undefined : { ...base.scales, ...(extra.scales||{}) },
  };
}

/* ==================== INÍCIO (DASHBOARD GERAL) ====================
   O que importa primeiro no topo (caixa, lucro, quem deve, próxima cantina) e o resto
   rolando a tela. Tocar em "A receber" abre a lista de devedores separada por cantina. */
function margemPct(receita, despesa){ const lucro=receita-despesa; return receita>0 ? (lucro/receita*100) : 0; }
function roiPct(receita, despesa){ return despesa>0 ? ((receita-despesa)/despesa*100) : (receita>0?100:0); }
function fmtPct(n){ return (Number(n)||0).toLocaleString('pt-BR',{maximumFractionDigits:1, minimumFractionDigits:0})+'%'; }
function saudacao(){ const h=new Date().getHours(); return h<12?'Bom dia':h<18?'Boa tarde':'Boa noite'; }
function primeiroNome(){ return String(userName()).split(/[\s@]/)[0]; }

function renderDashboardGeral(c){
  if(window._ui.dashView==='pendencias'){ renderPendenciasGerais(c); return; }
  const totalVendido = DB.reservas.reduce((s,r)=>s+valorReserva(r),0);
  const totalDespesas = DB.despesas.reduce((s,d)=>s+Number(d.valor),0);
  const lucro = totalVendido-totalDespesas;
  const qtdTotal = DB.reservas.reduce((s,r)=>s+(Number(r.qtd)||0),0);
  const pendentesPagamento = DB.reservas.filter(r=>statusPagamento(valorPagoDe(r), valorReserva(r))!=='Sim');
  const saldoPendenteTotal = pendentesPagamento.reduce((s,r)=>s+saldoPendente(r),0);
  const naoEntregues = DB.reservas.filter(r=>r.entregue==='Não').length;
  const resumoCaixa = calcularResumoCaixa();
  const contas = DB.contasCaixa.length ? calcularSaldoPorConta(construirMovimentosCaixa()).filter(x=>x.conta!=='Sem conta definida' || Math.abs(x.saldo)>0.004) : [];

  cabecalho(c, 'Visão geral', { eyebrow: `${saudacao()}, ${escapeHtml(primeiroNome())}` });

  c.appendChild(el(`<div class="hero" id="heroCaixa">
    <div class="between"><span class="lbl">Caixa atual</span>${contas.length?`<span class="htag">${ic('wallet',12,'#fff',2)} ${DB.contasCaixa.length} conta${DB.contasCaixa.length>1?'s':''}</span>`:''}</div>
    <div class="money" style="font-size:34px;margin-top:4px;position:relative;z-index:1;">${fmtMoney(resumoCaixa.saldo)}</div>
    <div class="row mt8 fs12 wrap" style="gap:14px;opacity:.95;"><span class="row" style="gap:4px;">${ic('down',14,'#DDF0D2',2.2)} Entrou ${fmtMoney(resumoCaixa.totalEntradas)}</span><span class="row" style="gap:4px;">${ic('up',14,'#F6D3CB',2.2)} Saiu ${fmtMoney(resumoCaixa.totalSaidas)}</span></div>
    ${contas.length?`<div class="row mt10 wrap" style="gap:7px;">${contas.map(x=>`<span class="htag">${escapeHtml(x.conta)} ${fmtMoney(x.saldo)}</span>`).join('')}</div>`:''}
    <div class="fs11 mt8" style="opacity:.8;position:relative;z-index:1;">Só o que já foi recebido — pedidos em aberto não entram.</div>
  </div>`));
  if(podeAbrir('caixa')) c.querySelector('#heroCaixa').classList.add('clickable'), c.querySelector('#heroCaixa').addEventListener('click', ()=>irPara('caixa'));

  const tiles = el(`<div class="grid2 wide4 mt10">
    <div class="tile"><div class="lbl">Total vendido</div><div class="v">${fmtMoney(totalVendido)}</div><div class="sub mt4">${qtdTotal} unidade${qtdTotal===1?'':'s'}</div></div>
    <div class="tile"><div class="lbl">Lucro</div><div class="v ${lucro>=0?'ok':'warn'}">${fmtMoney(lucro)}</div><div class="sub mt4"><span class="tag ${lucro>=0?'ok':'warn'}">${fmtPct(margemPct(totalVendido,totalDespesas))} de margem</span></div></div>
    <div class="tile ${saldoPendenteTotal>0?'alert':''} clickable" id="tileReceber"><div class="lbl">A receber</div><div class="v ${saldoPendenteTotal>0?'warn':''}">${fmtMoney(saldoPendenteTotal)}</div><div class="sub mt4">${pendentesPagamento.length} pedido${pendentesPagamento.length===1?'':'s'} em aberto ${ic('chev',12)}</div></div>
    <div class="tile"><div class="lbl">Não entregues</div><div class="v">${naoEntregues}</div><div class="sub mt4">pedidos ainda não retirados</div></div>
  </div>`);
  c.appendChild(tiles);
  tiles.querySelector('#tileReceber').addEventListener('click', ()=>{ window._ui.dashView='pendencias'; render(); window.scrollTo(0,0); });

  // Próxima cantina
  const opts = eventosOptions();
  const proxKey = eventoAtualPadrao(opts);
  const prox = opts.find(o=>o.value===proxKey);
  if(prox){
    const rs = DB.reservas.filter(r=>r.data===prox.data && r.tipo===prox.tipo);
    const vend = rs.reduce((s,r)=>s+valorReserva(r),0), rec = rs.reduce((s,r)=>s+valorPagoDe(r),0);
    const pct = vend>0 ? Math.round(rec/vend*100) : 0;
    const dias = diasAte(prox.data);
    c.appendChild(el(`<div class="sechead"><span class="h3">Próxima cantina</span>${podeAbrir('dashboardEvento')?`<a data-abrir-prox>Abrir</a>`:''}</div>`));
    const card = el(`<div class="card pad row clickable" style="gap:13px;" data-abrir-prox>${dataBox(prox.data)}
      <div class="grow"><div class="fw6 fs14 ell">${escapeHtml(prox.nomeEvento || prox.tipo)}</div><div class="sub">${diaSemana(prox.data)}${dias===0?' · hoje':dias===1?' · amanhã':` · em ${dias} dias`} · ${(prox.cultos||[]).join(' e ')||'—'}</div>
      <div class="between mt6 fs11"><span class="sub">${rs.length} pedido${rs.length===1?'':'s'} · ${fmtMoney(vend)}</span><span class="fw6 gold">${pct}% recebido</span></div>
      <div class="bar mt4"><i style="width:${pct}%"></i></div></div></div>`);
    c.appendChild(card);
    c.querySelectorAll('[data-abrir-prox]').forEach(x=>x.addEventListener('click', ()=>{
      if(!podeAbrir('dashboardEvento')) return;
      window._selEvento = prox.value; window._selEventoTocado = true; irPara('dashboardEvento');
    }));
  }

  // Quem está devendo (prévia)
  c.appendChild(el(`<div class="sechead"><span class="h3">Quem está devendo</span>${pendentesPagamento.length?`<a data-ver-pend>Ver ${pendentesPagamento.length>1?'os '+pendentesPagamento.length:'1'}</a>`:''}</div>`));
  if(!pendentesPagamento.length){
    c.appendChild(el(`<div class="card okbox pad fs13 fw6 ok">${ic('check',16,'var(--ok)',2.4)} Ninguém devendo — tudo pago!</div>`));
  } else {
    const ordenados = [...pendentesPagamento].sort((a,b)=> a.data===b.data ? saldoPendente(b)-saldoPendente(a) : (a.data<b.data?1:-1));
    let html='', ultimo='';
    ordenados.slice(0,4).forEach(r=>{
      const k = eventoKey(r.data,r.tipo);
      if(k!==ultimo){ html += `<div class="lbl lbl-sep" style="color:var(--gold);">${escapeHtml(nomeDoEvento(r))} · ${fmtDataCurta(r.data)}</div>`; ultimo=k; }
      html += `<div class="li"><div class="avatar sm">${escapeHtml(iniciais(r.cliente))}</div><div class="m"><div class="t1 ell">${escapeHtml(r.cliente)}</div><div class="t2">${escapeHtml(r.item)}${r.versao?' '+escapeHtml(r.versao):''} ×${r.qtd} · ${statusPagamento(valorPagoDe(r),valorReserva(r))==='Parcial'?'<span class="gold">Parcial</span>':'<span class="warn">Não pago</span>'}</div></div><div class="money warn fs14">${fmtMoney(saldoPendente(r))}</div>${linkWa(contatoDoCliente(r.cliente))}</div>`;
    });
    c.appendChild(el(`<div class="box">${html}</div>`));
  }
  c.querySelectorAll('[data-ver-pend]').forEach(x=>x.addEventListener('click', ()=>{ window._ui.dashView='pendencias'; render(); window.scrollTo(0,0); }));

  // Vendas x despesas por mês
  const months = {};
  DB.reservas.forEach(r=>{ if(!r.data) return; const k=r.data.slice(0,7); months[k]=months[k]||{receita:0,despesa:0}; months[k].receita+=valorReserva(r); });
  DB.despesas.forEach(d=>{ if(!d.data) return; const k=d.data.slice(0,7); months[k]=months[k]||{receita:0,despesa:0}; months[k].despesa+=Number(d.valor); });
  const monthKeys = Object.keys(months).sort().slice(-8);
  if(monthKeys.length){
    c.appendChild(el(`<div class="sechead"><span class="h3">Vendas x despesas por mês</span></div>`));
    c.appendChild(el(`<div class="chart-box"><canvas id="chartMensal"></canvas></div>`));
  }

  // Cantinas que mais deram lucro
  const eventoStats = DB.eventos.map(e=>{
    const resev = DB.reservas.filter(r=>r.data===e.data && r.tipo===e.tipo);
    const desev = DB.despesas.filter(d=>d.data===e.data && d.tipo===e.tipo);
    const receita = resev.reduce((s,r)=>s+valorReserva(r),0);
    const despesa = desev.reduce((s,d)=>s+Number(d.valor),0);
    return { label: `${e.nomeEvento||e.tipo} · ${fmtDataCurta(e.data)}`, receita, despesa, lucro: receita-despesa, qtd: resev.reduce((s,r)=>s+(Number(r.qtd)||0),0) };
  }).filter(e=>e.receita>0 || e.despesa>0).sort((a,b)=>b.lucro-a.lucro);
  if(eventoStats.length){
    const mostrarTodos = !!window._ui.verTodosEventos;
    const lista = mostrarTodos ? eventoStats : eventoStats.slice(0,5);
    const max = Math.max(...eventoStats.map(e=>Math.abs(e.lucro)), 1);
    c.appendChild(el(`<div class="sechead"><span class="h3">Cantinas que mais deram lucro</span>${eventoStats.length>5?`<a data-toggle-ev>${mostrarTodos?'Ver menos':'Ver todas ('+eventoStats.length+')'}</a>`:''}</div>`));
    c.appendChild(el(`<div class="card pad">${lista.map((e,i)=>`<div class="${i?'mt12':''}"><div class="between fs12"><span class="fw6 ell">${i+1}. ${escapeHtml(e.label)}</span><span class="fw6 ${e.lucro>=0?'ok':'warn'}">${fmtMoney(e.lucro)}</span></div><div class="bar mt4 ${e.lucro<0?'warn':''}"><i style="width:${Math.max(3,Math.abs(e.lucro)/max*100)}%"></i></div><div class="sub fs11 mt4">Vendeu ${fmtMoney(e.receita)} · gastou ${fmtMoney(e.despesa)} · ${fmtPct(margemPct(e.receita,e.despesa))} de margem</div></div>`).join('')}</div>`));
    const t = c.querySelector('[data-toggle-ev]'); if(t) t.addEventListener('click', ()=>{ window._ui.verTodosEventos = !mostrarTodos; render(); });
  }

  // Itens mais vendidos
  const itemAgg = {};
  DB.reservas.forEach(r=>{ itemAgg[r.item]=itemAgg[r.item]||{qtd:0,valor:0}; itemAgg[r.item].qtd+=Number(r.qtd)||0; itemAgg[r.item].valor+=valorReserva(r); });
  const ranking = Object.entries(itemAgg).sort((a,b)=>b[1].qtd-a[1].qtd).slice(0,6);
  if(ranking.length){
    const maxQ = Math.max(...ranking.map(r=>r[1].qtd),1);
    c.appendChild(el(`<div class="sechead"><span class="h3">Itens mais vendidos</span></div>`));
    c.appendChild(el(`<div class="card pad">${ranking.map(([n,v],i)=>`<div class="${i?'mt12':''}"><div class="between fs12"><span class="fw6 ell">${escapeHtml(n)}</span><span><b>${v.qtd}</b> <span class="sub">un · ${fmtMoney(v.valor)} · ${fmtPct(totalVendido? v.valor/totalVendido*100:0)}</span></span></div><div class="bar mt4"><i style="width:${v.qtd/maxQ*100}%"></i></div></div>`).join('')}</div>`));
  }

  // Por tipo de evento
  const tipos = [...new Set(DB.eventos.map(e=>e.tipo).filter(Boolean))].sort();
  const compData = tipos.map(t=>({ tipo:t,
    receita: DB.reservas.filter(r=>r.tipo===t).reduce((s,r)=>s+valorReserva(r),0),
    despesa: DB.despesas.filter(d=>d.tipo===t).reduce((s,d)=>s+Number(d.valor),0) })).filter(x=>x.receita||x.despesa);
  if(compData.length>1){
    c.appendChild(el(`<div class="sechead"><span class="h3">Por tipo de evento</span></div>`));
    c.appendChild(el(`<div class="box">${compData.map(x=>`<div class="li"><div class="m"><div class="t1">${escapeHtml(x.tipo)}</div><div class="t2">Vendeu ${fmtMoney(x.receita)} · gastou ${fmtMoney(x.despesa)}</div></div><div class="rt ${x.receita-x.despesa>=0?'ok':'warn'}">${fmtMoney(x.receita-x.despesa)}<div class="sub fs11" style="font-weight:500;">${fmtPct(margemPct(x.receita,x.despesa))}</div></div></div>`).join('')}</div>`));
  }

  if(monthKeys.length){
    charts.mensal = new Chart(document.getElementById('chartMensal'), {
      type:'bar',
      data:{ labels: monthKeys.map(k=>monthLabel(k+'-01')), datasets:[
        {label:'Vendas', data: monthKeys.map(k=>months[k].receita), backgroundColor: ministerioAtual.corGold, ...CHART_BAR},
        {label:'Despesas', data: monthKeys.map(k=>months[k].despesa), backgroundColor:'#C08B6E', ...CHART_BAR},
        {label:'Lucro', data: monthKeys.map(k=>months[k].receita-months[k].despesa), backgroundColor:'#5C7A4B', ...CHART_BAR},
      ]},
      options: chartOpts()
    });
  }
}
function nomeDoEvento(r){
  const ev = DB.eventos.find(e=>e.data===r.data && e.tipo===r.tipo);
  return (ev && ev.nomeEvento) ? ev.nomeEvento : (r.tipo || 'Sem evento');
}

/* Lista completa de quem deve, de todas as cantinas, com subtotal por cantina (ou por cliente). */
function renderPendenciasGerais(c){
  const pend = DB.reservas.filter(r=>statusPagamento(valorPagoDe(r), valorReserva(r))!=='Sim');
  const total = pend.reduce((s,r)=>s+saldoPendente(r),0);
  const nCantinas = new Set(pend.map(r=>eventoKey(r.data,r.tipo))).size;
  cabecalho(c, 'A receber', { voltar: ()=>{ delete window._ui.dashView; render(); }, voltarTexto:'Início' });
  c.appendChild(el(`<div class="card alert pad between"><div><div class="lbl">Total em aberto</div><div class="money warn" style="font-size:26px;">${fmtMoney(total)}</div></div><div class="right"><div class="fw7 fs14">${pend.length} pedido${pend.length===1?'':'s'}</div><div class="sub">em ${nCantinas} cantina${nCantinas===1?'':'s'}</div></div></div>`));
  const visao = window._ui.pendVisao || 'cantina';
  const seg = segmentado([['cantina','Por cantina'],['cliente','Por cliente']], visao, v=>{ window._ui.pendVisao=v; render(); });
  seg.classList.add('mt12','mb12'); c.appendChild(seg);
  if(!pend.length){ c.appendChild(el(`<div class="card okbox pad fs13 fw6 ok">${ic('check',16,'var(--ok)',2.4)} Ninguém devendo — tudo pago!</div>`)); return; }
  const grupos = {};
  pend.forEach(r=>{
    const k = visao==='cantina' ? eventoKey(r.data,r.tipo) : normalizarNome(r.cliente);
    grupos[k] = grupos[k] || { titulo: visao==='cantina' ? nomeDoEvento(r) : r.cliente, sub: visao==='cantina' ? fmtDateBR(r.data) : contatoDoCliente(r.cliente), data:r.data, itens:[], total:0 };
    grupos[k].itens.push(r); grupos[k].total += saldoPendente(r);
  });
  const lista = Object.values(grupos).sort((a,b)=> visao==='cantina' ? (a.data<b.data?1:-1) : b.total-a.total);
  lista.forEach(g=>{
    c.appendChild(el(`<div class="grp"><div class="gh"><span class="lbl" style="color:var(--ink);">${escapeHtml(g.titulo)} <span class="sub" style="text-transform:none;letter-spacing:0;font-weight:500;">${g.sub?'· '+escapeHtml(g.sub):''}</span></span><span class="fw7 fs13 warn">${fmtMoney(g.total)}</span></div>
      <div class="box">${g.itens.sort((a,b)=>saldoPendente(b)-saldoPendente(a)).map(r=>`<div class="li"><div class="m"><div class="t1 ell">${escapeHtml(visao==='cantina'?r.cliente:r.item+(r.versao?' — '+r.versao:''))}</div><div class="t2">${visao==='cantina'?escapeHtml(r.item)+(r.versao?' — '+escapeHtml(r.versao):'')+' ×'+r.qtd:escapeHtml(nomeDoEvento(r))+' · '+fmtDataCurta(r.data)+' · ×'+r.qtd}</div></div>${tagPagamento(r)}<div class="rt warn" style="min-width:76px;">${fmtMoney(saldoPendente(r))}</div>${visao==='cantina'?linkWa(contatoDoCliente(r.cliente)):''}</div>`).join('')}
      ${visao==='cliente'?`<div class="li tot" style="justify-content:flex-end;gap:8px;">${linkWa(contatoDoCliente(g.titulo))}<span class="fs12 sub">Cobrar ${escapeHtml(String(g.titulo).split(' ')[0])}</span></div>`:''}</div></div>`));
  });
}

/* ==================== POR CANTINA (DASHBOARD POR EVENTO) ====================
   Faixa escura fixa mostrando qual cantina está aberta + três abas por assunto:
   Resumo (dinheiro), Produção (limites e sobras) e Pendências (cobrar / entregar). */
async function marcarPagoTotal(r){
  const total = valorReserva(r), antigo = valorPagoDe(r);
  const dataPagamento = proximaDataPagamento(total, antigo, r.dataPagamento);
  await col('reservas').doc(r.id).update({pago:'Sim', valorPago: total, dataPagamento});
  await auditLog('Atualizou', 'reservas', `Pagamento de ${r.cliente} (${r.item}): ${r.pago||'Não'} → Sim (recebido em ${fmtDateBR(dataPagamento)})`);
}
async function alternarEntregue(r){
  const novo = r.entregue==='Sim'?'Não':'Sim';
  await col('reservas').doc(r.id).update({entregue:novo});
  await auditLog('Atualizou', 'reservas', `Entrega de ${r.cliente} (${r.item}): ${r.entregue||'Não'} → ${novo}`);
}

function renderDashboardEvento(c){
  const opts = eventosOptions();
  cabecalho(c, 'Por cantina', { voltar: ()=>irPara('mais'), voltarTexto:'Mais' });
  if(opts.length===0){
    c.appendChild(el(`<div class="card pad empty-state">Cadastre um evento em "Eventos" para ver o resultado dele aqui.</div>`));
    return;
  }
  sincronizarSelecaoEvento(
    ()=>window._selEvento, v=>{window._selEvento=v;}, ()=>!!window._selEventoTocado, v=>{window._selEventoTocado=v;},
    opts
  );
  const ctx = el(`<div class="ctx">${ic('cal',19,'var(--gold-soft)')}<div class="grow"><div class="k">Cantina selecionada</div>
    <select id="eventoSelect"><option value="">— Selecione uma cantina —</option>${eventoOptionsHtml(opts, window._selEvento)}</select></div></div>`);
  c.appendChild(ctx);
  ctx.querySelector('#eventoSelect').addEventListener('change', e=>{ window._selEvento = e.target.value; window._selEventoTocado = true; render(); });

  if(!window._selEvento){
    c.appendChild(el(`<div class="card pad empty-state">A cantina mais próxima já passou — escolha acima qual evento você quer ver.</div>`));
    return;
  }
  const sel = opts.find(o=>o.value===window._selEvento);
  const resev = DB.reservas.filter(r=>r.data===sel.data && r.tipo===sel.tipo);
  const desev = DB.despesas.filter(d=>d.data===sel.data && d.tipo===sel.tipo);
  const totalVendido = resev.reduce((s,r)=>s+valorReserva(r),0);
  const totalRecebido = resev.reduce((s,r)=>s+valorPagoDe(r),0);
  const totalDespesa = desev.reduce((s,d)=>s+Number(d.valor),0);
  const lucro = totalVendido-totalDespesa;
  const qtdVendidaTotal = resev.reduce((s,r)=>s+(Number(r.qtd)||0),0);
  const clientesUnicos = new Set(resev.map(r=>String(r.cliente||'').trim().toLowerCase())).size;
  const ticketMedio = qtdVendidaTotal>0 ? totalVendido/qtdVendidaTotal : 0;
  const naoPagos = resev.filter(r=>statusPagamento(valorPagoDe(r), valorReserva(r))!=='Sim');
  const saldoPendenteEvento = naoPagos.reduce((s,r)=>s+saldoPendente(r),0);
  const naoEntregues = resev.filter(r=>r.entregue!=='Sim');
  const pctRec = totalVendido>0 ? Math.round(totalRecebido/totalVendido*100) : 0;

  const aba = window._ui.abaEvento || 'resumo';
  const seg = segmentado([['resumo','Resumo'],['producao','Produção'],['pendencias','Pendências']], aba, v=>{ window._ui.abaEvento=v; render(); });
  seg.classList.add('mb12'); c.appendChild(seg);

  if(aba==='resumo'){
    c.appendChild(el(`<div class="grp"><div class="gh"><span class="lbl">Vendas</span></div><div class="box">
      <div class="li"><div class="m"><div class="t1">Total vendido</div><div class="t2">${resev.length} pedido${resev.length===1?'':'s'} · ${qtdVendidaTotal} unidade${qtdVendidaTotal===1?'':'s'}</div></div><div class="rt">${fmtMoney(totalVendido)}</div></div>
      <div class="li"><div class="m"><div class="t1">Total recebido</div><div class="bar ok mt6" style="max-width:180px;"><i style="width:${pctRec}%"></i></div></div><div class="rt ok">${fmtMoney(totalRecebido)}<div class="sub fs11" style="font-weight:500;">${pctRec}%</div></div></div>
      <div class="li"><div class="m"><div class="t1">A receber</div><div class="t2">${naoPagos.length} pedido${naoPagos.length===1?'':'s'}</div></div><div class="rt ${saldoPendenteEvento>0?'warn':''}">${fmtMoney(saldoPendenteEvento)}</div></div>
      <div class="li"><div class="m"><div class="t1">Ticket médio</div><div class="t2">total vendido ÷ unidades</div></div><div class="rt">${fmtMoney(ticketMedio)}</div></div>
      <div class="li"><div class="m"><div class="t1">Clientes únicos</div></div><div class="rt">${clientesUnicos}</div></div>
    </div></div>`));
    c.appendChild(el(`<div class="grp"><div class="gh"><span class="lbl">Resultado</span></div><div class="box">
      <div class="li"><div class="m"><div class="t1">Despesas do evento</div><div class="t2">${desev.length} lançamento${desev.length===1?'':'s'}</div></div><div class="rt">${fmtMoney(totalDespesa)}</div></div>
      <div class="li tot"><div class="m"><div class="t1">Lucro</div><div class="t2">margem ${fmtPct(margemPct(totalVendido,totalDespesa))} · retorno ${fmtPct(roiPct(totalVendido,totalDespesa))}</div></div><div class="rt ${lucro>=0?'ok':'warn'}" style="font-size:16px;">${fmtMoney(lucro)}</div></div>
    </div></div>`));
    const horarios = [...new Set([...(sel.cultos||[]), ...resev.map(r=>r.horario)])].filter(Boolean);
    if(horarios.length){
      const linhas = horarios.map(h=>{ const rs=resev.filter(r=>r.horario===h); return `<tr><td class="fw6">${escapeHtml(h)}</td><td class="r">${rs.reduce((s,r)=>s+(Number(r.qtd)||0),0)}</td><td class="r">${fmtMoney(rs.reduce((s,r)=>s+valorReserva(r),0))}</td><td class="r">${rs.filter(r=>r.entregue==='Sim').length}/${rs.length}</td></tr>`; }).join('');
      c.appendChild(el(`<div class="grp"><div class="gh"><span class="lbl">Por horário</span></div><div class="box table-wrap"><table><thead><tr><th>Culto</th><th class="r">Qtd</th><th class="r">Valor</th><th class="r">Entregues</th></tr></thead><tbody>${linhas}</tbody></table></div></div>`));
    }
    return;
  }

  if(aba==='producao'){
    const itemAgg = {}; resev.forEach(r=>{ itemAgg[r.item]=itemAgg[r.item]||{qtd:0,valor:0}; itemAgg[r.item].qtd+=Number(r.qtd)||0; itemAgg[r.item].valor+=valorReserva(r); });
    const itemVersaoAgg = {}; resev.forEach(r=>{ const k=`${r.item}||${r.versao||''}`; itemVersaoAgg[k]=(itemVersaoAgg[k]||0)+(Number(r.qtd)||0); });
    const linhas = [];
    DB.cardapio.forEach(i=>{
      const vinculado = !(i.eventosVinculados||[]).length || i.eventosVinculados.includes(sel.id);
      if(!vinculado) return;
      if((i.versoes||[]).length){
        i.versoes.forEach(v=>{ if(v.limite>0) linhas.push({ label:`${i.item} — ${v.nome}`, limite:v.limite, vendido: itemVersaoAgg[`${i.item}||${v.nome}`]||0 }); });
      } else if(i.limite>0){ linhas.push({ label:i.item, limite:i.limite, vendido:(itemAgg[i.item]?.qtd)||0 }); }
    });
    if(linhas.length){
      const somaLimites = linhas.reduce((s,x)=>s+x.limite,0);
      const custoUn = somaLimites>0 ? totalDespesa/somaLimites : 0;
      let prejuizoTotal = 0;
      c.appendChild(el(`<div class="sechead" style="margin-top:4px;"><span class="h3">Produção x vendido</span><span class="sub">sobra estimada</span></div>`));
      c.appendChild(el(`<div class="card pad">${linhas.map((x,i)=>{
        const sobra = Math.max(0,x.limite-x.vendido), pct=Math.min(100, x.vendido/x.limite*100), excedeu = x.vendido>x.limite;
        const prej = sobra*custoUn; prejuizoTotal += prej;
        return `<div class="${i?'mt12':''}"><div class="between fs13"><span class="fw6">${escapeHtml(x.label)}</span><span><b>${x.vendido}</b><span class="sub"> de ${x.limite}</span></span></div><div class="bar mt4 ${excedeu?'warn':pct>=90?'ok':''}"><i style="width:${pct}%"></i></div><div class="sub fs11 mt4">${excedeu?`<span class="warn fw6">Passou ${x.vendido-x.limite} do limite</span>`:sobra>0?`Sobram ${sobra} · prejuízo est. ${fmtMoney(prej)}`:'Esgotado'}</div></div>`;
      }).join('')}${prejuizoTotal>0?`<div class="between mt14" style="border-top:1px solid var(--line-soft);padding-top:10px;"><span class="fs12 fw6">Prejuízo total estimado por sobra</span><span class="fw7 warn">${fmtMoney(prejuizoTotal)}</span></div>`:''}</div>`));
      c.appendChild(el(`<div class="small-note">"Prejuízo estimado" = despesa do evento ÷ capacidade total × unidades que sobraram (estimativa — o sistema não guarda o custo de cada item).</div>`));
    }
    const ranking = Object.entries(itemAgg).sort((a,b)=>b[1].qtd-a[1].qtd);
    c.appendChild(el(`<div class="sechead"><span class="h3">Itens vendidos</span></div>`));
    c.appendChild(el(`<div class="box">${ranking.length? ranking.map(([n,v])=>`<div class="li"><div class="m"><div class="t1">${escapeHtml(n)}</div><div class="t2">${fmtPct(totalVendido? v.valor/totalVendido*100:0)} do total</div></div><div class="rt">${v.qtd} un<div class="sub fs11" style="font-weight:500;">${fmtMoney(v.valor)}</div></div></div>`).join('') : '<div class="empty-state">Sem pedidos neste evento ainda</div>'}</div>`));
    return;
  }

  // Pendências
  const sub = window._ui.pendEvento || 'pagar';
  const seg2 = segmentado([['pagar',`A pagar · ${naoPagos.length}`],['retirar',`A retirar · ${naoEntregues.length}`]], sub, v=>{ window._ui.pendEvento=v; render(); }, 'gold');
  seg2.classList.add('mb12'); seg2.style.background='var(--gold-wash)'; c.appendChild(seg2);
  const podeMexer = podeEditar('reservas');

  const box = el(`<div class="box">${lista.length? lista.map(r=>`<div class="li"><div class="m"><div class="t1 ell">${escapeHtml(r.cliente)} ${sub==='pagar'?tagPagamento(r):''}</div><div class="t2">${escapeHtml(r.item)}${r.versao?' — '+escapeHtml(r.versao):''} ×${r.qtd} · ${escapeHtml(r.horario||'')}</div></div>
      ${sub==='pagar'?`<div class="rt warn">${fmtMoney(saldoPendente(r))}</div>`:''}${linkWa(contatoDoCliente(r.cliente))}
      ${podeMexer?(sub==='pagar'?`<button class="chip gold sm" data-pagar="${r.id}">${ic('check',12,'#fff',2.6)}Pago</button>`:`<button class="chip sm" data-entregar="${r.id}">${ic('box',12,'currentColor',2)}Entregue</button>`):''}</div>`).join('') : `<div class="empty-state">${sub==='pagar'?'Todo mundo pagou 🎉':'Tudo entregue 🎉'}</div>`}</div>`);
  c.appendChild(box);
  box.querySelectorAll('[data-pagar]').forEach(b=>b.addEventListener('click', async ()=>{ const r=DB.reservas.find(x=>x.id===b.dataset.pagar); if(r){ b.disabled=true; await marcarPagoTotal(r); } }));
  box.querySelectorAll('[data-entregar]').forEach(b=>b.addEventListener('click', async ()=>{ const r=DB.reservas.find(x=>x.id===b.dataset.entregar); if(r){ b.disabled=true; await alternarEntregue(r); } }));
  if(sub==='pagar' && lista.length){
    const rodape = el(`<div class="card pad between mt12"><div><div class="lbl">Total a receber</div><div class="money warn" style="font-size:21px;">${fmtMoney(saldoPendenteEvento)}</div></div><button class="btn dark sm" style="min-height:40px;">${ic('copy',16,'#F6EEDD')} Copiar lista</button></div>`);

      try{ await navigator.clipboard.writeText(texto); alert('Lista copiada — é só colar no WhatsApp.'); }catch(e){ prompt('Copie a lista abaixo:', texto); }
    });
    c.appendChild(rodape);

/* ==================== EVENTOS ====================
   Próximo evento em destaque, os já realizados com o lucro de cada um. Criar/editar abre
   uma folha com tipo e horários em botões (sem digitar "17h,19h" separado por vírgula). */
const TIPOS_EVENTO_PADRAO = ['Almoço','Cantina','Pastel','Outro'];

function resumoDoEvento(e){
  const rs = DB.reservas.filter(r=>r.data===e.data && r.tipo===e.tipo);
  const ds = DB.despesas.filter(d=>d.data===e.data && d.tipo===e.tipo);
  const vendido = rs.reduce((s,r)=>s+valorReserva(r),0), gasto = ds.reduce((s,d)=>s+Number(d.valor),0);
  const itens = DB.cardapio.filter(i=>i.ativo && (!(i.eventosVinculados||[]).length || i.eventosVinculados.includes(e.id))).length;
  return { pedidos: rs.length, vendido, gasto, lucro: vendido-gasto, itens };
}

function renderEventos(c){
  const perm = { criar: podeCriar('eventos'), editar: podeEditar('eventos'), excluir: podeExcluir('eventos') };
  telaSuja = false;
  cabecalho(c, 'Eventos', { voltar: ()=>irPara('mais'), voltarTexto:'Mais' });
  if(!perm.criar && !perm.editar) avisoSoConsulta(c, 'Eventos');

  const hoje = hojeStr();
  const futuros = DB.eventos.filter(e=>e.data>=hoje).sort((a,b)=>a.data.localeCompare(b.data));
  const passados = DB.eventos.filter(e=>e.data<hoje).sort((a,b)=>b.data.localeCompare(a.data));
  const statusTag = e => `<span class="tag ${e.status==='Encerrado'?'mute':'ok'}">${escapeHtml(e.status||'Aberto')}</span>`;

  c.appendChild(el(`<div class="sechead" style="margin-top:6px;"><span class="h3">Próximos</span><span class="sub">${futuros.length} evento${futuros.length===1?'':'s'}</span></div>`));
  if(!futuros.length){
    c.appendChild(el(`<div class="card pad empty-state">Nenhum evento futuro cadastrado${perm.criar?' — use o botão + para criar o próximo.':'.'}</div>`));
  }
  futuros.forEach((e,i)=>{
    const rs = resumoDoEvento(e);
    const dias = diasAte(e.data);
    if(i===0){
      c.appendChild(el(`<div class="card clickable mb10" data-ev="${e.id}" style="overflow:hidden;">
        <div class="pad row" style="gap:13px;">${dataBox(e.data)}<div class="grow"><div class="eyebrow" style="font-size:14px;">${diaSemana(e.data)} · ${dias===0?'hoje':dias===1?'amanhã':'daqui a '+dias+' dias'}</div><div class="h2 ell">${escapeHtml(e.nomeEvento||e.tipo)}</div>
          <div class="chips wrap mt6">${(e.cultos||[]).map(h=>`<span class="chip soft sm">${escapeHtml(h)}</span>`).join('')}<span class="tag mute" style="align-self:center;">${escapeHtml(e.tipo)}</span>${statusTag(e)}</div></div></div>
        <div class="grid3 center" style="border-top:1px solid var(--line-soft);padding:10px 15px;gap:4px;"><div><div class="lbl">Pedidos</div><div class="num fs14 mt4">${rs.pedidos}</div></div><div><div class="lbl">Vendido</div><div class="num fs14 mt4">${moneyCurto(rs.vendido)}</div></div><div><div class="lbl">Itens</div><div class="num fs14 mt4">${rs.itens}</div></div></div>
      </div>`));
    } else {
      c.appendChild(el(`<div class="card pad row clickable mb10" data-ev="${e.id}" style="gap:12px;">${dataBox(e.data)}<div class="grow"><div class="fw6 fs14 ell">${escapeHtml(e.nomeEvento||e.tipo)}</div><div class="sub">${escapeHtml(e.tipo)} · ${(e.cultos||[]).join(', ')||'—'} · ${rs.pedidos} pedido${rs.pedidos===1?'':'s'}</div></div>${statusTag(e)}</div>`));
    }
  });

  if(passados.length){
    c.appendChild(el(`<div class="sechead"><span class="h3">Já realizados</span><span class="sub">${passados.length}</span></div>`));
    passados.forEach(e=>{
      const rs = resumoDoEvento(e);
      c.appendChild(el(`<div class="card pad row clickable mb10" data-ev="${e.id}" style="gap:12px;">${dataBox(e.data,true)}<div class="grow"><div class="fw6 fs14 ell">${escapeHtml(e.nomeEvento||e.tipo)}</div><div class="sub">${escapeHtml(e.tipo)} · ${rs.pedidos} pedido${rs.pedidos===1?'':'s'}</div></div><div class="right"><div class="lbl">Lucro</div><div class="money fs14 ${rs.lucro>=0?'ok':'warn'}">${fmtMoney(rs.lucro)}</div></div></div>`));
    });
  }
  c.querySelectorAll('[data-ev]').forEach(card=>card.addEventListener('click', ()=>{
    const ev = DB.eventos.find(x=>x.id===card.dataset.ev);
    if(ev) abrirFormEvento(ev, perm);
  }));
  if(perm.criar) definirFab(null, ()=>abrirFormEvento(null, perm), 'fabNovoEvento');
}

function abrirFormEvento(ev, perm){
  const editando = !!ev;
  const somenteVer = editando ? !perm.editar : !perm.criar;
  const tiposSugeridos = [...new Set([...TIPOS_EVENTO_PADRAO.filter(t=>t!=='Outro'), ...DB.eventos.map(e=>e.tipo).filter(Boolean)])];
  const tipoAtual = ev ? ev.tipo : 'Almoço';
  let cultos = ev ? [...(ev.cultos||[])] : [];
  const form = el(`<div>
    ${editando?(()=>{ const rs=resumoDoEvento(ev); return `<div class="card wash pad mb12"><div class="between fs13"><span>Vendido <b>${fmtMoney(rs.vendido)}</b></span><span>Gasto <b>${fmtMoney(rs.gasto)}</b></span><span class="${rs.lucro>=0?'ok':'warn'}">Lucro <b>${fmtMoney(rs.lucro)}</b></span></div></div>`; })():''}
    <label>Tipo</label>
    <div class="chips wrap mb12" id="tipoChips"></div>
    <input type="text" id="f_tipo" class="hide mb12" placeholder="Digite o tipo (ex: Bazar)" value="${escapeHtml(tipoAtual)}">
    <div class="grid2"><div class="field"><label>Data</label><input type="date" id="f_data" value="${ev?ev.data:''}"></div>
      <div class="field"><label>Status</label><select id="f_status" class="hide"><option>Aberto</option><option>Encerrado</option></select><div id="statusChips"></div></div></div>
    <div class="field"><label>Nome do evento (opcional)</label><input type="text" id="f_nome" placeholder="Ex: Culto da Família, Santa Ceia" value="${escapeHtml(ev?ev.nomeEvento||'':'')}"></div>
    <label>Cultos / horários de retirada</label>
    <div class="chips wrap" id="cultosChips"></div>
    <div class="row mt8"><input type="text" id="novoCulto" placeholder="Ex: 18h" style="max-width:140px;"><button type="button" class="btn ghost sm" id="btnAddCulto">+ horário</button></div>
    <input type="hidden" id="f_cultos">
    <button class="btn block mt16" id="btnAdd">${editando?'Salvar alterações':'Criar evento'}</button>
    ${editando && perm.excluir?`<button class="btn danger block mt8" id="btnDelEvento">${ic('trash',17,'var(--warn)')} Excluir evento</button>`:''}
  </div>`);
  const tipoInput = form.querySelector('#f_tipo');
  const tipoChips = form.querySelector('#tipoChips');
  function desenharTipos(){
    const outro = !tiposSugeridos.includes(tipoInput.value) || tipoInput.dataset.outro==='1';
    tipoChips.innerHTML = tiposSugeridos.map(t=>`<button type="button" class="chip ${!outro && tipoInput.value===t?'on':''}" data-tipo="${escapeHtml(t)}">${escapeHtml(t)}</button>`).join('') + `<button type="button" class="chip ${outro?'on':''}" data-tipo="__outro">+ Outro</button>`;
    tipoInput.classList.toggle('hide', !outro);
  }
  tipoChips.addEventListener('click', e=>{
    const b=e.target.closest('[data-tipo]'); if(!b) return;
    if(b.dataset.tipo==='__outro'){ tipoInput.dataset.outro='1'; if(tiposSugeridos.includes(tipoInput.value)) tipoInput.value=''; desenharTipos(); tipoInput.focus(); }
    else { tipoInput.dataset.outro=''; tipoInput.value=b.dataset.tipo; desenharTipos(); }
  });
  desenharTipos();
  const statusSel = form.querySelector('#f_status');
  statusSel.value = ev ? (ev.status||'Aberto') : 'Aberto';
  form.querySelector('#statusChips').appendChild((()=>{ const s=chipsDoSelect(statusSel); return s; })());
  const cultosChips = form.querySelector('#cultosChips');
  const cultosInput = form.querySelector('#f_cultos');
  function desenharCultos(){
    cultosChips.innerHTML = cultos.length ? cultos.map((h,i)=>`<button type="button" class="chip gold" data-rm="${i}">${ic('clock',13,'#fff',2)} ${escapeHtml(h)} ✕</button>`).join('') : `<span class="sub">Nenhum horário ainda — adicione pelo menos um.</span>`;
    cultosInput.value = cultos.join(',');
  }
  cultosChips.addEventListener('click', e=>{ const b=e.target.closest('[data-rm]'); if(!b) return; cultos.splice(Number(b.dataset.rm),1); desenharCultos(); });
  const novoCulto = form.querySelector('#novoCulto');
  function addCulto(){ const v=novoCulto.value.trim(); if(!v) return; v.split(',').map(s=>s.trim()).filter(Boolean).forEach(h=>{ if(!cultos.includes(h)) cultos.push(h); }); novoCulto.value=''; desenharCultos(); }
  form.querySelector('#btnAddCulto').addEventListener('click', addCulto);
  novoCulto.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); addCulto(); } });
  desenharCultos();
  if(somenteVer){ form.querySelectorAll('input,select,button').forEach(x=>{ if(x.id!=='btnDelEvento') x.disabled=true; }); form.querySelector('#btnAdd').classList.add('hide'); }

  form.querySelector('#btnAdd').addEventListener('click', async ()=>{
    if(editando ? !perm.editar : !perm.criar){ alert(editando ? 'Você não tem permissão para editar eventos.' : 'Você não tem permissão para cadastrar eventos.'); return; }
    addCulto();
    const data = form.querySelector('#f_data').value;
    const tipo = tipoInput.value.trim();
    const nomeEvento = form.querySelector('#f_nome').value.trim();
    const status = statusSel.value;
    if(!data || !tipo || !cultos.length){ alert('Preencha data, tipo e pelo menos um horário de culto.'); return; }
    const btn = form.querySelector('#btnAdd'); btn.disabled = true;
    try{
      if(editando){
        await col('eventos').doc(ev.id).update({ data, tipo, nomeEvento, cultos, status });
        await auditLog('Atualizou', 'eventos', `Evento ${fmtDateBR(data)} — ${tipo}${nomeEvento?` (${nomeEvento})`:''} editado`);
        if(ev.data!==data || ev.tipo!==tipo){
          const reservasAfetadas = DB.reservas.filter(r=>r.data===ev.data && r.tipo===ev.tipo);
          const despesasAfetadas = DB.despesas.filter(d=>d.data===ev.data && d.tipo===ev.tipo);
          if((reservasAfetadas.length || despesasAfetadas.length) && confirm(`A data/tipo deste evento mudou de "${fmtDateBR(ev.data)} — ${ev.tipo}" para "${fmtDateBR(data)} — ${tipo}".\n\nExistem ${reservasAfetadas.length} pedido(s) e ${despesasAfetadas.length} despesa(s) lançadas com os dados antigos. Deseja atualizá-los também para os novos dados?`)){
            for(const r of reservasAfetadas){ await col('reservas').doc(r.id).update({ data, tipo }); }
            for(const d of despesasAfetadas){ await col('despesas').doc(d.id).update({ data, tipo }); }
            await auditLog('Atualizou', 'eventos', `${reservasAfetadas.length} reserva(s) e ${despesasAfetadas.length} despesa(s) atualizadas para o novo evento`);
          }
        }
      } else {
        await col('eventos').add({ data, tipo, nomeEvento, cultos, status });
        await auditLog('Criou', 'eventos', `Evento ${fmtDateBR(data)} — ${tipo}${nomeEvento?` (${nomeEvento})`:''}`);
      }
      fecharFolhaERedesenhar();
    }catch(e){ btn.disabled=false; alert('Não foi possível salvar o evento.'); console.error(e); }
  });
  const btnDel = form.querySelector('#btnDelEvento');
  if(btnDel) btnDel.addEventListener('click', async ()=>{
    if(!confirm('Excluir este evento? (pedidos e despesas ligados a ele não serão apagados)')) return;
    await col('eventos').doc(ev.id).delete();
    await auditLog('Excluiu', 'eventos', `Evento ${fmtDateBR(ev.data)} — ${ev.tipo}`);
    fecharFolhaERedesenhar();
  });
  abrirFolha({ titulo: editando ? (somenteVer?'Evento':'Editar evento') : 'Novo evento', corpo: form });
}

/* ==================== CARDÁPIO ====================
   Lista agrupada por categoria (como um cardápio de verdade), com liga/desliga direto na
   linha. Editar abre uma folha com seções que abrem e fecham (versões, pacotes, escolhas,
   eventos) — só aparece o que for usado. */
function normalizarPacotes(faixasPreco){
  // Compatibilidade com itens salvos antes do ajuste de "pacote fechado"
  return (faixasPreco||[]).map(f=>({
    qtdBloco: Number(f.qtdBloco ?? f.qtdMinima ?? 0),
    precoBloco: Number(f.precoBloco ?? f.precoUnit ?? 0),
    validoAte: f.validoAte || null, // 'YYYY-MM-DD' ou null = sem data de validade
  })).filter(f=>f.qtdBloco>=2 && f.precoBloco>0);
}
function pacoteValidoParaData(pacote, dataRef){
  if(!pacote.validoAte) return true;
  if(!dataRef) return true;
  return dataRef <= pacote.validoAte;
}
function calcularValorTotal(item, qtd, dataRef){
  const base = Number(item.preco)||0;
  const pacotes = normalizarPacotes(item.faixasPreco).filter(p=>pacoteValidoParaData(p,dataRef)).sort((a,b)=>b.qtdBloco-a.qtdBloco);
  let restante = Math.max(0, Number(qtd)||0);
  let total = 0;
  for(const p of pacotes){
    if(p.qtdBloco>0 && p.precoBloco>0){
      const n = Math.floor(restante / p.qtdBloco);
      if(n>0){ total += n * p.precoBloco; restante -= n * p.qtdBloco; }
    }
  }
  total += restante * base;
  return total;
}
function calcularValorTotalDetalhado(item, qtd, dataRef){
  const base = Number(item.preco)||0;
  const todosPacotes = normalizarPacotes(item.faixasPreco);
  const pacotes = todosPacotes.filter(p=>pacoteValidoParaData(p,dataRef)).sort((a,b)=>b.qtdBloco-a.qtdBloco);
  const expirados = todosPacotes.filter(p=>!pacoteValidoParaData(p,dataRef));
  let restante = Math.max(0, Number(qtd)||0);
  let total = 0;
  const partes = [];
  for(const p of pacotes){
    if(p.qtdBloco>0 && p.precoBloco>0){
      const n = Math.floor(restante / p.qtdBloco);
      if(n>0){ total += n * p.precoBloco; restante -= n * p.qtdBloco; partes.push(`${n}× pacote de ${p.qtdBloco} = ${fmtMoney(n*p.precoBloco)}`); }
    }
  }
  if(restante>0){ total += restante * base; partes.push(`${restante} avulsa${restante>1?'s':''} × ${fmtMoney(base)}`); }
  if(expirados.length){ partes.push(`(pacote de ${expirados.map(p=>p.qtdBloco+'un').join(', ')} vencido em ${expirados.map(p=>fmtDateBR(p.validoAte)).join(', ')} — não aplicado)`); }
  return { total, texto: partes.join(' + ') };
}
/* ---- Ajuste manual (desconto/acréscimo) sobre o valor de um pedido ---- */
function calcularAjusteValor(tipo, valorDigitado, qtd, totalBase){
  const v = Number(valorDigitado);
  if(!tipo || tipo==='nenhum' || isNaN(v) || v===0) return 0;
  let resultado = 0;
  if(tipo==='valorUnidade') resultado = v * (Number(qtd)||0);
  else if(tipo==='percentual') resultado = (Number(totalBase)||0) * (v/100);
  else resultado = v;
  return Math.round(resultado*100)/100;
}
function descreverAjuste(tipo, valorDigitado, ajusteAplicado){
  if(!ajusteAplicado) return '';
  const sinalTxt = ajusteAplicado>0 ? 'Acréscimo' : 'Desconto';
  if(tipo==='percentual') return `${sinalTxt} de ${fmtPct(Math.abs(Number(valorDigitado)||0))} (${fmtMoney(Math.abs(ajusteAplicado))})`;
  if(tipo==='valorUnidade') return `${sinalTxt} de ${fmtMoney(Math.abs(Number(valorDigitado)||0))}/un (${fmtMoney(Math.abs(ajusteAplicado))} no total)`;
  return `${sinalTxt} de ${fmtMoney(Math.abs(ajusteAplicado))}`;
}
function precoResumoItem(i){
  const vs = i.versoes||[];
  if(vs.length){ const ps = vs.map(v=>Number(v.preco)||0); const mn=Math.min(...ps), mx=Math.max(...ps); return mn===mx?fmtMoney(mn):`${moneyCurto(mn)} a ${moneyCurto(mx)}`; }
  return fmtMoney(i.preco);
}
function metaItem(i){
  const partes = [];
  const vs = i.versoes||[];
  if(vs.length) partes.push(vs.map(v=>`${v.nome} ${moneyCurto(v.preco)}${v.limite?` (lim. ${v.limite})`:''}`).join(' · '));
  else if(i.limite) partes.push(`limite ${i.limite}/evento`);
  const pac = normalizarPacotes(i.faixasPreco);
  if(!vs.length && pac.length) partes.push(pac.map(p=>`${p.qtdBloco} por ${moneyCurto(p.precoBloco)}${p.validoAte?` até ${fmtDataCurta(p.validoAte)}`:''}`).join(' · '));
  if(i.temOpcoes && (i.opcoes||[]).length) partes.push('escolha: '+i.opcoes.map(o=>o.nome).join(', '));
  partes.push((i.eventosVinculados||[]).length ? `${i.eventosVinculados.length} evento(s) específico(s)` : 'todos os eventos');
  return partes.join(' · ');
}

function renderCardapio(c){
  const perm = { criar: podeCriar('cardapio'), editar: podeEditar('cardapio'), excluir: podeExcluir('cardapio') };
  telaSuja = false;
  cabecalho(c, 'Cardápio');
  if(!perm.criar && !perm.editar) avisoSoConsulta(c, 'Cardápio');
  const busca = el(`<div class="field"><input type="search" id="buscaCardapio" placeholder="Buscar item"></div>`);
  c.appendChild(busca);

  const grupos = {};
  DB.cardapio.forEach(i=>{ const k=(i.categoria||'').trim()||'Sem categoria'; (grupos[k]=grupos[k]||[]).push(i); });
  const nomesGrupos = Object.keys(grupos).sort((a,b)=> a==='Sem categoria'?1 : b==='Sem categoria'?-1 : a.localeCompare(b));
  if(!nomesGrupos.length) c.appendChild(el(`<div class="card pad empty-state">Nenhum item cadastrado ainda${perm.criar?' — use o botão + para cadastrar o primeiro.':'.'}</div>`));
  nomesGrupos.forEach(g=>{
    const itens = grupos[g].sort((a,b)=> (b.ativo?1:0)-(a.ativo?1:0) || a.item.localeCompare(b.item));
    const grp = el(`<div class="grp" data-grupo><div class="gh"><span class="lbl">${escapeHtml(g)} · ${itens.length}</span></div><div class="box">${itens.map(i=>`
      <div class="li clickable" data-item="${i.id}" data-busca="${escapeHtml(normalizarNome(i.item+' '+g))}" style="${i.ativo?'':'opacity:.55;'}">
        <div class="m"><div class="t1">${escapeHtml(i.item)}${i.ativo?'':' <span class="tag mute">inativo</span>'}</div><div class="t2">${escapeHtml(metaItem(i))}</div></div>
        <div class="rt">${precoResumoItem(i)}</div>
        <button class="sw ${i.ativo?'on':''}" data-ativo="${i.id}" ${perm.editar?'':'disabled'} title="${i.ativo?'Ativo — toque para pausar':'Pausado — toque para ativar'}" aria-label="Ativo"></button>
      </div>`).join('')}</div></div>`);
    c.appendChild(grp);
  });
  busca.querySelector('input').addEventListener('input', e=>{
    const q = normalizarNome(e.target.value);
    c.querySelectorAll('[data-item]').forEach(li=>{ li.style.display = !q || li.dataset.busca.includes(q) ? '' : 'none'; });
    c.querySelectorAll('[data-grupo]').forEach(g=>{ g.style.display = [...g.querySelectorAll('[data-item]')].some(li=>li.style.display!=='none') ? '' : 'none'; });
  });
  c.querySelectorAll('[data-ativo]').forEach(sw=>sw.addEventListener('click', async e=>{
    e.stopPropagation();
    if(!perm.editar) return;
    const i = DB.cardapio.find(x=>x.id===sw.dataset.ativo); if(!i) return;
    sw.disabled = true;
    await col('cardapio').doc(i.id).update({ ativo: !i.ativo });
    await auditLog('Atualizou', 'cardapio', `Item "${i.item}" ${i.ativo?'pausado (inativo)':'ativado'}`);
  }));
  c.querySelectorAll('[data-item]').forEach(li=>li.addEventListener('click', ()=>{
    const i = DB.cardapio.find(x=>x.id===li.dataset.item);
    if(i) abrirFormItem(i, perm);
  }));
  if(isAdmin()){
    const link = el(`<button class="linkbtn row" style="margin:6px auto 0;gap:6px;">${ic('tag',15,'var(--gold)')} Gerenciar categorias</button>`);
    link.addEventListener('click', ()=>irPara('categorias'));
    c.appendChild(link);
  }
  if(perm.criar) definirFab(null, ()=>abrirFormItem(null, perm), 'fabNovoItem');
}

function abrirFormItem(item, perm){
  const editando = !!item;
  const somenteVer = editando ? !perm.editar : !perm.criar;
  const st = {
    faixas: editando ? normalizarPacotes(item.faixasPreco) : [],
    opcoes: editando ? (item.opcoes||[]).map(o=>({nome:o.nome, tipo:o.tipo, alternativasRaw:(o.alternativas||[]).join(', ')})) : [],
    eventosVinculados: editando ? [...(item.eventosVinculados||[])] : [],
    versoes: editando ? (item.versoes||[]).map(v=>({nome:v.nome, preco:v.preco, limite:(v.limite===null||v.limite===undefined)?null:v.limite})) : [],
  };
  const form = el(`<div>
    <div class="field"><label>Nome do item</label><input type="text" id="f_item" placeholder="Ex: Pastel de Carne" value="${escapeHtml(editando?item.item:'')}"></div>
    <label>Categoria</label>
    <select id="f_cat" class="hide">${categoriaOptionsHtml(DB.categoriasCardapio, editando?item.categoria||'':'')}</select>
    <div id="catChips" class="mb12"></div>
    <div class="grid2">
      <div class="field" id="f_precoWrap"><label>Preço de 1 unidade</label><input type="text" id="f_preco" placeholder="R$ 0,00"></div>
      <div class="field" id="f_limiteWrap"><label>Limite por evento</label><input type="number" min="0" id="f_limite" placeholder="Sem limite" value="${editando && item.limite!=null?item.limite:''}"></div>
    </div>
    <div class="card pad between flat" style="margin-bottom:4px;"><span class="fw6 fs13">Ativo (aparece nos pedidos)</span><button type="button" class="sw ${!editando||item.ativo?'on':''}" id="swAtivo"></button></div>
    <details class="acc" id="accVersoes"><summary><div><div class="fw6 fs14">Tamanhos / versões</div><div class="sub fs11" id="sumVersoes"></div></div><span class="chev">${ic('chev',18,'var(--ink-soft)')}</span></summary><div class="acc-body">
      <label style="display:flex;align-items:center;gap:8px;text-transform:none;font-size:13px;letter-spacing:0;color:var(--ink);"><input type="checkbox" id="f_temVersoes"> Tem versões com preços diferentes (ex: Grande / Pequena)</label>
      <div id="versoesWrap" class="mt8"><div id="versoesList"></div><button type="button" class="linkbtn mt8" id="btnAddVersao">+ versão</button><div class="sub fs11 mt4">nome · preço · limite por evento (opcional)</div></div>
    </div></details>
    <details class="acc" id="accPacotes"><summary><div><div class="fw6 fs14">Pacotes promocionais</div><div class="sub fs11" id="sumPacotes"></div></div><span class="chev">${ic('chev',18,'var(--ink-soft)')}</span></summary><div class="acc-body">
      <div class="sub fs12 mb8">Ex: "3 unidades por R$ 25" — o resto volta pro preço normal. Não vale para itens com versões.</div>
      <div id="faixasList"></div><button type="button" class="linkbtn mt8" id="btnAddFaixa">+ pacote</button>
    </div></details>
    <details class="acc" id="accOpcoes"><summary><div><div class="fw6 fs14">Escolhas do cliente</div><div class="sub fs11" id="sumOpcoes"></div></div><span class="chev">${ic('chev',18,'var(--ink-soft)')}</span></summary><div class="acc-body">
      <label style="display:flex;align-items:center;gap:8px;text-transform:none;font-size:13px;letter-spacing:0;color:var(--ink);"><input type="checkbox" id="f_temOpcoes"> Tem particularidades (ex: escolher acompanhamento)</label>
      <div id="opcoesWrap" class="mt8"><div id="opcoesList"></div><button type="button" class="linkbtn mt8" id="btnAddOpcao">+ grupo de opções</button></div>
    </div></details>
    <details class="acc" id="accEventos"><summary><div><div class="fw6 fs14">Em quais eventos aparece</div><div class="sub fs11" id="sumEventos"></div></div><span class="chev">${ic('chev',18,'var(--ink-soft)')}</span></summary><div class="acc-body">
      <div class="sub fs12 mb8">Sem nenhum marcado, o item aparece em <b>todos</b> os eventos.</div><div id="eventosVinculadosList"></div>
    </div></details>
    <button class="btn block mt16" id="btnAdd">${editando?'Salvar alterações':'Cadastrar item'}</button>
    ${editando && perm.excluir?`<button class="btn danger block mt8" id="btnDelItem">${ic('trash',17,'var(--warn)')} Excluir item</button>`:''}
  </div>`);
  const $ = s=>form.querySelector(s);
  const catSel = $('#f_cat');
  $('#catChips').appendChild(chipsDoSelect(catSel, { quebrar:true, rotulo:o=>o.value===''?'Sem categoria':o.textContent }));
  const precoInput = $('#f_preco'); attachMoneyMask(precoInput); if(editando && !(item.versoes||[]).length) setMoneyVal(precoInput, item.preco);
  const swAtivo = $('#swAtivo'); swAtivo.addEventListener('click', ()=>swAtivo.classList.toggle('on'));
  const temVersoesChk = $('#f_temVersoes'), temOpcoesChk = $('#f_temOpcoes');
  temVersoesChk.checked = st.versoes.length>0;
  temOpcoesChk.checked = editando && !!item.temOpcoes;

  function resumo(){
    $('#sumVersoes').textContent = temVersoesChk.checked && st.versoes.length ? st.versoes.map(v=>v.nome||'?').join(' · ') : 'Não usa';
    $('#sumPacotes').textContent = temVersoesChk.checked ? 'Não se aplica a itens com versões' : (st.faixas.length ? st.faixas.map(f=>`${f.qtdBloco} por ${moneyCurto(f.precoBloco)}`).join(' · ') : 'Nenhum');
    $('#sumOpcoes').textContent = temOpcoesChk.checked && st.opcoes.length ? st.opcoes.map(o=>o.nome||'?').join(', ') : 'Nenhuma';
    $('#sumEventos').textContent = st.eventosVinculados.length ? `${st.eventosVinculados.length} evento(s) específico(s)` : 'Todos os eventos';
  }
  function renderVersoes(){
    $('#versoesWrap').style.display = temVersoesChk.checked ? '' : 'none';
    $('#versoesList').innerHTML = st.versoes.map((v,i)=>`<div class="row mt6" style="gap:6px;">
      <input type="text" value="${escapeHtml(v.nome)}" data-versao-nome="${i}" placeholder="Ex: Grande" style="flex:1.3;">
      <input type="text" inputmode="numeric" value="${moneyDisplayFromValor(v.preco)}" data-versao-preco="${i}" placeholder="R$ 0,00" style="flex:1;">
      <input type="number" min="0" value="${v.limite==null?'':v.limite}" data-versao-limite="${i}" placeholder="lim." style="width:70px;">
      <button type="button" class="iconbtn plain" data-versao-del="${i}" aria-label="Remover">${ic('x',18,'var(--warn)')}</button></div>`).join('') || `<div class="sub">Nenhuma versão ainda.</div>`;
    $('#f_precoWrap').style.display = temVersoesChk.checked ? 'none' : '';
    $('#f_limiteWrap').style.display = temVersoesChk.checked ? 'none' : '';
    resumo();
  }
  function renderFaixas(){
    $('#faixasList').innerHTML = st.faixas.map((f,i)=>`<div class="row wrap mt6" style="gap:6px;">
      <input type="number" min="2" value="${f.qtdBloco}" data-faixa-qtd="${i}" style="width:66px;" aria-label="Quantidade"><span class="sub">por</span>
      <input type="text" inputmode="numeric" value="${moneyDisplayFromValor(f.precoBloco)}" data-faixa-preco="${i}" placeholder="R$ 0,00" style="width:110px;"><span class="sub">até</span>
      <input type="date" value="${f.validoAte||''}" data-faixa-validade="${i}" style="width:150px;">
      <button type="button" class="iconbtn plain" data-faixa-del="${i}" aria-label="Remover">${ic('x',18,'var(--warn)')}</button></div>`).join('') || `<div class="sub">Nenhum pacote — sempre o preço de 1 unidade.</div>`;
    resumo();
  }
  function renderOpcoes(){
    $('#opcoesWrap').style.display = temOpcoesChk.checked ? '' : 'none';
    $('#opcoesList').innerHTML = st.opcoes.map((g,i)=>`<div class="card flat pad mt8">
      <div class="grid2"><div><label>Nome do grupo</label><input type="text" data-opcao-nome="${i}" value="${escapeHtml(g.nome)}" placeholder="Ex: Acompanhamento"></div>
      <div><label>Tipo</label><select data-opcao-tipo="${i}"><option value="unica" ${g.tipo==='unica'?'selected':''}>Escolhe 1</option><option value="multipla" ${g.tipo==='multipla'?'selected':''}>Vários</option></select></div></div>
      <label class="mt8">Alternativas (separe por vírgula)</label><input type="text" data-opcao-alts="${i}" value="${escapeHtml(g.alternativasRaw)}" placeholder="Arroz, Farofa, Salada">
      <button type="button" class="linkbtn mt8" style="color:var(--warn);" data-opcao-del="${i}">Remover grupo</button></div>`).join('') || `<div class="sub">Nenhum grupo ainda.</div>`;
    resumo();
  }
  function renderEventosVinc(){
    const lista = eventosOptions(); const hoje = hojeStr();
    $('#eventosVinculadosList').innerHTML = lista.length ? `<div class="chips wrap">${lista.map(o=>`<button type="button" class="chip sm ${st.eventosVinculados.includes(o.id)?'on':''}" data-evento-vinculado="${o.id}" style="${o.data<hoje?'opacity:.6':''}">${escapeHtml(fmtDataCurta(o.data)+' · '+(o.nomeEvento||o.tipo))}</button>`).join('')}</div>` : `<div class="sub">Nenhum evento cadastrado ainda.</div>`;
    resumo();
  }
  form.addEventListener('input', e=>{
    const d = e.target.dataset;
    if(d.versaoNome!==undefined){ st.versoes[d.versaoNome].nome = e.target.value; resumo(); }
    if(d.versaoPreco!==undefined){ const {valor,display}=parseMoneyDigits(e.target.value); st.versoes[d.versaoPreco].preco=valor; e.target.value=display; }
    if(d.versaoLimite!==undefined){ const raw=e.target.value.trim(); st.versoes[d.versaoLimite].limite = raw===''?null:parseInt(raw,10); }
    if(d.faixaQtd!==undefined){ st.faixas[d.faixaQtd].qtdBloco = parseFloat(e.target.value)||0; resumo(); }
    if(d.faixaPreco!==undefined){ const {valor,display}=parseMoneyDigits(e.target.value); st.faixas[d.faixaPreco].precoBloco=valor; e.target.value=display; resumo(); }
    if(d.faixaValidade!==undefined){ st.faixas[d.faixaValidade].validoAte = e.target.value || null; }
    if(d.opcaoNome!==undefined){ st.opcoes[d.opcaoNome].nome = e.target.value; resumo(); }
    if(d.opcaoTipo!==undefined){ st.opcoes[d.opcaoTipo].tipo = e.target.value; }
    if(d.opcaoAlts!==undefined){ st.opcoes[d.opcaoAlts].alternativasRaw = e.target.value; }
  });
  form.addEventListener('change', e=>{ if(e.target.dataset.opcaoTipo!==undefined) st.opcoes[e.target.dataset.opcaoTipo].tipo = e.target.value; });
  form.addEventListener('click', e=>{
    const b = e.target.closest('button'); if(!b) return;
    const d = b.dataset;
    if(d.versaoDel!==undefined){ st.versoes.splice(Number(d.versaoDel),1); renderVersoes(); }
    if(d.faixaDel!==undefined){ st.faixas.splice(Number(d.faixaDel),1); renderFaixas(); }
    if(d.opcaoDel!==undefined){ st.opcoes.splice(Number(d.opcaoDel),1); renderOpcoes(); }
    if(d.eventoVinculado!==undefined){ const id=d.eventoVinculado; st.eventosVinculados = st.eventosVinculados.includes(id) ? st.eventosVinculados.filter(x=>x!==id) : [...st.eventosVinculados, id]; renderEventosVinc(); }
  });
  $('#btnAddVersao').addEventListener('click', ()=>{ st.versoes.push({nome:'', preco:0, limite:null}); renderVersoes(); });
  $('#btnAddFaixa').addEventListener('click', ()=>{ st.faixas.push({qtdBloco:2, precoBloco:0, validoAte:null}); renderFaixas(); });
  $('#btnAddOpcao').addEventListener('click', ()=>{ st.opcoes.push({nome:'', tipo:'unica', alternativasRaw:''}); renderOpcoes(); });
  temVersoesChk.addEventListener('change', ()=>{ if(temVersoesChk.checked && !st.versoes.length) st.versoes.push({nome:'', preco:0, limite:null}); renderVersoes(); });
  temOpcoesChk.addEventListener('change', ()=>{ if(temOpcoesChk.checked && !st.opcoes.length) st.opcoes.push({nome:'', tipo:'unica', alternativasRaw:''}); renderOpcoes(); });
  renderVersoes(); renderFaixas(); renderOpcoes(); renderEventosVinc();
  if(temVersoesChk.checked) $('#accVersoes').open = true;
  if(somenteVer){ form.querySelectorAll('input,select,button').forEach(x=>x.disabled=true); $('#btnAdd').classList.add('hide'); }

  $('#btnAdd').addEventListener('click', async ()=>{
    if(editando ? !perm.editar : !perm.criar){ alert(editando ? 'Você não tem permissão para editar itens do cardápio.' : 'Você não tem permissão para cadastrar itens do cardápio.'); return; }
    const nome = $('#f_item').value.trim();
    const categoria = catSel.value;
    const temVersoes = temVersoesChk.checked;
    const versoes = temVersoes ? st.versoes.filter(v=>v.nome.trim() && v.preco>0)
      .map(v=>({nome:v.nome.trim(), preco:Number(v.preco), limite:(v.limite===null||v.limite===undefined||isNaN(v.limite))?null:Number(v.limite)})) : [];
    if(!nome){ alert('Preencha o nome do item.'); return; }
    if(temVersoes && versoes.length===0){ alert('Adicione pelo menos uma versão com nome e preço, ou desmarque a opção de versões.'); return; }
    const preco = temVersoes ? versoes[0].preco : moneyVal(precoInput);
    if(!temVersoes && !(preco>0)){ alert('Preencha o preço do item.'); return; }
    const ativo = swAtivo.classList.contains('on');
    const limiteRaw = $('#f_limite').value;
    const limite = temVersoes ? null : (limiteRaw.trim()==='' ? null : parseInt(limiteRaw,10));
    const faixasPreco = temVersoes ? [] : st.faixas.filter(f=>f.qtdBloco>=2 && f.precoBloco>0)
      .map(f=>({qtdBloco:Number(f.qtdBloco), precoBloco:Number(f.precoBloco), validoAte: f.validoAte || null}));
    const temOpcoes = temOpcoesChk.checked;
    const opcoes = temOpcoes ? st.opcoes.filter(g=>g.nome.trim() && g.alternativasRaw.trim())
      .map(g=>({nome:g.nome.trim(), tipo:g.tipo, alternativas:g.alternativasRaw.split(',').map(s=>s.trim()).filter(Boolean)})) : [];
    const docObj = { item: nome, categoria, preco, ativo, limite, faixasPreco, temOpcoes: temOpcoes && opcoes.length>0, opcoes, versoes, eventosVinculados: [...st.eventosVinculados] };
    const btn = $('#btnAdd'); btn.disabled = true;
    try{
      if(editando){
        await col('cardapio').doc(item.id).set(docObj);
        await auditLog('Atualizou', 'cardapio', `Item "${item.item}" editado${item.item!==nome ? ` (novo nome: "${nome}")` : ''}`);
        if(item.item !== nome){
          const afetadas = DB.reservas.filter(r=>r.item===item.item);
          if(afetadas.length && confirm(`O nome do item mudou de "${item.item}" para "${nome}".\n\nAtualizar esse nome também nos ${afetadas.length} pedido(s) já lançados? (Sem isso, limites e relatórios não reconhecem os pedidos antigos como o mesmo item.)`)){
            for(const r of afetadas){ await col('reservas').doc(r.id).update({ item: nome }); }
            await auditLog('Atualizou', 'reservas', `Nome do item atualizado em ${afetadas.length} pedido(s): "${item.item}" → "${nome}"`);
          }
        }
      } else {
        await col('cardapio').add(docObj);
        await auditLog('Criou', 'cardapio', `Item "${nome}" (${fmtMoney(preco)})`);
      }
      fecharFolhaERedesenhar();
    }catch(e){ btn.disabled=false; alert('Não foi possível salvar o item.'); console.error(e); }
  });
  const btnDel = $('#btnDelItem');
  if(btnDel) btnDel.addEventListener('click', async ()=>{
    if(!confirm(`Excluir "${item.item}" do cardápio? (pedidos já lançados não são apagados)`)) return;
    await col('cardapio').doc(item.id).delete();
    await auditLog('Excluiu', 'cardapio', `Item "${item.item}"`);
    fecharFolhaERedesenhar();
  });
  abrirFolha({ titulo: editando ? escapeHtml(item.item) : 'Novo item', corpo: form });
}

/* ==================== PEDIDOS (RESERVAS) ====================
   Duas telas dentro da aba Pedidos:
   1) Pedidos lançados — cartões com filtros rápidos e três visões (Lista · Montagem · Por cliente);
   2) Novo pedido — o cardápio do dia vira uma lista de toque: escolhe o item, tamanho e culto
      em botões, ajusta a quantidade e adiciona; o fechamento (pagamento, conta, entrega) fica
      numa folha separada. Toda a lógica de antes (limite de produção revalidado no Firestore,
      versões, pacotes, ajuste, pagamento parcial, cliente parecido, telefone padronizado,
      proteção contra outra pessoa mexendo ao mesmo tempo) continua a mesma. */
function renderReservas(c){
  if(window._ui.pedidoNovo) renderNovoPedido(c);
  else renderPedidosLista(c);
}
function abrirNovoPedido(){ currentTab = 'reservas'; window._ui.pedidoNovo = true; delete window._ui.editarReservaId; delete window._ui.msgPedido; telaSuja=false; render(); window.scrollTo(0,0); }
function abrirEdicaoPedido(id){ currentTab = 'reservas'; window._ui.pedidoNovo = true; window._ui.editarReservaId = id; delete window._ui.msgPedido; telaSuja=false; render(); window.scrollTo(0,0); }
function fecharNovoPedido(){ window._ui.pedidoNovo = false; delete window._ui.editarReservaId; delete window._ui.msgPedido; telaSuja=false; render(); window.scrollTo(0,0); }

/* ---------------------------------------------------------------- NOVO PEDIDO */
function renderNovoPedido(c){
  const opts = eventosOptions();
  const itensAtivos = DB.cardapio.filter(i=>i.ativo);
  const perm = { criar: podeCriar('reservas'), editar: podeEditar('reservas'), excluir: podeExcluir('reservas') };
  let editingReservaId = null;
  let carrinho = [];
  telaSuja = false;
  const reservaParaEditar = window._ui.editarReservaId ? DB.reservas.find(r=>r.id===window._ui.editarReservaId) : null;

  if(reservaParaEditar ? !perm.editar : !perm.criar){
    cabecalho(c, 'Novo pedido', { voltar: fecharNovoPedido, voltarTexto:'Pedidos' });
    avisoSoConsulta(c, 'Pedidos'); return;
  }
  if(opts.length===0 || itensAtivos.length===0){
    cabecalho(c, 'Novo pedido', { voltar: fecharNovoPedido, voltarTexto:'Pedidos' });
    c.appendChild(el(`<div class="card pad empty-state">Cadastre pelo menos um evento e um item ativo no cardápio antes de lançar pedidos.</div>`)); return;
  }
  sincronizarSelecaoEvento(
    ()=>window._reservaFormEvento, v=>{window._reservaFormEvento=v;},
    ()=>!!window._reservaFormEventoTocado, v=>{window._reservaFormEventoTocado=v;},
    opts
  );

  const form = el(`<div id="novoPedido">
    <div class="between mb8" style="margin-top:2px;"><button class="iconbtn" id="btnFecharPedido" aria-label="Fechar">${ic('x',18)}</button>
      <select id="f_evento" class="pillselect"><option value="">— Selecione a cantina —</option>${eventoOptionsHtml(opts, window._reservaFormEvento)}</select></div>
    <div class="h1" id="reservaFormTitle">Novo pedido</div>
    ${window._ui.msgPedido?`<div class="banner okb mt10">${ic('check',15,'var(--ok)',2.4)} ${escapeHtml(window._ui.msgPedido)} — já pode lançar o próximo.</div>`:''}
    <div class="field mt12"><label>Cliente</label><input type="text" id="f_cliente" list="clientesList" placeholder="Nome do cliente" autocomplete="off"></div>
    <div id="sugestoesCliente"></div>
    <div class="field"><label>Telefone / WhatsApp</label><input type="tel" id="f_telefone" placeholder="61 99999-9999"></div>
    <datalist id="clientesList">${DB.clientes.map(cl=>`<option value="${escapeHtml(cl.nome)}">`).join('')}</datalist>
    <div class="card pad empty-state" id="escolhaCantinaMsg" style="display:none;">A cantina mais próxima já passou — escolha acima em qual evento você quer lançar o pedido.</div>
    <div id="itemFormSection">
      <div class="sechead"><span class="h3">Cardápio do dia</span><span class="sub" id="carrinhoModoNota">toque no item para adicionar</span></div>
      <div class="card" style="padding:0 14px;" id="menuList"></div>
    </div>
    <div id="carrinhoWrap" class="mt12"></div>
    <div class="small-note center mt12" id="lancadoPorNote">Lançado em nome de <b>${escapeHtml(userName())}</b></div>
  </div>`);
  c.appendChild(form);
  form.addEventListener('input', ()=>{ telaSuja = true; });
  form.addEventListener('change', ()=>{ telaSuja = true; });

  // Painel do item (fica "pendurado" embaixo do item tocado no cardápio)
  const painel = el(`<div id="itemPanel" class="mt10">
    <select id="f_item" class="hide"></select>
    <div id="f_versaoWrap" class="mb10" style="display:none;"><label>Tamanho / versão</label><select id="f_versao" class="hide"></select><div id="versaoChips"></div></div>
    <div class="mb10"><label>Culto (retirada)</label><select id="f_horario" class="hide"></select><div id="horChips"></div></div>
    <div class="between mb10"><label style="margin:0;">Quantidade</label><div class="stepper"><button type="button" data-qtd="-1">−</button><input type="number" min="1" value="1" id="f_qtd" inputmode="numeric"><button type="button" data-qtd="1">+</button></div></div>
    <div id="opcoesItemWrap"></div>
    <button type="button" class="linkbtn" id="btnExtras">+ desconto / acréscimo / observação</button>
    <div id="extrasWrap" class="mt10" style="display:none;">
      <div class="grid2"><div class="field"><label>Ajuste</label><select id="f_ajusteTipo"><option value="nenhum">Sem ajuste</option><option value="valor">R$ no total do item</option><option value="valorUnidade">R$ por unidade</option><option value="percentual">% sobre o total</option></select></div>
