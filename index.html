      delete window._ui.clienteAberto; render();
    });
    c.appendChild(b);
  }
}

function abrirFormCliente(cl, perm){
  const editando = !!cl;
  const form = el(`<div>
    <div class="field"><label>Nome</label><input type="text" id="f_nome" value="${escapeHtml(editando?cl.nome:'')}" autocomplete="off">
      <div id="avisoSimilar" class="banner info mt6" style="display:none;margin-bottom:0;"></div></div>
    <div class="field"><label>Telefone / WhatsApp</label><input type="tel" id="f_contato" placeholder="Ex: 11 91234-5678" value="${escapeHtml(editando?cl.contato||'':'')}">
      <div id="telHint" class="small-note"></div></div>
    <div class="field"><label>Observações</label><textarea id="f_obs" placeholder="Ex: prefere retirar no culto das 19h">${escapeHtml(editando?cl.obs||'':'')}</textarea></div>
    <button class="btn block mt8" id="btnAdd">${editando?'Salvar alterações':'+ Cadastrar cliente'}</button>
  </div>`);
  abrirFolha({ titulo: editando ? 'Editar cliente' : 'Novo cliente', corpo: form });
  const nomeInput = form.querySelector('#f_nome');
  const contatoInput = form.querySelector('#f_contato');
  const obsInput = form.querySelector('#f_obs');
  const aviso = form.querySelector('#avisoSimilar');
  const telHint = form.querySelector('#telHint');
  function checarSimilar(){
    const nome = nomeInput.value.trim();
    const igual = DB.clientes.find(x=>normalizarNome(x.nome)===normalizarNome(nome) && (!editando || x.id!==cl.id));
    const sim = igual || encontrarClienteSimilar(nome);
    if(nome && sim && (!editando || sim.id!==cl.id)){
      aviso.style.display = 'block';
      aviso.innerHTML = igual ? `Já existe um cliente chamado <b>${escapeHtml(igual.nome)}</b>.` : `Parecido com <b>${escapeHtml(sim.nome)}</b>${sim.contato?' ('+escapeHtml(sim.contato)+')':''} — é a mesma pessoa? Se for, use o cadastro existente.`;
    } else aviso.style.display = 'none';
  }
  function checarTel(){
    const v = contatoInput.value.trim();
    if(!v){ telHint.textContent=''; return; }
    const f = formatarTelefoneBR(v);
    telHint.innerHTML = f ? `<span class="ok">✓ Vai ficar salvo como ${f.formatado}</span>` : `<span class="warn">Parece incompleto — confira se o DDD (2 dígitos) está junto.</span>`;
  }
  nomeInput.addEventListener('input', checarSimilar);
  contatoInput.addEventListener('input', checarTel);
  checarSimilar(); checarTel();

  const btnAdd = form.querySelector('#btnAdd');
  btnAdd.addEventListener('click', async ()=>{
    if(editando ? !perm.editar : !perm.criar){ alert(editando ? 'Você não tem permissão para editar clientes.' : 'Você não tem permissão para cadastrar clientes.'); return; }
    const nome = nomeInput.value.trim();
    const contatoDigitado = contatoInput.value.trim();
    const obs = obsInput.value.trim();
    if(!nome){ alert('Preencha o nome.'); return; }
    let contato = '';
    if(contatoDigitado){
      const f = formatarTelefoneBR(contatoDigitado);
      if(!f){ alert('Esse telefone não parece completo — confira se o DDD (2 dígitos) foi digitado junto.'); contatoInput.focus(); return; }
      contato = f.formatado;
    }
    if(!editando){
      const sim = DB.clientes.find(x=>normalizarNome(x.nome)===normalizarNome(nome)) || encontrarClienteSimilar(nome);
      if(sim && !confirm(`Já existe "${sim.nome}" cadastrado. Cadastrar "${nome}" mesmo assim como outra pessoa?`)) return;
    }
    btnAdd.disabled = true;
    try{
      if(editando){
        const clienteAntigo = cl;
        await col('clientes').doc(cl.id).update({ nome, contato, obs });
        await auditLog('Atualizou', 'clientes', `Cliente "${clienteAntigo.nome}" editado${clienteAntigo.nome!==nome?` (novo nome: "${nome}")`:''}`);
        if(clienteAntigo.nome !== nome){
          const atualizarReservas = confirm(`O nome mudou de "${clienteAntigo.nome}" para "${nome}".\n\nDeseja atualizar esse nome também nos pedidos já lançados anteriormente para essa pessoa?`);
          if(atualizarReservas){
            const afetadas = DB.reservas.filter(r=>normalizarNome(r.cliente)===normalizarNome(clienteAntigo.nome));
            for(const r of afetadas){ await col('reservas').doc(r.id).update({ cliente: nome }); }
            await auditLog('Atualizou', 'reservas', `Nome do cliente atualizado em ${afetadas.length} pedido(s): "${clienteAntigo.nome}" → "${nome}"`);
          }
        }
      } else {
        await col('clientes').add({ nome, contato, obs });
        await auditLog('Criou', 'clientes', `Cliente "${nome}"`);
      }
      fecharFolhaERedesenhar();
    }catch(e){ btnAdd.disabled = false; alert('Não foi possível salvar.'); console.error(e); }
  });
}


/* ==================== AUDITORIA ====================
   Linha do tempo por dia, com bolinha colorida por tipo de ação (verde = criou, dourado =
   alterou, vermelho = excluiu) e filtros por pessoa, ação e área. */
const NOMES_AREA_AUDIT = { reservas:'Pedidos', despesas:'Despesas', entradasAvulsas:'Caixa', clientes:'Clientes', cardapio:'Cardápio', eventos:'Eventos', equipe:'Equipe', categoriasDespesas:'Categorias', categoriasCardapio:'Categorias', contasCaixa:'Contas do caixa' };
function renderAuditoria(c){
  cabecalho(c, 'Auditoria', { voltar: ()=>irPara('mais'), voltarTexto:'Mais' });
  c.appendChild(el(`<div class="small-note mb12" style="margin-top:0;">Registro automático de tudo que é criado, alterado ou excluído — quem fez, o quê e quando.</div>`));

  window._filtroAudit = window._filtroAudit || {usuario: window._filtroAuditUsuario||'', acao:'', area:''};
  const F = window._filtroAudit;
  const usuarios = [...new Set(DB.auditoria.map(a=>a.nome).filter(Boolean))].sort();
  const areas = [...new Set(DB.auditoria.map(a=>a.colecao).filter(Boolean))].sort();
  const filtros = el(`<div class="mb12">
    <div class="row" style="gap:8px;">
      <select id="filtUsuario" class="pillselect"><option value="">Todas as pessoas</option>${usuarios.map(u=>`<option value="${escapeHtml(u)}" ${F.usuario===u?'selected':''}>${escapeHtml(u)}</option>`).join('')}</select>
      <select id="filtArea" class="pillselect"><option value="">Todas as áreas</option>${areas.map(a=>`<option value="${escapeHtml(a)}" ${F.area===a?'selected':''}>${escapeHtml(NOMES_AREA_AUDIT[a]||a)}</option>`).join('')}</select>
    </div>
    <div class="chips mt8">${[['','Tudo'],['Criou','Criou'],['Atualizou','Alterou'],['Excluiu','Excluiu']].map(([v,l])=>`<button class="chip sm ${F.acao===v?'on':''}" data-acaoaud="${v}">${l}</button>`).join('')}</div>
  </div>`);
  c.appendChild(filtros);
  filtros.querySelector('#filtUsuario').addEventListener('change', e=>{ F.usuario = e.target.value; render(); });
  filtros.querySelector('#filtArea').addEventListener('change', e=>{ F.area = e.target.value; render(); });
  filtros.querySelectorAll('[data-acaoaud]').forEach(b=>b.addEventListener('click', ()=>{ F.acao = b.dataset.acaoaud; render(); }));

  let list = [...DB.auditoria];
  if(F.usuario) list = list.filter(a=>a.nome===F.usuario);
  if(F.area) list = list.filter(a=>a.colecao===F.area);
  if(F.acao) list = list.filter(a=>a.acao===F.acao);

  if(!list.length){ c.appendChild(el(`<div class="card pad empty-state">Nenhum registro${F.usuario||F.area||F.acao?' com esse filtro':' ainda'}</div>`)); return; }
  const porDia = {};
  list.forEach(a=>{
    const d = a.timestamp && a.timestamp.toDate ? a.timestamp.toDate() : null;
    const k = d ? `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}` : '0000-00-00';
    (porDia[k] = porDia[k] || []).push(a);
  });
  const hoje = hojeStr();
  const ontem = (()=>{ const d=new Date(); d.setDate(d.getDate()-1); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; })();
  const cor = acao => acao==='Criou' ? 'var(--ok)' : acao==='Excluiu' ? 'var(--warn)' : 'var(--gold)';
  const wrap = el(`<div id="auditLista"></div>`);
  Object.keys(porDia).sort((a,b)=>b.localeCompare(a)).forEach(k=>{
    const titulo = k==='0000-00-00' ? 'Sem data' : k===hoje ? 'Hoje' : k===ontem ? 'Ontem' : `${diaSemana(k)}, ${fmtDateBR(k)}`;
    wrap.appendChild(el(`<div class="grp"><div class="gh"><span class="fw6 fs13">${titulo}</span><span class="sub">${porDia[k].length}</span></div>
      <div class="box">${porDia[k].map(a=>{
        const d = a.timestamp && a.timestamp.toDate ? a.timestamp.toDate() : null;
        const hora = d ? d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}) : '—';
        return `<div class="li" style="align-items:flex-start;">
          <div style="width:40px;flex:none;" class="fs12 muted mt4">${hora}</div>
          <span style="width:10px;height:10px;border-radius:50%;background:${cor(a.acao)};flex:none;margin-top:6px;"></span>
          <div class="m"><div class="t1" style="font-weight:500;font-size:13.5px;">${escapeHtml(a.resumo||'')}</div>
            <div class="t2">${escapeHtml(a.nome||a.usuario||'')} · <span class="badge acao-${(a.acao||'').toLowerCase()}">${escapeHtml(a.acao||'')}</span> · ${escapeHtml(NOMES_AREA_AUDIT[a.colecao]||a.colecao||'')}</div></div>
        </div>`;
      }).join('')}</div></div>`));
  });
  c.appendChild(wrap);
}

/* ==================== EQUIPE (somente admin) ====================
   Lista separada em Administradores e Equipe. Tocar numa pessoa abre a folha de acesso:
   papel em botão, perfis prontos (Vendedor, Caixa, Só consulta) e, aba por aba, os 4 botões
   Ver/Criar/Editar/Excluir. Grava o mesmo formato de "permissoes" de antes. */
const PERFIS_ACESSO = {
  vendedor: { nome:'Vendedor', desc:'Lança e edita pedidos e clientes; o resto só vê.', libera:{ reservas:['criar','editar'], clientes:['criar','editar'] } },
  caixa: { nome:'Caixa', desc:'Pedidos, recebimentos, entradas e despesas.', libera:{ reservas:['criar','editar'], clientes:['criar','editar'], caixa:['criar'], despesas:['criar','editar'] } },
  consulta: { nome:'Só consulta', desc:'Vê tudo, não mexe em nada.', libera:{} },
};
function permsDoPerfil(chave){
  const p = PERFIS_ACESSO[chave];
  const out = {};
  AREAS_PERMISSAO.forEach(a=>{ out[a.key] = {}; a.acoes.forEach(acao=>{ out[a.key][acao] = acao==='ver' || ((p.libera[a.key]||[]).includes(acao)); }); });
  return out;
}
function perfilQueBate(perms){
  return Object.keys(PERFIS_ACESSO).find(k=>{
    const alvo = permsDoPerfil(k);
    return AREAS_PERMISSAO.every(a=>a.acoes.every(acao=>!!(perms[a.key]||{})[acao]===alvo[a.key][acao]));
  }) || 'personalizado';
}
function resumoAcesso(u){
  if(u.papel==='admin') return 'Acesso total';
  const perms = {};
  AREAS_PERMISSAO.forEach(a=>{ perms[a.key]={}; a.acoes.forEach(acao=>perms[a.key][acao]=permissaoEfetiva(u.permissoes, u.papel, a.key, acao)); });
  const pf = perfilQueBate(perms);
  if(pf!=='personalizado') return PERFIS_ACESSO[pf].nome;
  const mexe = AREAS_PERMISSAO.filter(a=>a.acoes.some(acao=>acao!=='ver' && perms[a.key][acao])).map(a=>a.label);
  return mexe.length ? 'Mexe em: '+mexe.join(', ') : 'Só consulta (algumas abas ocultas)';
}

function renderEquipe(c){
  cabecalho(c, 'Equipe e acessos', { voltar: ()=>irPara('mais'), voltarTexto:'Mais' });
  c.appendChild(el(`<div class="small-note mb12" style="margin-top:0;">Só e-mails cadastrados aqui conseguem entrar. Administrador vê e pode tudo. Para Equipe, escolha um perfil pronto ou marque aba por aba.</div>`));
  const list = [...DB.equipe].sort((a,b)=>(a.nome||'').localeCompare(b.nome||''));
  const admins = list.filter(u=>u.papel==='admin'), equipe = list.filter(u=>u.papel!=='admin');
  [['Administradores', admins], ['Equipe', equipe]].forEach(([titulo, arr])=>{
    c.appendChild(el(`<div class="sechead"><span class="h3">${titulo}</span><span class="sub">${arr.length}</span></div>`));
    c.appendChild(el(`<div class="box">${arr.length ? arr.map(u=>`<div class="li clickable" data-membro="${escapeHtml(u.id)}">
      <div class="avatar sm" style="${u.papel==='admin'?'background:var(--gold);color:#fff;':''}">${iniciais(u.nome||u.id)}</div>
      <div class="m"><div class="t1 ell">${escapeHtml(u.nome||'')}${currentUser && u.id===String(currentUser.email||'').toLowerCase()?' <span class="tag mute">você</span>':''}</div><div class="t2 ell">${escapeHtml(u.id)}</div><div class="t2 ell gold">${escapeHtml(resumoAcesso(u))}</div></div>
      ${ic('chev',16,'var(--ink-faint)')}
    </div>`).join('') : '<div class="empty-state">Ninguém aqui ainda</div>'}</div>`));
  });
  c.appendChild(el(`<div class="small-note mt10">Pessoas cadastradas antes desta atualização não perderam nenhum acesso — o que não for mexido continua como estava.</div>`));
  c.querySelectorAll('[data-membro]').forEach(li=>li.addEventListener('click', ()=>{
    const u = DB.equipe.find(x=>x.id===li.dataset.membro);
    if(u) abrirFormMembro(u);
  }));
  definirFab('Pessoa', ()=>abrirFormMembro(null), 'fabNovoMembro');
}

function abrirFormMembro(u){
  const editando = !!u;
  const perms = {};
  AREAS_PERMISSAO.forEach(a=>{ perms[a.key]={}; a.acoes.forEach(acao=>{ perms[a.key][acao] = editando ? permissaoEfetiva(u.permissoes, u.papel, a.key, acao) : acao==='ver'; }); });
  let papel = editando && u.papel==='admin' ? 'admin' : 'equipe';
  const ROT = {ver:'Ver', criar:'Criar', editar:'Editar', excluir:'Excluir'};
  const form = el(`<div>
    <div class="field"><label>E-mail (Google)</label><input type="email" id="f_email" placeholder="pessoa@gmail.com" value="${editando?escapeHtml(u.id):''}" ${editando?'readonly':''}></div>
    <div class="field"><label>Nome</label><input type="text" id="f_nome" value="${editando?escapeHtml(u.nome||''):''}"></div>
    <label>Papel</label>
    <select id="f_papel" class="hide"><option value="equipe">Equipe</option><option value="admin">Administrador</option></select>
    <div id="papelSeg" class="mb12"></div>
    <div id="permWrap">
      <label>Perfil pronto</label>
      <div class="chips wrap mb8" id="perfisChips"></div>
      <div class="small-note mb12" id="perfilDesc" style="margin-top:0;"></div>
      <div class="box" id="permAreas">${AREAS_PERMISSAO.map(a=>`<div class="li" style="flex-wrap:wrap;gap:8px;"><div class="m" style="min-width:90px;"><div class="t1">${a.key==='reservas'?'Pedidos':a.label}</div></div>
        <div class="chips">${['ver','criar','editar','excluir'].map(acao=> a.acoes.includes(acao) ? `<button type="button" class="chip sm" data-perm="${a.key}:${acao}">${ROT[acao]}</button>` : `<span class="chip sm" style="visibility:hidden;">${ROT[acao]}</span>`).join('')}</div></div>`).join('')}</div>
    </div>
    <div class="card wash pad fs12 mt8" id="adminNota" style="display:none;">${ic('shield',15,'var(--gold)')} Administrador vê e pode tudo, inclusive Equipe, Auditoria, Categorias e Contas.</div>
    <button class="btn block mt16" id="btnAdd">${editando?'Salvar alterações':'+ Dar acesso'}</button>
    ${editando?`<button class="btn danger block mt8" id="btnDelMembro">${ic('trash',16,'var(--warn)')} Remover acesso</button>`:''}
  </div>`);
  abrirFolha({ titulo: editando ? (u.nome||u.id) : 'Nova pessoa', corpo: form });
  const papelSel = form.querySelector('#f_papel');
  papelSel.value = papel;
  const permWrap = form.querySelector('#permWrap');
  form.querySelector('#papelSeg').appendChild((()=>{
    const s = el(`<div class="seg">${[['equipe','Equipe'],['admin','Administrador']].map(([v,l])=>`<button type="button" data-papel="${v}">${l}</button>`).join('')}</div>`);
    s.addEventListener('click', e=>{ const b=e.target.closest('[data-papel]'); if(!b) return; papelSel.value=b.dataset.papel; papelSel.dispatchEvent(new Event('change')); });
    return s;
  })());
  function refreshPapel(){
    form.querySelectorAll('[data-papel]').forEach(b=>b.classList.toggle('on', b.dataset.papel===papelSel.value));
    permWrap.style.display = papelSel.value==='admin' ? 'none' : '';
    form.querySelector('#adminNota').style.display = papelSel.value==='admin' ? '' : 'none';
  }
  papelSel.addEventListener('change', refreshPapel);

  function desenharPerms(){
    form.querySelectorAll('[data-perm]').forEach(b=>{ const [k,acao]=b.dataset.perm.split(':'); const on = !!perms[k][acao]; b.classList.toggle('done', on); b.setAttribute('aria-pressed', on?'true':'false'); });
    const pf = perfilQueBate(perms);
    form.querySelector('#perfisChips').innerHTML = [...Object.entries(PERFIS_ACESSO).map(([k,p])=>[k,p.nome]), ['personalizado','Personalizado']].map(([k,l])=>`<button type="button" class="chip ${pf===k?'on':''}" data-perfil="${k}">${l}</button>`).join('');
    form.querySelector('#perfilDesc').textContent = pf==='personalizado' ? 'Combinação própria — ajuste os botões abaixo.' : PERFIS_ACESSO[pf].desc;
  }
  form.querySelector('#perfisChips').addEventListener('click', e=>{
    const b = e.target.closest('[data-perfil]'); if(!b || b.dataset.perfil==='personalizado') return;
    const novo = permsDoPerfil(b.dataset.perfil);
    Object.keys(novo).forEach(k=>perms[k]=novo[k]);
    desenharPerms();
  });
  form.querySelector('#permAreas').addEventListener('click', e=>{
    const b = e.target.closest('[data-perm]'); if(!b) return;
    const [k,acao] = b.dataset.perm.split(':');
    perms[k][acao] = !perms[k][acao];
    // Sem "Ver" não faz sentido mexer; e mexer exige ver.
    if(acao==='ver' && !perms[k].ver) Object.keys(perms[k]).forEach(x=>perms[k][x]=false);
    if(acao!=='ver' && perms[k][acao]) perms[k].ver = true;
    desenharPerms();
  });
  refreshPapel(); desenharPerms();

  form.querySelector('#btnAdd').addEventListener('click', async ()=>{
    const email = editando ? u.id : form.querySelector('#f_email').value.trim().toLowerCase();
    const nome = form.querySelector('#f_nome').value.trim();
    const papelFinal = papelSel.value;
    if(!email || !email.includes('@') || !nome){ alert('Preencha e-mail válido e nome.'); return; }
    if(editando && currentUser && email===String(currentUser.email||'').toLowerCase() && papelFinal!=='admin' && u.papel==='admin'){
      if(!confirm('Você está tirando o seu próprio acesso de administrador. Continuar?')) return;
    }
    const permissoes = {};
    AREAS_PERMISSAO.forEach(a=>{ permissoes[a.key] = {}; a.acoes.forEach(acao=>{ permissoes[a.key][acao] = !!perms[a.key][acao]; }); });
    try{
      await col('equipe').doc(email).set({ nome, papel: papelFinal, permissoes }, {merge:true});
      await auditLog(editando?'Atualizou':'Criou', 'equipe', `Acesso de ${nome} (${email}): papel ${papelFinal}`);
      fecharFolhaERedesenhar();
    }catch(e){ alert('Não foi possível salvar. Confira se você é administrador.'); console.error(e); }
  });
  const del = form.querySelector('#btnDelMembro');
  if(del) del.addEventListener('click', async ()=>{
    if(!confirm('Remover o acesso desta pessoa? Ela não vai mais conseguir entrar no sistema.')) return;
    try{
      await col('equipe').doc(u.id).delete();
      await auditLog('Excluiu', 'equipe', `Acesso removido de ${u.nome} (${u.id})`);
      fecharFolhaERedesenhar();
    }catch(e){ alert('Não foi possível remover. Confira se você é administrador.'); }
  });
}
