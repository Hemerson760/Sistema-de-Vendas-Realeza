<style>
:root{
  --gold: #A9822F;
  --gold-soft: #C9A961;
  --gold-pale: #E4D6AE;
  --ink: #362B1F;
  --ink-soft: #8B7B62;
  --ok: #5C7A4B;
  --warn: #A5493A;
  --card: #FFFFFF;
  --line: #E5D9BC;
  --shadow: 0 10px 30px rgba(120,95,50,0.09);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(ellipse 900px 500px at 15% -5%, #FFF8EA 0%, transparent 60%),
    radial-gradient(ellipse 900px 500px at 90% 10%, #FBEFD8 0%, transparent 55%),
    linear-gradient(160deg, #F7F1E5 0%, #EFE4CC 55%, #F5EDDC 100%);
  background-attachment: fixed;
  color: var(--ink);
  font-family: 'Cormorant Garamond', serif;
  min-height:100vh;
  -webkit-font-smoothing: antialiased;
}
::selection{ background: var(--gold-pale); color: var(--ink); }

/* ---------- HEADER ---------- */
.header{ padding: 46px 16px 20px; text-align:center; position: relative; }
.crown{ width:46px; height:46px; margin-bottom:10px; opacity:.92; }
.crown path, .crown circle{ fill:none; stroke: var(--gold); stroke-width:1.3; stroke-linejoin:round; stroke-linecap:round; }
.crown .jewel{ fill: var(--gold-soft); stroke:none; }
.header .eyebrow{ font-family:'Cormorant Garamond', serif; font-style: italic; font-weight:500; color: var(--ink-soft); font-size: 15px; letter-spacing: 1.5px; margin-bottom: 2px; }
.header h1{ font-family:'Playfair Display', serif; font-weight:600; font-style: italic; letter-spacing: 0.5px; color: var(--ink); font-size: clamp(26px, 5vw, 40px); margin: 0 0 6px; }
.header .subtitle{ font-family:'Inter', sans-serif; color: var(--ink-soft); font-size: 11.5px; letter-spacing: 2px; text-transform: uppercase; }
.flourish{ width:120px; height:14px; margin:16px auto 0; opacity:0.8; }
.flourish path{ stroke: var(--gold-soft); fill:none; stroke-width:1; }
.flourish circle{ fill: var(--gold-soft); }
.user-badge{ position:absolute; top:22px; right:20px; display:flex; align-items:center; gap:10px; font-family:'Inter',sans-serif; font-size:12px; color: var(--ink-soft); }
.user-badge .name{ font-weight:600; color: var(--ink); }
.role-badge{ font-family:'Inter',sans-serif; font-size:9.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; background: var(--gold); color:#fff; padding:1px 7px; border-radius:10px; margin-left:6px; vertical-align:middle; }
.user-badge button{ background:none; border:1px solid var(--line); color: var(--ink-soft); padding:5px 11px; border-radius:5px; font-family:'Inter',sans-serif; font-size:11px; cursor:pointer; }
.user-badge button:hover{ border-color: var(--gold); color: var(--gold); }

/* ---------- NAV ---------- */
.tabs{ display:flex; flex-wrap: wrap; gap: 4px; justify-content:center; padding: 4px 10px 22px; }
.tab-btn{ font-family:'Inter', sans-serif; font-size: 11px; font-weight:600; letter-spacing: 0.8px; padding: 9px 16px; background: transparent; border: none; border-bottom: 1.5px solid transparent; color: var(--ink-soft); cursor:pointer; transition: all .18s ease; text-transform: uppercase; }
.tab-btn:hover{ color: var(--ink); }
.tab-btn.active{ color: var(--gold); border-bottom-color: var(--gold); }

/* ---------- LAYOUT ---------- */
.content{ max-width: 1140px; margin: 0 auto; padding: 10px 16px 70px; }
.section-title{ font-family:'Playfair Display', serif; font-style: italic; font-weight: 600; color: var(--ink); font-size: 19px; letter-spacing: 0.3px; margin: 34px 0 14px; display:flex; align-items:center; gap:12px; }
.section-title:first-child{ margin-top:6px; }
.section-title::after{ content:""; flex:1; height:1px; background: linear-gradient(90deg, var(--line), transparent); }

.frame{ position: relative; background: var(--card); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); padding: 22px; margin-bottom: 18px; }

.kpi-grid{ display:grid; grid-template-columns: repeat(auto-fit, minmax(160px,1fr)); gap:0; margin-bottom: 8px; }
.kpi{ padding: 6px 18px; text-align:left; border-left: 1px solid var(--line); }
.kpi:first-child{ border-left:none; padding-left:2px; }
.kpi .label{ font-family:'Inter',sans-serif; font-size:10.5px; letter-spacing:1px; text-transform:uppercase; color: var(--ink-soft); margin-bottom:8px; }
.kpi .value{ font-family:'Playfair Display',serif; font-size: clamp(19px,2.6vw,26px); color: var(--ink); font-weight:600; }
.kpi.warn .value{ color: var(--warn); }
.kpi.ok .value{ color: var(--ok); }

table{ width:100%; border-collapse: collapse; font-family:'Inter',sans-serif; font-size: 13.5px; }
thead th{ background: transparent; color: var(--ink-soft); font-family:'Inter',sans-serif; font-weight:600; font-size:10px; letter-spacing:0.8px; text-transform:uppercase; padding: 10px 10px; text-align:left; border-bottom: 1.5px solid var(--gold-soft); }
tbody td{ padding: 10px; border-bottom: 1px solid var(--line); vertical-align: middle;}
tbody tr:hover{ background: #FBF6EA; }
tbody tr.pend{ background: #FBF0EC; }
.table-wrap{ overflow-x:auto; border:1px solid var(--line); border-radius:10px; }

.badge{ display:inline-block; padding:2px 10px; border-radius: 20px; font-size:11px; font-family:'Inter',sans-serif; font-weight:600; letter-spacing:.2px; }
.badge.sim{ background:#EBF1E6; color: var(--ok); }
.badge.nao{ background:#F7E9E5; color: var(--warn); }
.badge.acao-criou{ background:#EBF1E6; color: var(--ok); }
.badge.acao-atualizou{ background:#F6EEDD; color: var(--gold); }
.badge.acao-excluiu{ background:#F7E9E5; color: var(--warn); }
.obs-flag{ background:#FBF3DE; border-left:2px solid var(--gold); padding:3px 8px; font-size:12.5px; border-radius: 0 4px 4px 0; }

.btn{ font-family:'Inter',sans-serif; font-size:12px; font-weight:600; padding:8px 16px; border-radius:5px; border:1px solid var(--gold); background: var(--gold); color:#fff; cursor:pointer; letter-spacing:.2px; }
.btn.secondary{ background: transparent; color: var(--ink); border-color: var(--line); }
.btn.danger{ background: transparent; border-color: var(--warn); color: var(--warn); }
.btn.small{ padding:5px 10px; font-size:11px; }
.btn:hover{ filter: brightness(1.04); opacity:.92; }
.btn:disabled{ opacity:.5; cursor:not-allowed; }

.form-grid{ display:grid; grid-template-columns: repeat(auto-fit, minmax(150px,1fr)); gap:14px; margin-bottom:16px; }
label{ font-family:'Inter',sans-serif; font-size:10.5px; color: var(--ink-soft); display:block; margin-bottom:5px; text-transform:uppercase; letter-spacing:0.6px;}
input, select, textarea{ width:100%; font-family:'Inter',sans-serif; font-size:14px; padding: 9px 10px; border:1px solid var(--line); border-radius:5px; background: #FEFDFA; color: var(--ink); }
input:focus, select:focus, textarea:focus{ outline:none; border-color: var(--gold); box-shadow: 0 0 0 3px rgba(169,130,47,0.1); }

.actions-row{ display:flex; gap:8px; flex-wrap:wrap; margin-top:6px; }
.filters-row{ display:flex; gap:14px; flex-wrap:wrap; margin-bottom:16px; align-items:flex-end; }
.filters-row > div{ min-width:140px; }

.chart-box{ background: var(--card); border:1px solid var(--line); border-radius:10px; padding:18px; }
.two-col{ display:grid; grid-template-columns: 1fr 1fr; gap:16px; }
@media (max-width: 760px){ .two-col{ grid-template-columns: 1fr; } }

.empty-state{ text-align:center; padding: 34px 10px; color: var(--ink-soft); font-style: italic; }
.small-note{ font-family:'Inter',sans-serif; font-size:11.5px; color: var(--ink-soft); margin-top:6px; }
.loading{ text-align:center; padding:60px; font-family:'Playfair Display',serif; font-style:italic; color: var(--ink-soft); }

/* ---------- LOGIN ---------- */
.login-wrap{ max-width: 380px; margin: 60px auto; padding: 0 16px; }
.login-card{ background: var(--card); border:1px solid var(--line); border-radius:12px; box-shadow: var(--shadow); padding: 32px 28px; }
.login-card h2{ font-family:'Playfair Display',serif; font-style:italic; font-weight:600; text-align:center; margin: 0 0 4px; font-size:22px; }
.login-card .lead{ text-align:center; color: var(--ink-soft); font-family:'Inter',sans-serif; font-size:12px; margin-bottom:22px; letter-spacing:.4px; }
.login-error{ background:#F7E9E5; color: var(--warn); font-family:'Inter',sans-serif; font-size:12.5px; padding:9px 12px; border-radius:6px; margin-bottom:14px; display:none; }
.login-error.show{ display:block; }
.login-card .btn{ width:100%; margin-top:6px; padding:11px; }
.forgot-link{ text-align:center; margin-top:14px; }
.forgot-link a{ font-family:'Inter',sans-serif; font-size:11.5px; color: var(--ink-soft); text-decoration:underline; cursor:pointer; }
</style>
</head>

<script>
/* ==================================================================
   CONFIGURAÇÃO DO FIREBASE
   Troque os valores abaixo pelos do SEU projeto Firebase (gratuito).
   Veja o guia de instalação para saber onde pegar esses dados.
================================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyDb4aXS-qldoBBdf1JRlIcIODk60CGwu5o",
  authDomain: "realeza-casais.firebaseapp.com",
  projectId: "realeza-casais",
  storageBucket: "realeza-casais.firebasestorage.app",
  messagingSenderId: "506478085084",
  appId: "1:506478085084:web:2b43c6c16617a9ec050519"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

/* ==================== ESTADO ==================== */
const TABS = [
  {id:'dashboard', label:'Dashboard Geral'},
  {id:'dashboardEvento', label:'Dashboard por Evento'},
  {id:'eventos', label:'Eventos'},
  {id:'cardapio', label:'Cardápio'},
  {id:'reservas', label:'Reservas'},
  {id:'despesas', label:'Despesas'},
  {id:'clientes', label:'Clientes'},
  {id:'auditoria', label:'Auditoria', adminOnly:true},
  {id:'equipe', label:'Equipe', adminOnly:true},
];

let DB = { eventos:[], cardapio:[], reservas:[], despesas:[], clientes:[], auditoria:[], equipe:[] };
let currentTab = 'dashboard';
let charts = {};
let currentUser = null;
let currentUserRole = 'equipe'; // 'admin' ou 'equipe'
let currentUserPermissoes = {}; // { eventos: bool, cardapio: bool }
let listenersStarted = false;
function isAdmin(){ return currentUserRole === 'admin'; }
function podeEditar(area){ return isAdmin() || !!currentUserPermissoes[area]; }

/* ==================== HELPERS ==================== */
const fmtMoney = (n) => 'R$ ' + (Number(n)||0).toLocaleString('pt-BR',{minimumFractionDigits:2, maximumFractionDigits:2});
function valorReserva(r){ return (r.valorTotal !== undefined && r.valorTotal !== null) ? Number(r.valorTotal) : (Number(r.qtd)||0)*(Number(r.precoUnit)||0); }
const fmtDateBR = (iso) => { if(!iso) return ''; const [y,m,d]=iso.split('-'); return `${d}/${m}/${y}`; };
const monthLabel = (iso) => { const [y,m] = iso.split('-'); const meses=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez']; return meses[parseInt(m,10)-1] + '/' + y; };
function eventoKey(data,tipo){ return data+'|'+tipo; }
function eventosOptions(){
  return [...DB.eventos].sort((a,b)=>a.data.localeCompare(b.data)).map(e=>({
    value: eventoKey(e.data,e.tipo), label: `${fmtDateBR(e.data)} — ${e.tipo}`, data:e.data, tipo:e.tipo, cultos:e.cultos
  }));
}
function el(html){ const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstChild; }
function escapeHtml(s){ return String(s??'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function fmtWhen(ts){ if(!ts || !ts.toDate) return '—'; const d = ts.toDate(); return d.toLocaleDateString('pt-BR')+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); }
function userName(){ return (currentUser && (currentUser.displayName || currentUser.email)) || 'Desconhecido'; }
function whatsappUrl(contato){
  let d = (contato||'').replace(/\D/g,'').replace(/^0+/, '');
  if(!d) return null;
  if(d.length>11 && d.startsWith('55')){ d = d.slice(2); } // já tinha DDI, tira pra normalizar e recolocar
  if(d.length===10){ d = d.slice(0,2) + '9' + d.slice(2); } // celular sem o 9º dígito (formato antigo)
  d = '55'+d; // sempre assume Brasil
  return `https://wa.me/${d}`;
}
function whatsappBtn(contato, extraStyle){
  const url = whatsappUrl(contato);
  if(!url) return '';
  return `<a href="${url}" target="_blank" rel="noopener" title="Chamar no WhatsApp" style="display:inline-flex; align-items:center; justify-content:center; width:22px; height:22px; border-radius:50%; background:#25D366; vertical-align:middle; margin-left:6px; ${extraStyle||''}">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
  </a>`;
}
function contatoDoCliente(nomeCliente){
  const cl = DB.clientes.find(x=>x.nome.toLowerCase()===String(nomeCliente||'').toLowerCase());
  return cl ? cl.contato : '';
}

function normalizarNome(s){ return (s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim(); }
function levenshtein(a,b){
  const m=a.length, n=b.length;
  const dp = Array.from({length:m+1},()=>new Array(n+1).fill(0));
  for(let i=0;i<=m;i++) dp[i][0]=i;
  for(let j=0;j<=n;j++) dp[0][j]=j;
  for(let i=1;i<=m;i++){
    for(let j=1;j<=n;j++){
      dp[i][j] = a[i-1]===b[j-1] ? dp[i-1][j-1] : 1+Math.min(dp[i-1][j], dp[i][j-1], dp[i-1][j-1]);
    }
  }
  return dp[m][n];
}
function encontrarClienteSimilar(nome){
  const alvo = normalizarNome(nome);
  if(!alvo) return null;
  let melhor = null, melhorDist = Infinity;
  DB.clientes.forEach(cl=>{
    const cand = normalizarNome(cl.nome);
    if(!cand || cand===alvo) return; // vazio ou idêntico não conta como "similar"
    const dist = levenshtein(alvo, cand);
    const limiar = Math.max(2, Math.floor(Math.max(alvo.length,cand.length)*0.2));
    if(dist<=limiar && dist<melhorDist){ melhor=cl; melhorDist=dist; }
  });
  return melhor;
}

/* ==================== AUDITORIA ==================== */
async function auditLog(acao, colecao, resumo){
  try{
    await db.collection('auditoria').add({
      usuario: currentUser.email, nome: userName(),
      acao, colecao, resumo,
      timestamp: firebase.firestore.FieldValue.serverTimestamp()
    });
  }catch(e){ console.error('Falha ao registrar auditoria', e); }
}

/* ==================== AUTENTICAÇÃO ==================== */
const googleProvider = new firebase.auth.GoogleAuthProvider();
document.getElementById('btnLogin').addEventListener('click', doLogin);
document.getElementById('loginSenha').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
document.getElementById('btnGoogle').addEventListener('click', async ()=>{
  const btn = document.getElementById('btnGoogle');
  btn.disabled = true;
  try{
    await auth.signInWithPopup(googleProvider);
  }catch(e){
    if(e.code !== 'auth/popup-closed-by-user'){ showLoginError(traduzErro(e.code)); }
  }finally{
    btn.disabled = false;
  }
});
document.getElementById('btnForgot').addEventListener('click', async ()=>{
  const email = document.getElementById('loginEmail').value.trim();
  if(!email){ showLoginError('Digite seu e-mail primeiro, depois clique em "Esqueci minha senha".'); return; }
  try{
    await auth.sendPasswordResetEmail(email);
    showLoginError('Enviamos um link de redefinição para o seu e-mail.', true);
  }catch(e){ showLoginError(traduzErro(e.code)); }
});
function showLoginError(msg, ok){
  const box = document.getElementById('loginError');
  box.textContent = msg; box.classList.add('show');
  box.style.background = ok ? '#EBF1E6' : '#F7E9E5';
  box.style.color = ok ? '#5C7A4B' : '#A5493A';
}
function traduzErro(code){
  const map = {
    'auth/invalid-email':'E-mail inválido.',
    'auth/user-not-found':'Usuário não encontrado.',
    'auth/wrong-password':'Senha incorreta.',
    'auth/invalid-credential':'E-mail ou senha incorretos.',
    'auth/too-many-requests':'Muitas tentativas. Aguarde um pouco e tente novamente.',
  };
  return map[code] || 'Não foi possível entrar. Tente novamente.';
}
async function doLogin(){
  const email = document.getElementById('loginEmail').value.trim();
  const senha = document.getElementById('loginSenha').value;
  if(!email || !senha){ showLoginError('Preencha e-mail e senha.'); return; }
  const btn = document.getElementById('btnLogin');
  btn.disabled = true; btn.textContent = 'Entrando…';
  try{
    await auth.signInWithEmailAndPassword(email, senha);
  }catch(e){
    showLoginError(traduzErro(e.code));
  }finally{
    btn.disabled = false; btn.textContent = 'Entrar';
  }
}

auth.onAuthStateChanged(async user=>{
  document.getElementById('bootLoading').style.display = 'none';

  if(user){
    // Verifica se este e-mail está na lista de autorizados (coleção "equipe")
    let autorizado = false;
    let papel = 'equipe';
    let permissoes = {};
    try{
      const doc = await db.collection('equipe').doc(user.email.toLowerCase()).get();
      autorizado = doc.exists;
      if(autorizado){
        papel = (doc.data().papel === 'admin') ? 'admin' : 'equipe';
        permissoes = doc.data().permissoes || {};
      }
    }catch(e){
      console.error('Erro ao checar autorização', e);
    }
    if(!autorizado){
      showLoginError(`O e-mail ${user.email} ainda não tem acesso liberado. Peça ao administrador do sistema para autorizar.`);
      await auth.signOut();
      currentUser = null;
      document.getElementById('app').style.display = 'none';
      document.getElementById('loginScreen').style.display = 'block';
      return;
    }
    currentUser = user;
    currentUserRole = papel;
    currentUserPermissoes = permissoes;
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    document.getElementById('userBadge').innerHTML =
      `<span class="name">${escapeHtml(userName())} ${isAdmin() ? '<span class=\"role-badge\">admin</span>' : ''}</span><button id="btnLogout">Sair</button>`;
    document.getElementById('btnLogout').addEventListener('click', ()=>auth.signOut());
    if(!listenersStarted){ startListeners(); listenersStarted = true; } else { render(); }
  } else {
    currentUser = null;
    document.getElementById('app').style.display = 'none';
    document.getElementById('loginScreen').style.display = 'block';
  }
});

/* ==================== LISTENERS EM TEMPO REAL ==================== */
function startListeners(){
  db.collection('eventos').onSnapshot(snap=>{
    DB.eventos = snap.docs.map(d=>({id:d.id, ...d.data()}));
    render();
  }, e=>console.error(e));

  db.collection('cardapio').onSnapshot(snap=>{
    DB.cardapio = snap.docs.map(d=>({id:d.id, ...d.data()}));
    render();
  }, e=>console.error(e));

  db.collection('reservas').onSnapshot(snap=>{
    DB.reservas = snap.docs.map(d=>({id:d.id, ...d.data()}));
    render();
  }, e=>console.error(e));

  db.collection('despesas').onSnapshot(snap=>{
    DB.despesas = snap.docs.map(d=>({id:d.id, ...d.data()}));
    render();
  }, e=>console.error(e));

  db.collection('clientes').onSnapshot(snap=>{
    DB.clientes = snap.docs.map(d=>({id:d.id, ...d.data()}));
    render();
  }, e=>console.error(e));

  db.collection('equipe').onSnapshot(snap=>{
    DB.equipe = snap.docs.map(d=>({id:d.id, ...d.data()}));
    if(currentTab==='equipe') render();
  }, e=>console.error(e));

  // Auditoria só é lida por administradores (regra de segurança bloqueia os demais)
  if(isAdmin()){
    db.collection('auditoria').orderBy('timestamp','desc').limit(300).onSnapshot(snap=>{
      DB.auditoria = snap.docs.map(d=>({id:d.id, ...d.data()}));
      if(currentTab==='auditoria') render();
    }, e=>console.error(e));
  }

  render();
}

/* ==================== NAV ==================== */
function renderTabs(){
  const box = document.getElementById('tabs');
  box.innerHTML='';
  TABS.filter(t=> !t.adminOnly || isAdmin()).forEach(t=>{
    const b = el(`<button class="tab-btn ${t.id===currentTab?'active':''}">${t.label}</button>`);
    b.addEventListener('click', ()=>{ currentTab=t.id; render(); });
    box.appendChild(b);
  });
}

/* ==================== RENDER ROUTER ==================== */
function render(){
  if(!currentUser) return;
  if((currentTab==='auditoria' || currentTab==='equipe') && !isAdmin()){ currentTab='dashboard'; }
  renderTabs();
  const c = document.getElementById('content');
  c.innerHTML='';
  if(currentTab==='dashboard') renderDashboardGeral(c);
  else if(currentTab==='dashboardEvento') renderDashboardEvento(c);
  else if(currentTab==='eventos') renderEventos(c);
  else if(currentTab==='cardapio') renderCardapio(c);
  else if(currentTab==='reservas') renderReservas(c);
  else if(currentTab==='despesas') renderDespesas(c);
  else if(currentTab==='clientes') renderClientes(c);
  else if(currentTab==='auditoria') renderAuditoria(c);
  else if(currentTab==='equipe') renderEquipe(c);
}

/* ==================== DASHBOARD GERAL ==================== */
function margemPct(receita, despesa){ const lucro=receita-despesa; return receita>0 ? (lucro/receita*100) : 0; }
function roiPct(receita, despesa){ return despesa>0 ? ((receita-despesa)/despesa*100) : (receita>0?100:0); }
function fmtPct(n){ return (Number(n)||0).toLocaleString('pt-BR',{maximumFractionDigits:1, minimumFractionDigits:0})+'%'; }

function renderDashboardGeral(c){
  const totalVendido = DB.reservas.reduce((s,r)=>s+valorReserva(r),0);
  const totalDespesas = DB.despesas.reduce((s,d)=>s+Number(d.valor),0);
  const lucro = totalVendido-totalDespesas;
  const qtdTotal = DB.reservas.reduce((s,r)=>s+r.qtd,0);
  const naoPagos = DB.reservas.filter(r=>r.pago==='Não').length;
  const naoEntregues = DB.reservas.filter(r=>r.entregue==='Não').length;

  c.appendChild(el(`<div class="section-title">Resumo Global</div>`));
  c.appendChild(el(`<div class="frame"><div class="kpi-grid">
    <div class="kpi ok"><div class="label">Total Vendido</div><div class="value">${fmtMoney(totalVendido)}</div></div>
    <div class="kpi"><div class="label">Qtd. Total Vendida</div><div class="value">${qtdTotal}</div></div>
    <div class="kpi"><div class="label">Total Despesas</div><div class="value">${fmtMoney(totalDespesas)}</div></div>
    <div class="kpi ${lucro>=0?'ok':'warn'}"><div class="label">Lucro Total</div><div class="value">${fmtMoney(lucro)}</div></div>
    <div class="kpi ${lucro>=0?'ok':'warn'}"><div class="label">Margem de Lucro</div><div class="value">${fmtPct(margemPct(totalVendido,totalDespesas))}</div></div>
    <div class="kpi ${lucro>=0?'ok':'warn'}"><div class="label">Retorno s/ Investido</div><div class="value">${fmtPct(roiPct(totalVendido,totalDespesas))}</div></div>
    <div class="kpi ${naoPagos>0?'warn':''}"><div class="label">Pedidos Não Pagos</div><div class="value">${naoPagos}</div></div>
    <div class="kpi ${naoEntregues>0?'warn':''}"><div class="label">Não Entregues</div><div class="value">${naoEntregues}</div></div>
  </div></div>`));

  c.appendChild(el(`<div class="section-title">Comparativo por Tipo de Evento</div>`));
  const tipos = ['Almoço','Cantina'];
  const compData = tipos.map(t=>({
    tipo:t,
    receita: DB.reservas.filter(r=>r.tipo===t).reduce((s,r)=>s+valorReserva(r),0),
    despesa: DB.despesas.filter(d=>d.tipo===t).reduce((s,d)=>s+Number(d.valor),0),
  }));
  const two1 = el(`<div class="two-col"></div>`);
  two1.appendChild(el(`<div class="chart-box"><canvas id="chartTipo" height="220"></canvas></div>`));
  two1.appendChild(el(`<div class="frame" style="padding:0;"><div class="table-wrap"><table>
    <thead><tr><th>Tipo</th><th>Receita</th><th>Despesa</th><th>Lucro</th><th>Margem</th></tr></thead>
    <tbody>${compData.map(x=>`<tr><td>${x.tipo}</td><td>${fmtMoney(x.receita)}</td><td>${fmtMoney(x.despesa)}</td><td>${fmtMoney(x.receita-x.despesa)}</td><td>${fmtPct(margemPct(x.receita,x.despesa))}</td></tr>`).join('')}</tbody>
  </table></div></div>`));
  c.appendChild(two1);

  c.appendChild(el(`<div class="section-title">Evolução Mensal</div>`));
  const months = {};
  DB.reservas.forEach(r=>{ const k=r.data.slice(0,7); months[k]=months[k]||{receita:0,despesa:0}; months[k].receita+=valorReserva(r); });
  DB.despesas.forEach(d=>{ const k=d.data.slice(0,7); months[k]=months[k]||{receita:0,despesa:0}; months[k].despesa+=Number(d.valor); });
  const monthKeys = Object.keys(months).sort();
  c.appendChild(el(`<div class="frame"><div class="chart-box"><canvas id="chartMensal" height="200"></canvas></div></div>`));

  c.appendChild(el(`<div class="section-title">Comparativo entre Eventos — Qual Cantina/Almoço Repetir</div>`));
  c.appendChild(el(`<div class="small-note" style="margin-bottom:12px;">Ordenado do mais lucrativo pro menos lucrativo — use pra decidir o que vale a pena repetir.</div>`));
  const eventoStats = DB.eventos.map(e=>{
    const resev = DB.reservas.filter(r=>r.data===e.data && r.tipo===e.tipo);
    const desev = DB.despesas.filter(d=>d.data===e.data && d.tipo===e.tipo);
    const receita = resev.reduce((s,r)=>s+valorReserva(r),0);
    const despesa = desev.reduce((s,d)=>s+Number(d.valor),0);
    const qtd = resev.reduce((s,r)=>s+r.qtd,0);
    return { label: `${fmtDateBR(e.data)} — ${e.tipo}`, data:e.data, tipo:e.tipo, receita, despesa, qtd, lucro:receita-despesa, margem: margemPct(receita,despesa) };
  }).sort((a,b)=>b.lucro-a.lucro);
  const two4 = el(`<div class="two-col"></div>`);
  two4.appendChild(el(`<div class="chart-box"><canvas id="chartEventos" height="${Math.max(220, eventoStats.length*36)}"></canvas></div>`));
  two4.appendChild(el(`<div class="frame" style="padding:0;"><div class="table-wrap"><table>
    <thead><tr><th>Evento</th><th>Qtd</th><th>Receita</th><th>Despesa</th><th>Lucro</th><th>Margem</th></tr></thead>
    <tbody>${eventoStats.length? eventoStats.map(e=>`<tr><td>${e.label}</td><td>${e.qtd}</td><td>${fmtMoney(e.receita)}</td><td>${fmtMoney(e.despesa)}</td><td style="color:${e.lucro>=0?'var(--ok)':'var(--warn)'}">${fmtMoney(e.lucro)}</td><td>${fmtPct(e.margem)}</td></tr>`).join('') : '<tr><td colspan="6" class="empty-state">Nenhum evento cadastrado</td></tr>'}</tbody>
  </table></div></div>`));
  c.appendChild(two4);

  c.appendChild(el(`<div class="section-title">Ranking de Itens Mais Vendidos</div>`));
  const itemAgg = {};
  DB.reservas.forEach(r=>{ itemAgg[r.item]=itemAgg[r.item]||{qtd:0,valor:0}; itemAgg[r.item].qtd+=r.qtd; itemAgg[r.item].valor+=valorReserva(r); });
  const ranking = Object.entries(itemAgg).sort((a,b)=>b[1].qtd-a[1].qtd);
  c.appendChild(el(`<div class="frame" style="padding:0;"><div class="table-wrap"><table>
    <thead><tr><th>#</th><th>Item</th><th>Qtd Vendida</th><th>Valor Total</th><th>% da Receita</th></tr></thead>
    <tbody>${ranking.length? ranking.map((r,i)=>`<tr><td>${i+1}</td><td>${escapeHtml(r[0])}</td><td>${r[1].qtd}</td><td>${fmtMoney(r[1].valor)}</td><td>${fmtPct(totalVendido? r[1].valor/totalVendido*100 : 0)}</td></tr>`).join('') : '<tr><td colspan="5" class="empty-state">Sem vendas registradas ainda</td></tr>'}</tbody>
  </table></div></div>`));

  if(charts.tipo) charts.tipo.destroy();
  charts.tipo = new Chart(document.getElementById('chartTipo'), {
    type:'bar',
    data:{ labels: compData.map(x=>x.tipo), datasets:[
      {label:'Receita', data: compData.map(x=>x.receita), backgroundColor:'#A9822F', borderRadius:4},
      {label:'Despesa', data: compData.map(x=>x.despesa), backgroundColor:'#C08B6E', borderRadius:4},
      {label:'Lucro', data: compData.map(x=>x.receita-x.despesa), backgroundColor:'#5C7A4B', borderRadius:4},
    ]},
    options:{ responsive:true, plugins:{legend:{position:'bottom'}} }
  });
  if(charts.mensal) charts.mensal.destroy();
  charts.mensal = new Chart(document.getElementById('chartMensal'), {
    type:'bar',
    data:{ labels: monthKeys.map(k=>monthLabel(k+'-01')), datasets:[
      {type:'bar', label:'Receita', data: monthKeys.map(k=>months[k].receita), backgroundColor:'#E4D6AE', borderRadius:4, order:2},
      {type:'bar', label:'Despesa', data: monthKeys.map(k=>months[k].despesa), backgroundColor:'#E9CFC2', borderRadius:4, order:2},
      {type:'line', label:'Lucro', data: monthKeys.map(k=>months[k].receita-months[k].despesa), borderColor:'#5C7A4B', backgroundColor:'#5C7A4B', tension:.3, order:1, yAxisID:'y'},
    ]},
    options:{ responsive:true, plugins:{legend:{position:'bottom'}} }
  });
  if(charts.eventos) charts.eventos.destroy();
  charts.eventos = new Chart(document.getElementById('chartEventos'), {
    type:'bar',
    data:{ labels: eventoStats.map(e=>e.label), datasets:[
      {label:'Lucro', data: eventoStats.map(e=>e.lucro), backgroundColor: eventoStats.map(e=>e.lucro>=0?'#A9822F':'#A5493A'), borderRadius:4},
    ]},
    options:{ indexAxis:'y', responsive:true, plugins:{legend:{display:false}} }
  });
}

/* ==================== DASHBOARD POR EVENTO ==================== */
function renderDashboardEvento(c){
  const opts = eventosOptions();
  if(opts.length===0){
    c.appendChild(el(`<div class="frame empty-state">Cadastre um evento na aba "Eventos" para ver o dashboard dele aqui.</div>`));
    return;
  }
  window._selEvento = window._selEvento || opts[0].value;
  if(!opts.find(o=>o.value===window._selEvento)) window._selEvento = opts[0].value;

  const selWrap = el(`<div class="frame">
    <label>Selecione o Evento</label>
    <select id="eventoSelect">${opts.map(o=>`<option value="${o.value}" ${o.value===window._selEvento?'selected':''}>${o.label}</option>`).join('')}</select>
  </div>`);
  c.appendChild(selWrap);
  selWrap.querySelector('#eventoSelect').addEventListener('change', (e)=>{ window._selEvento = e.target.value; render(); });

  const sel = opts.find(o=>o.value===window._selEvento);
  const resev = DB.reservas.filter(r=>r.data===sel.data && r.tipo===sel.tipo);
  const desev = DB.despesas.filter(d=>d.data===sel.data && d.tipo===sel.tipo);

  const totalVendido = resev.reduce((s,r)=>s+valorReserva(r),0);
  const totalDespesa = desev.reduce((s,d)=>s+Number(d.valor),0);
  const lucro = totalVendido-totalDespesa;
  const qtdVendidaTotal = resev.reduce((s,r)=>s+r.qtd,0);
  const clientesUnicos = new Set(resev.map(r=>r.cliente.trim().toLowerCase())).size;
  const naoPagos = resev.filter(r=>r.pago==='Não');
  const naoEntregues = resev.filter(r=>r.entregue==='Não');

  c.appendChild(el(`<div class="section-title">Resumo do Dia — ${sel.label}</div>`));
  c.appendChild(el(`<div class="frame"><div class="kpi-grid">
    <div class="kpi ok"><div class="label">Total Vendido</div><div class="value">${fmtMoney(totalVendido)}</div></div>
    <div class="kpi"><div class="label">Qtd. Vendida</div><div class="value">${qtdVendidaTotal}</div></div>
    <div class="kpi"><div class="label">Despesas</div><div class="value">${fmtMoney(totalDespesa)}</div></div>
    <div class="kpi ${lucro>=0?'ok':'warn'}"><div class="label">Lucro do Dia</div><div class="value">${fmtMoney(lucro)}</div></div>
    <div class="kpi ${lucro>=0?'ok':'warn'}"><div class="label">Margem de Lucro</div><div class="value">${fmtPct(margemPct(totalVendido,totalDespesa))}</div></div>
    <div class="kpi ${lucro>=0?'ok':'warn'}"><div class="label">Retorno s/ Investido</div><div class="value">${fmtPct(roiPct(totalVendido,totalDespesa))}</div></div>
    <div class="kpi"><div class="label">Clientes Únicos</div><div class="value">${clientesUnicos}</div></div>
    <div class="kpi ${naoPagos.length?'warn':''}"><div class="label">Não Pagos</div><div class="value">${naoPagos.length}</div></div>
    <div class="kpi ${naoEntregues.length?'warn':''}"><div class="label">Não Entregues</div><div class="value">${naoEntregues.length}</div></div>
  </div></div>`));

  const horarios = [...new Set([...(sel.cultos||[]), ...resev.map(r=>r.horario)])];
  const horData = horarios.map(h=>{
    const rs = resev.filter(r=>r.horario===h);
    return { h, qtd: rs.reduce((s,r)=>s+r.qtd,0), valor: rs.reduce((s,r)=>s+valorReserva(r),0),
      entregues: rs.filter(r=>r.entregue==='Sim').length, pendentes: rs.filter(r=>r.entregue==='Não').length };
  });
  c.appendChild(el(`<div class="section-title">Quebra por Horário de Entrega</div>`));
  const two2 = el(`<div class="two-col"></div>`);
  two2.appendChild(el(`<div class="chart-box"><canvas id="chartHorario" height="220"></canvas></div>`));
  two2.appendChild(el(`<div class="frame" style="padding:0;"><div class="table-wrap"><table>
    <thead><tr><th>Horário</th><th>Qtd</th><th>Valor</th><th>Entregues</th><th>Pendentes</th></tr></thead>
    <tbody>${horData.map(x=>`<tr><td>${x.h}</td><td>${x.qtd}</td><td>${fmtMoney(x.valor)}</td><td>${x.entregues}</td><td>${x.pendentes}</td></tr>`).join('')}</tbody>
  </table></div></div>`));
  c.appendChild(two2);

  const itemAgg = {};
  resev.forEach(r=>{ itemAgg[r.item]=itemAgg[r.item]||{qtd:0,valor:0}; itemAgg[r.item].qtd+=r.qtd; itemAgg[r.item].valor+=valorReserva(r); });
  const ranking = Object.entries(itemAgg).sort((a,b)=>b[1].qtd-a[1].qtd);
  c.appendChild(el(`<div class="section-title">Itens Vendidos Neste Evento</div>`));
  c.appendChild(el(`<div class="frame" style="padding:0;"><div class="table-wrap"><table>
    <thead><tr><th>Item</th><th>Qtd</th><th>Valor</th><th>% do Total</th></tr></thead>
    <tbody>${ranking.length? ranking.map(r=>`<tr><td>${escapeHtml(r[0])}</td><td>${r[1].qtd}</td><td>${fmtMoney(r[1].valor)}</td><td>${fmtPct(totalVendido? r[1].valor/totalVendido*100:0)}</td></tr>`).join('') : '<tr><td colspan="4" class="empty-state">Sem pedidos neste evento ainda</td></tr>'}</tbody>
  </table></div></div>`));

  const itensComLimite = DB.cardapio.filter(i=>i.limite!==null && i.limite!==undefined && i.limite>0);
  if(itensComLimite.length){
    const somaLimites = itensComLimite.reduce((s,i)=>s+i.limite,0);
    const custoPorUnidade = somaLimites>0 ? totalDespesa/somaLimites : 0;
    let prejuizoTotal = 0;
    const linhas = itensComLimite.map(i=>{
      const vendido = (itemAgg[i.item]?.qtd)||0;
      const sobra = Math.max(0, i.limite - vendido);
      const pct = Math.min(100, i.limite? (vendido/i.limite*100) : 0);
      const prejuizo = sobra * custoPorUnidade;
      prejuizoTotal += prejuizo;
      const excedeu = vendido > i.limite;
      return `<tr class="${excedeu?'pend':''}">
        <td>${escapeHtml(i.item)}</td>
        <td>${i.limite}</td>
        <td>${vendido}</td>
        <td>${excedeu?`<span class="badge nao">excedeu em ${vendido-i.limite}</span>`:sobra}</td>
        <td style="min-width:110px;"><div style="background:#EDE3CB;border-radius:4px;overflow:hidden;height:9px;width:100%;"><div style="background:${excedeu?'var(--warn)':'var(--gold)'};height:100%;width:${pct}%;"></div></div><span class="small-note" style="margin:2px 0 0;">${fmtPct(pct)}</span></td>
        <td>${sobra>0? fmtMoney(prejuizo) : '—'}</td>
      </tr>`;
    }).join('');
    c.appendChild(el(`<div class="section-title">Limites de Produção</div>`));
    c.appendChild(el(`<div class="small-note" style="margin-bottom:10px;">"Prejuízo estimado" = custo médio por unidade (despesa do evento dividida pela capacidade total) × unidades que sobraram. É uma estimativa, já que o sistema não rastreia custo por item individualmente.</div>`));
    c.appendChild(el(`<div class="frame" style="padding:0;"><div class="table-wrap"><table>
      <thead><tr><th>Item</th><th>Produzido</th><th>Vendido</th><th>Sobra</th><th>% Vendido</th><th>Prejuízo Estimado</th></tr></thead>
      <tbody>${linhas}</tbody>
      ${prejuizoTotal>0?`<tfoot><tr style="font-weight:600;"><td colspan="5" style="text-align:right; padding:9px 10px;">Prejuízo total estimado por sobra:</td><td style="padding:9px 10px; color:var(--warn);">${fmtMoney(prejuizoTotal)}</td></tr></tfoot>`:''}
    </table></div></div>`));
  }

  c.appendChild(el(`<div class="section-title">Pendências — Quem Falta Pagar / Retirar</div>`));
  const two3 = el(`<div class="two-col"></div>`);
  two3.appendChild(el(`<div class="frame" style="padding:0;"><div class="table-wrap"><table>
    <thead><tr><th>Falta Pagar</th><th>Item</th><th>Valor</th></tr></thead>
    <tbody>${naoPagos.length? naoPagos.map(r=>`<tr><td>${escapeHtml(r.cliente)}</td><td>${escapeHtml(r.item)}</td><td>${fmtMoney(valorReserva(r))}</td></tr>`).join('') : '<tr><td colspan="3" class="empty-state">Todo mundo pagou 🎉</td></tr>'}</tbody>
  </table></div></div>`));
  two3.appendChild(el(`<div class="frame" style="padding:0;"><div class="table-wrap"><table>
    <thead><tr><th>Falta Retirar</th><th>Item</th><th>Horário</th></tr></thead>
    <tbody>${naoEntregues.length? naoEntregues.map(r=>`<tr><td>${escapeHtml(r.cliente)}</td><td>${escapeHtml(r.item)}</td><td>${r.horario}</td></tr>`).join('') : '<tr><td colspan="3" class="empty-state">Tudo entregue 🎉</td></tr>'}</tbody>
  </table></div></div>`));
  c.appendChild(two3);

  if(charts.horario) charts.horario.destroy();
  charts.horario = new Chart(document.getElementById('chartHorario'), {
    type:'bar',
    data:{ labels: horData.map(x=>x.h), datasets:[{label:'Valor Vendido (R$)', data: horData.map(x=>x.valor), backgroundColor:'#A9822F', borderRadius:4}] },
    options:{ responsive:true, plugins:{legend:{display:false}} }

/* ==================== CARDÁPIO ==================== */
function normalizarPacotes(faixasPreco){
  // Compatibilidade com itens salvos antes do ajuste de "pacote fechado"
  return (faixasPreco||[]).map(f=>({
    qtdBloco: Number(f.qtdBloco ?? f.qtdMinima ?? 0),
    precoBloco: Number(f.precoBloco ?? f.precoUnit ?? 0),
  })).filter(f=>f.qtdBloco>=2 && f.precoBloco>0);
}

function calcularValorTotal(item, qtd){
  const base = Number(item.preco)||0;
  const pacotes = normalizarPacotes(item.faixasPreco).sort((a,b)=>b.qtdBloco-a.qtdBloco); // maior pacote primeiro
  let restante = Math.max(0, Number(qtd)||0);
  let total = 0;
  for(const p of pacotes){
    if(p.qtdBloco>0 && p.precoBloco>0){
      const n = Math.floor(restante / p.qtdBloco);
      if(n>0){ total += n * p.precoBloco; restante -= n * p.qtdBloco; }
    }
  }
  total += restante * base;
  return total;
}
function calcularValorTotalDetalhado(item, qtd){
  const base = Number(item.preco)||0;
  const pacotes = normalizarPacotes(item.faixasPreco).sort((a,b)=>b.qtdBloco-a.qtdBloco);
  let restante = Math.max(0, Number(qtd)||0);
  let total = 0;
  const partes = [];
  for(const p of pacotes){
    if(p.qtdBloco>0 && p.precoBloco>0){
      const n = Math.floor(restante / p.qtdBloco);
      if(n>0){ total += n * p.precoBloco; restante -= n * p.qtdBloco; partes.push(`${n}x pacote de ${p.qtdBloco}un (${fmtMoney(p.precoBloco)} cada) = ${fmtMoney(n*p.precoBloco)}`); }
    }
  }
  if(restante>0){ total += restante * base; partes.push(`${restante}un avulsa${restante>1?'s':''} a ${fmtMoney(base)} = ${fmtMoney(restante*base)}`); }
  return { total, texto: partes.join(' + ') };
}

      return DB.reservas.filter(r=>r.data===sel.data && r.tipo===sel.tipo && r.item===item.item).reduce((s,r)=>s+r.qtd,0);

      opcoesItemWrap.innerHTML = '';

    itemSel.addEventListener('change', ()=>{ refreshOpcoesItem(); refreshPrecoPreview(); });
    qtdInput.addEventListener('input', refreshPrecoPreview);
    refreshOpcoesItem(); refreshPrecoPreview();

    form.querySelector('#btnAdd').addEventListener('click', async ()=>{
      const sel = opts.find(o=>o.value===evSel.value);
      let cliente = form.querySelector('#f_cliente').value.trim();
      const itemObj = itemAtual();
      const qtd = parseInt(qtdInput.value,10);
      if(!cliente || !itemObj || !qtd || qtd<1){ alert('Preencha cliente, item e quantidade válida.'); return; }

      // checa nome de cliente parecido com um já cadastrado, pra evitar duplicidade (ex: "Elisangela" x "Elizangela")
      const jaExisteExato = DB.clientes.some(cl=>normalizarNome(cl.nome)===normalizarNome(cliente));
      if(!jaExisteExato){
        const similar = encontrarClienteSimilar(cliente);
        if(similar){
          const usarExistente = confirm(`Já existe um cliente cadastrado com nome parecido: "${similar.nome}".\n\nClique OK se for a MESMA pessoa (usar "${similar.nome}").\nClique Cancelar se for uma pessoa DIFERENTE (manter "${cliente}").`);
          if(usarExistente){ cliente = similar.nome; }
        }
      }

      // checa limite de quantidade do item nesse evento — revalida direto no banco (não só no cache local),
      // pra reduzir o risco de duas pessoas venderem a última unidade ao mesmo tempo
      if(itemObj.limite!==null && itemObj.limite!==undefined && itemObj.limite>0){
        let jaReservadoFresco;
        try{
          const snap = await db.collection('reservas')
            .where('data','==',sel.data).where('tipo','==',sel.tipo).where('item','==',itemObj.item).get();
          jaReservadoFresco = snap.docs.reduce((s,d)=>s+(d.data().qtd||0),0);
        }catch(e){
          console.error('Falha ao revalidar limite', e);
          jaReservadoFresco = jaReservadoNoEvento(itemObj); // usa o valor local como alternativa
        }
        if((jaReservadoFresco + qtd) > itemObj.limite){
          alert(`Não é possível lançar este pedido: "${itemObj.item}" já tem ${jaReservadoFresco} de ${itemObj.limite} reservados neste evento. Restam apenas ${Math.max(0,itemObj.limite-jaReservadoFresco)} unidade(s).`);
          return;
        }
      }

      // captura opções selecionadas e valida grupos de escolha única
      const opcoesSelecionadas = {};
      if(itemObj.temOpcoes && (itemObj.opcoes||[]).length){
        for(let gi=0; gi<itemObj.opcoes.length; gi++){
          const grupo = itemObj.opcoes[gi];
          const checked = [...opcoesItemWrap.querySelectorAll(`input[name="opgrupo_${gi}"]:checked`)].map(el=>el.value);
          if(grupo.tipo==='unica' && checked.length===0){ alert(`Selecione uma opção em "${grupo.nome}".`); return; }
          if(checked.length){ opcoesSelecionadas[grupo.nome] = grupo.tipo==='multipla' ? checked : checked[0]; }
        }
      }
      const opcoesTexto = Object.entries(opcoesSelecionadas).map(([k,v])=>`${k}: ${Array.isArray(v)?v.join('/'):v}`).join('; ');
      const valorTotal = calcularValorTotal(itemObj, qtd);
      const precoUnit = qtd ? valorTotal/qtd : 0;

      const novaReserva = {
        data: sel.data, tipo: sel.tipo, horario: horSel.value,
        cliente, item: itemObj.item, qtd, precoUnit, valorTotal,
        opcoesSelecionadas, opcoesTexto,
        observacao: form.querySelector('#f_obs').value.trim(),
        formaPagamento: form.querySelector('#f_pagto').value,
        pago: form.querySelector('#f_pago').value,
        entregue: form.querySelector('#f_entregue').value,
        vendedor: userName(),
      };
      await db.collection('reservas').add(novaReserva);
      await auditLog('Criou', 'reservas', `Pedido de ${cliente} — ${itemObj.item} (${qtd}x) em ${fmtDateBR(sel.data)}`);
      if(!DB.clientes.find(cl=>cl.nome.toLowerCase()===cliente.toLowerCase())){
        await db.collection('clientes').add({nome:cliente, contato:'', obs:''});
      }
    });
  }

  c.appendChild(el(`<div class="section-title">Pedidos Lançados</div>`));
  window._filtros = window._filtros || {evento:'', pago:'', entregue:''};
  const filterWrap = el(`<div class="filters-row">
    <div><label>Evento</label><select id="filtEvento"><option value="">Todos</option>${opts.map(o=>`<option value="${o.value}" ${window._filtros.evento===o.value?'selected':''}>${o.label}</option>`).join('')}</select></div>
    <div><label>Pago?</label><select id="filtPago"><option value="">Todos</option><option ${window._filtros.pago==='Sim'?'selected':''}>Sim</option><option ${window._filtros.pago==='Não'?'selected':''}>Não</option></select></div>
    <div><label>Entregue?</label><select id="filtEntregue"><option value="">Todos</option><option ${window._filtros.entregue==='Sim'?'selected':''}>Sim</option><option ${window._filtros.entregue==='Não'?'selected':''}>Não</option></select></div>
  </div>`);
  c.appendChild(filterWrap);
  filterWrap.querySelector('#filtEvento').addEventListener('change', e=>{ window._filtros.evento=e.target.value; render(); });
  filterWrap.querySelector('#filtPago').addEventListener('change', e=>{ window._filtros.pago=e.target.value; render(); });
  filterWrap.querySelector('#filtEntregue').addEventListener('change', e=>{ window._filtros.entregue=e.target.value; render(); });

  let list = [...DB.reservas].sort((a,b)=>b.data.localeCompare(a.data));
  if(window._filtros.evento){ const [d,t]=window._filtros.evento.split('|'); list = list.filter(r=>r.data===d && r.tipo===t); }
  if(window._filtros.pago){ list = list.filter(r=>r.pago===window._filtros.pago); }
  if(window._filtros.entregue){ list = list.filter(r=>r.entregue===window._filtros.entregue); }

  const tableWrap = el(`<div class="frame" style="padding:0;"><div class="table-wrap"><table>
    <thead><tr><th>Data</th><th>Tipo</th><th>Hor.</th><th>Cliente</th><th>Item</th><th>Qtd</th><th>Valor</th><th>Opções/Obs.</th><th>Pagto</th><th>Pago</th><th>Entregue</th><th>Lançado por</th><th></th></tr></thead>
    <tbody>${list.length? list.map(r=>`<tr data-id="${r.id}" class="${(r.pago==='Não'||r.entregue==='Não')?'pend':''}">
      <td>${fmtDateBR(r.data)}</td><td>${r.tipo}</td><td>${r.horario}</td><td>${escapeHtml(r.cliente)}${whatsappBtn(contatoDoCliente(r.cliente))}</td>
      <td>${escapeHtml(r.item)}</td><td>${r.qtd}</td><td>${fmtMoney(valorReserva(r))}</td>
      <td>${r.opcoesTexto?`<span class="obs-flag">${escapeHtml(r.opcoesTexto)}</span><br>`:''}${r.observacao?`<span class="obs-flag">${escapeHtml(r.observacao)}</span>`:''}</td>
      <td>${r.formaPagamento}</td>
      <td><span class="badge ${r.pago==='Sim'?'sim':'nao'}">${r.pago}</span></td>
      <td><span class="badge ${r.entregue==='Sim'?'sim':'nao'}">${r.entregue}</span></td>
      <td>${escapeHtml(r.vendedor||'')}</td>
      <td style="white-space:nowrap;">
        <button class="btn secondary small" data-pago="${r.id}">${r.pago==='Sim'?'Marcar Não Pago':'Marcar Pago'}</button>
        <button class="btn secondary small" data-ent="${r.id}">${r.entregue==='Sim'?'Desfazer Entrega':'Marcar Entregue'}</button>
        ${isAdmin() ? `<button class="btn secondary small" data-editval="${r.id}">Editar Valor</button>` : ''}
        <button class="btn danger small" data-del="${r.id}">Excluir</button>
      </td>
    </tr>`).join('') : '<tr><td colspan="13" class="empty-state">Nenhum pedido encontrado</td></tr>'}</tbody>
  </table></div></div>`);
  c.appendChild(tableWrap);

  tableWrap.querySelectorAll('[data-editval]').forEach(btn=>btn.addEventListener('click', async ()=>{
    const r = DB.reservas.find(x=>x.id===btn.dataset.editval);
    const novaQtdStr = prompt('Quantidade:', r.qtd);
    if(novaQtdStr===null) return;
    const novaQtd = parseInt(novaQtdStr,10);
    if(!novaQtd || novaQtd<1){ alert('Quantidade inválida.'); return; }
    const novoValorStr = prompt('Valor total do pedido (R$):', valorReserva(r).toFixed(2));
    if(novoValorStr===null) return;
    const novoValor = parseFloat(novoValorStr.replace(',','.'));
    if(isNaN(novoValor) || novoValor<0){ alert('Valor inválido.'); return; }
    const valorAntigo = valorReserva(r);
    const qtdAntiga = r.qtd;
    const precoUnit = novaQtd ? novoValor/novaQtd : 0;
    await db.collection('reservas').doc(r.id).update({qtd:novaQtd, valorTotal:novoValor, precoUnit});
    await auditLog('Atualizou', 'reservas', `Valor do pedido de ${r.cliente} (${r.item}) editado: ${qtdAntiga}x/${fmtMoney(valorAntigo)} → ${novaQtd}x/${fmtMoney(novoValor)}`);
  }));

  tableWrap.querySelectorAll('[data-pago]').forEach(btn=>btn.addEventListener('click', async ()=>{
    const r = DB.reservas.find(x=>x.id===btn.dataset.pago);
    const novo = r.pago==='Sim'?'Não':'Sim';
    await db.collection('reservas').doc(r.id).update({pago:novo});
    await auditLog('Atualizou', 'reservas', `Pagamento de ${r.cliente} (${r.item}): ${r.pago} → ${novo}`);
  }));
  tableWrap.querySelectorAll('[data-ent]').forEach(btn=>btn.addEventListener('click', async ()=>{
    const r = DB.reservas.find(x=>x.id===btn.dataset.ent);
    const novo = r.entregue==='Sim'?'Não':'Sim';
    await db.collection('reservas').doc(r.id).update({entregue:novo});
    await auditLog('Atualizou', 'reservas', `Entrega de ${r.cliente} (${r.item}): ${r.entregue} → ${novo}`);
  }));
  tableWrap.querySelectorAll('[data-del]').forEach(btn=>btn.addEventListener('click', async ()=>{
    if(!confirm('Excluir este pedido?')) return;
    const r = DB.reservas.find(x=>x.id===btn.dataset.del);
    await db.collection('reservas').doc(r.id).delete();
    await auditLog('Excluiu', 'reservas', `Pedido de ${r.cliente} — ${r.item} (${fmtMoney(valorReserva(r))}, pago: ${r.pago})`);
  }));
}

    </tr>`).join('') : '<tr><td colspan="7" class="empty-state">Nenhuma despesa cadastrada</td></tr>'}</tbody>
  </table></div></div>`);
  c.appendChild(tableWrap);
  tableWrap.querySelectorAll('[data-del]').forEach(btn=>btn.addEventListener('click', async ()=>{
    if(!confirm('Excluir esta despesa?')) return;
    const d = DB.despesas.find(x=>x.id===btn.dataset.del);

    await auditLog('Excluiu', 'despesas', `Despesa "${d.descricao}" (${fmtMoney(d.valor)})`);
  }));
}

/* ==================== EQUIPE (somente admin) ==================== */
function renderEquipe(c){
  c.appendChild(el(`<div class="section-title">Gerenciar Equipe</div>`));
  c.appendChild(el(`<div class="small-note" style="margin-bottom:16px;">Só e-mails cadastrados aqui conseguem entrar no sistema. "Administrador" vê tudo, inclusive Auditoria e Equipe. Para "Equipe", você escolhe abaixo se a pessoa também pode cadastrar/editar Eventos e Cardápio (por padrão, não pode).</div>`));

  const form = el(`<div class="frame">
    <div class="form-grid">
      <div><label>E-mail (Google)</label><input type="email" id="f_email" placeholder="pessoa@gmail.com"></div>
      <div><label>Nome</label><input type="text" id="f_nome"></div>

    </div>
    <button class="btn" id="btnAdd">+ Adicionar / Atualizar Acesso</button>
    <button class="btn secondary" id="btnCancelEditEquipe" style="display:none;">Cancelar edição</button>
  </div>`);
  c.appendChild(form);

  const papelSel = form.querySelector('#f_papel');
  const permWrap = form.querySelector('#permWrap');
  function refreshPermWrap(){ permWrap.style.opacity = papelSel.value==='admin' ? '0.4' : '1'; }
  papelSel.addEventListener('change', refreshPermWrap);
  refreshPermWrap();

  let editingEmail = null;
  function limparFormEquipe(){
    form.querySelector('#f_email').value=''; form.querySelector('#f_email').removeAttribute('readonly');
    form.querySelector('#f_nome').value=''; papelSel.value='equipe';
    form.querySelector('#f_permEventos').checked=false; form.querySelector('#f_permCardapio').checked=false;

    form.querySelector('#btnAdd').textContent = '+ Adicionar / Atualizar Acesso';
    form.querySelector('#btnCancelEditEquipe').style.display = 'none';
  }
  form.querySelector('#btnCancelEditEquipe').addEventListener('click', limparFormEquipe);

  form.querySelector('#btnAdd').addEventListener('click', async ()=>{
    const email = (editingEmail || form.querySelector('#f_email').value.trim().toLowerCase());
    const nome = form.querySelector('#f_nome').value.trim();
    const papel = papelSel.value;
    const permissoes = { eventos: form.querySelector('#f_permEventos').checked, cardapio: form.querySelector('#f_permCardapio').checked };
    if(!email || !email.includes('@') || !nome){ alert('Preencha e-mail válido e nome.'); return; }
    try{
      await db.collection('equipe').doc(email).set({ nome, papel, permissoes }, {merge:true});
      await auditLog(editingEmail?'Atualizou':'Criou', 'equipe', `Acesso de ${nome} (${email}): papel ${papel}, permissões ${JSON.stringify(permissoes)}`);
      limparFormEquipe();
    }catch(e){ alert('Não foi possível salvar. Confira se você é administrador.'); console.error(e); }
  });

  c.appendChild(el(`<div class="section-title">Pessoas com Acesso</div>`));
  const list = [...DB.equipe].sort((a,b)=>(a.nome||'').localeCompare(b.nome||''));
  const tableWrap = el(`<div class="frame" style="padding:0;"><div class="table-wrap"><table>
    <thead><tr><th>Nome</th><th>E-mail</th><th>Papel</th><th>Eventos</th><th>Cardápio</th><th></th></tr></thead>
    <tbody>${list.length? list.map(u=>{
      const perm = u.permissoes||{};
      const isU_admin = u.papel==='admin';
      return `<tr data-id="${u.id}">
      <td>${escapeHtml(u.nome||'')}</td><td>${escapeHtml(u.id)}</td>
      <td><span class="badge ${isU_admin?'sim':'nao'}">${isU_admin?'Administrador':'Equipe'}</span></td>
      <td><span class="badge ${(isU_admin||perm.eventos)?'sim':'nao'}">${(isU_admin||perm.eventos)?'Sim':'Não'}</span></td>
      <td><span class="badge ${(isU_admin||perm.cardapio)?'sim':'nao'}">${(isU_admin||perm.cardapio)?'Sim':'Não'}</span></td>
      <td style="white-space:nowrap;">
        <button class="btn secondary small" data-edit="${u.id}">Editar</button>
        <button class="btn secondary small" data-toggle="${u.id}">${isU_admin?'Tornar Equipe':'Tornar Admin'}</button>
        <button class="btn danger small" data-del="${u.id}">Remover Acesso</button>
      </td>
    </tr>`;}).join('') : '<tr><td colspan="6" class="empty-state">Nenhuma pessoa cadastrada</td></tr>'}</tbody>
  </table></div></div>`);
  c.appendChild(tableWrap);

  tableWrap.querySelectorAll('[data-edit]').forEach(btn=>btn.addEventListener('click', ()=>{
    const u = DB.equipe.find(x=>x.id===btn.dataset.edit);
    form.querySelector('#f_email').value = u.id;
    form.querySelector('#f_email').setAttribute('readonly','readonly');
    form.querySelector('#f_nome').value = u.nome||'';
    papelSel.value = u.papel==='admin' ? 'admin' : 'equipe';
    form.querySelector('#f_permEventos').checked = !!(u.permissoes&&u.permissoes.eventos);
    form.querySelector('#f_permCardapio').checked = !!(u.permissoes&&u.permissoes.cardapio);
    editingEmail = u.id;
    refreshPermWrap();
    form.querySelector('#btnAdd').textContent = 'Salvar Alterações';
    form.querySelector('#btnCancelEditEquipe').style.display = 'inline-block';
    form.scrollIntoView({behavior:'smooth', block:'start'});
  }));
  tableWrap.querySelectorAll('[data-toggle]').forEach(btn=>btn.addEventListener('click', async ()=>{
    const u = DB.equipe.find(x=>x.id===btn.dataset.toggle);
    const novoPapel = u.papel==='admin' ? 'equipe' : 'admin';
    try{
      await db.collection('equipe').doc(u.id).set({papel:novoPapel}, {merge:true});
      await auditLog('Atualizou', 'equipe', `Papel de ${u.nome} (${u.id}): ${u.papel||'equipe'} → ${novoPapel}`);
    }catch(e){ alert('Não foi possível alterar. Confira se você é administrador.'); }
  }));
  tableWrap.querySelectorAll('[data-del]').forEach(btn=>btn.addEventListener('click', async ()=>{
    if(!confirm('Remover o acesso desta pessoa? Ela não vai mais conseguir entrar no sistema.')) return;
    const u = DB.equipe.find(x=>x.id===btn.dataset.del);
    try{
      await db.collection('equipe').doc(u.id).delete();
      await auditLog('Excluiu', 'equipe', `Acesso removido de ${u.nome} (${u.id})`);
    }catch(e){ alert('Não foi possível remover. Confira se você é administrador.'); }
  }));
}
</script>
</body>
</html>
