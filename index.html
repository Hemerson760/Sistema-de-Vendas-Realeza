    if(!editingReservaId && !carrinho.length) return;
    resumoFechamento();
    atualizarVisibilidadePago(); sincEntregue(); sincSeg(segPagto, pagtoSel.value);
    abrirFolha({ titulo: editingReservaId ? 'Salvar alterações' : 'Fechar pedido', corpo: fechamento, onFechar: ()=>{ telaSuja = true; } });
  });

  function sairDoPedido(manterAberto, msg){
    fecharFolha();
    window._reservaFormEventoTocado = false;
    telaSuja = false;
    if(manterAberto){ window._ui.msgPedido = msg; delete window._ui.editarReservaId; }
    else { window._ui.pedidoNovo = false; delete window._ui.editarReservaId; delete window._ui.msgPedido; }
    render(); window.scrollTo(0,0);
  }
  btnCancelEditReserva.addEventListener('click', ()=>{ if(confirm('Limpar todos os itens deste pedido?')){ carrinho=[]; fecharFolha(); renderCarrinho(); renderMenu(); } });
  $f('#btnFecharPedido').addEventListener('click', ()=>{
    const temAlgo = carrinho.length || clienteInput.value.trim() || editingReservaId;
    if(temAlgo && !confirm(editingReservaId ? 'Sair sem salvar as alterações deste pedido?' : 'Sair e descartar este pedido em andamento?')) return;
    sairDoPedido(false);
  });

  function carregarReservaParaEdicao(r){
    editingReservaId = r.id;
    telaSuja = true;
    carrinho = [];
    evSel.value = eventoKey(r.data, r.tipo); evSelValorAnterior = evSel.value;
    window._reservaFormEvento = evSel.value; window._reservaFormEventoTocado = true;
    refreshHorarios(); refreshItemOptions();
    atualizarDisponibilidadeForm();
    clienteInput.value = r.cliente;
    telefoneInput.value = contatoDoCliente(r.cliente) || '';
    const itemMatch = DB.cardapio.find(i=>i.item===r.item);
    if(itemMatch && !itemSel.querySelector(`option[value="${itemMatch.id}"]`)) itemSel.insertAdjacentHTML('beforeend', `<option value="${itemMatch.id}">${escapeHtml(itemMatch.item)}</option>`);
    if(itemMatch) abrirItemNoMenu(itemMatch.id, false);
    horSel.value = r.horario; horSel.dispatchEvent(new Event('change'));
    if(itemMatch && r.versao && (itemMatch.versoes||[]).length){
      const idx = itemMatch.versoes.findIndex(v=>v.nome===r.versao);
      if(idx>=0){ versaoSel.value = String(idx); versaoSel.dispatchEvent(new Event('change')); }
    }
    qtdInput.value = r.qtd;
    ajusteTipoSel.value = r.ajusteTipo || 'nenhum';
    const ajusteExistente = (r.ajusteValor!==undefined && r.ajusteValor!==null) ? Number(r.ajusteValor) : 0;
    ajusteDirecaoSel.value = ajusteExistente < 0 ? 'desconto' : 'acrescimo'; ajusteDirecaoSel.dispatchEvent(new Event('change'));
    setMoneyVal(ajusteValorInput, Math.abs(ajusteExistente));
    ajusteMotivoInput.value = r.ajusteMotivo || '';
    obsInput.value = r.observacao || '';
    if(r.ajusteAplicado || r.observacao) $p('#extrasWrap').style.display = '';
    pagtoSel.value = r.formaPagamento || 'Dinheiro'; pagtoSel.dispatchEvent(new Event('change'));
    contaReservaSel.innerHTML = contaOptionsHtml(DB.contasCaixa, r.conta||''); contaReservaSel.value = r.conta || ''; contaReservaSel.dispatchEvent(new Event('change'));
    if(r.conta) $x('#contaBloco').style.display='';
    pagoSel.value = statusPagamento(valorPagoDe(r), valorReserva(r));
    setMoneyVal(valorPagoInput, valorPagoDe(r));
    atualizarVisibilidadePago();
    entregueSel.value = r.entregue || 'Não'; sincEntregue();
    refreshOpcoesItem(r.opcoesSelecionadas); refreshPrecoPreview();
    formTitle.textContent = `Editar pedido — ${r.cliente}`;
    renderCarrinho();
  }

  btnAddItem.addEventListener('click', ()=>{
    if(!perm.criar){ alert('Você não tem permissão para lançar novos pedidos.'); return; }
    const itemObj = itemAtual();
    const qtd = parseInt(qtdInput.value,10);
    if(!itemObj || !qtd || qtd<1){ alert('Selecione um item e uma quantidade válida.'); return; }
    const versao = versaoAtual(); const versaoNome = versao ? versao.nome : null;
    const horario = horSel.value;
    const selAtual = opts.find(o=>o.value===evSel.value);
    const limite = limiteEfetivo(itemObj, versao);
    if(limite!==null && limite!==undefined && limite>0){
      const jaReservado = jaReservadoNoEvento(itemObj, versaoNome);
      if((jaReservado + qtd) > limite){ alert(`Não é possível adicionar: "${itemObj.item}${versao?' — '+versao.nome:''}" já soma ${jaReservado} de ${limite} (reservado + o que já está neste pedido). Restam apenas ${Math.max(0,limite-jaReservado)} unidade(s).`); return; }
    }
    const opcoesSelecionadas = {};
    if(itemObj.temOpcoes && (itemObj.opcoes||[]).length){
      for(let gi=0; gi<itemObj.opcoes.length; gi++){
        const grupo = itemObj.opcoes[gi];
        const checked = [...opcoesItemWrap.querySelectorAll(`input[name="opgrupo_${gi}"]:checked`)].map(x=>x.value);
        if(grupo.tipo==='unica' && checked.length===0){ alert(`Selecione uma opção em "${grupo.nome}".`); return; }
        if(checked.length){ opcoesSelecionadas[grupo.nome] = grupo.tipo==='multipla' ? checked : checked[0]; }
      }
    }
    const opcoesTexto = Object.entries(opcoesSelecionadas).map(([k,v])=>`${k}: ${Array.isArray(v)?v.join('/'):v}`).join('; ');
    const valorTotalBase = calcularValorTotal(itemEfetivo(itemObj, versao), qtd, selAtual.data);
    const ajusteTipo = ajusteTipoSel.value, ajusteValor = ajusteValorComSinal();
    const ajusteAplicado = calcularAjusteValor(ajusteTipo, ajusteValor, qtd, valorTotalBase);
    const ajusteMotivo = ajusteMotivoInput.value.trim();
    const valorTotal = Math.round((valorTotalBase + ajusteAplicado)*100)/100;
    carrinho.push({ itemId: itemObj.id, item: itemObj.item, versao: versaoNome, horario, qtd, valorTotal, precoUnit: qtd?valorTotal/qtd:0,
      ajusteTipo: ajusteAplicado?ajusteTipo:'nenhum', ajusteValor: ajusteAplicado?ajusteValor:0, ajusteAplicado, ajusteMotivo: ajusteAplicado?ajusteMotivo:'',
      opcoesSelecionadas, opcoesTexto, observacao: obsInput.value.trim() });
    telaSuja = true;
    itemAberto = null;
    renderCarrinho(); renderMenu();
  });

  btnFinalizar.addEventListener('click', async ()=>{
    if(editingReservaId ? !perm.editar : !perm.criar){ alert(editingReservaId ? 'Você não tem permissão para editar pedidos.' : 'Você não tem permissão para lançar novos pedidos.'); return; }
    const sel = opts.find(o=>o.value===evSel.value);
    let cliente = clienteInput.value.trim();
    const telefoneDigitado = telefoneInput.value.trim();
    if(!cliente){ alert('Preencha o nome do cliente.'); fecharFolha(); clienteInput.focus(); return; }
    if(!telefoneDigitado){ alert('O telefone/WhatsApp do cliente é obrigatório.'); fecharFolha(); telefoneInput.focus(); return; }
    const telefoneFmt = formatarTelefoneBR(telefoneDigitado);
    if(!telefoneFmt){ alert('Esse telefone não parece válido. Confira o DDD e o número (DDD + 8 ou 9 dígitos).'); fecharFolha(); telefoneInput.focus(); return; }
    const telefone = telefoneFmt.formatado;
    const jaExisteExato = DB.clientes.some(cl=>normalizarNome(cl.nome)===normalizarNome(cliente));
    if(!jaExisteExato){
      const similar = encontrarClienteSimilar(cliente);
      if(similar && confirm(`Já existe um cliente cadastrado com nome parecido: "${similar.nome}".\n\nOK = é a MESMA pessoa (usar "${similar.nome}").\nCancelar = é OUTRA pessoa (manter "${cliente}").`)){ cliente = similar.nome; }
    }

    if(editingReservaId){
      const itemObj = itemAtual();
      const qtd = parseInt(qtdInput.value,10);
      if(!itemObj || !qtd || qtd<1){ alert('Preencha item e quantidade válida.'); return; }
      const versao = versaoAtual(); const versaoNome = versao ? versao.nome : null;
      const limite = limiteEfetivo(itemObj, versao);
      if(limite!==null && limite!==undefined && limite>0){
        let jaReservadoFresco;
        try{
          let query = col('reservas').where('data','==',sel.data).where('tipo','==',sel.tipo).where('item','==',itemObj.item);
          if(versaoNome) query = query.where('versao','==',versaoNome);
          const snap = await query.get();
          jaReservadoFresco = snap.docs.filter(d=>d.id!==editingReservaId && (!versaoNome || (d.data().versao||null)===versaoNome)).reduce((s,d)=>s+(d.data().qtd||0),0);
        }catch(e){ console.error('Falha ao revalidar limite', e); jaReservadoFresco = jaReservadoNoEvento(itemObj, versaoNome); }
        if((jaReservadoFresco + qtd) > limite){ alert(`Não é possível salvar: "${itemObj.item}${versao?' — '+versao.nome:''}" já tem ${jaReservadoFresco} de ${limite} reservados neste evento. Restam apenas ${Math.max(0,limite-jaReservadoFresco)} unidade(s).`); return; }
      }
      const opcoesSelecionadas = {};
      if(itemObj.temOpcoes && (itemObj.opcoes||[]).length){
        for(let gi=0; gi<itemObj.opcoes.length; gi++){
          const grupo = itemObj.opcoes[gi];
          const checked = [...opcoesItemWrap.querySelectorAll(`input[name="opgrupo_${gi}"]:checked`)].map(x=>x.value);
          if(grupo.tipo==='unica' && checked.length===0){ alert(`Selecione uma opção em "${grupo.nome}".`); return; }
          if(checked.length){ opcoesSelecionadas[grupo.nome] = grupo.tipo==='multipla' ? checked : checked[0]; }
        }
      }
      const opcoesTexto = Object.entries(opcoesSelecionadas).map(([k,v])=>`${k}: ${Array.isArray(v)?v.join('/'):v}`).join('; ');
      const valorTotalBase = calcularValorTotal(itemEfetivo(itemObj, versao), qtd, sel.data);
      const ajusteTipo = ajusteTipoSel.value, ajusteValor = ajusteValorComSinal();
      const ajusteAplicado = calcularAjusteValor(ajusteTipo, ajusteValor, qtd, valorTotalBase);
      const ajusteMotivo = ajusteMotivoInput.value.trim();
      const valorTotal = Math.round((valorTotalBase + ajusteAplicado)*100)/100;
      const reservaOriginal = DB.reservas.find(r=>r.id===editingReservaId);
      let valorPago;
      if(pagoSel.value==='Sim') valorPago = valorTotal;
      else if(pagoSel.value==='Parcial') valorPago = Math.min(moneyVal(valorPagoInput), valorTotal);
      else valorPago = 0;
      const valorPagoAntigo = reservaOriginal ? valorPagoDe(reservaOriginal) : 0;
      const dadosReserva = {
        data: sel.data, tipo: sel.tipo, horario: horSel.value,
        cliente, item: itemObj.item, versao: versaoNome, qtd, precoUnit: qtd ? valorTotal/qtd : 0, valorTotal,
        ajusteTipo: ajusteAplicado ? ajusteTipo : 'nenhum', ajusteValor: ajusteAplicado ? ajusteValor : 0, ajusteAplicado, ajusteMotivo: ajusteAplicado ? ajusteMotivo : '',
        opcoesSelecionadas, opcoesTexto, observacao: obsInput.value.trim(),
        formaPagamento: pagtoSel.value, conta: contaReservaSel.value || null,
        pago: statusPagamento(valorPago, valorTotal), valorPago,
        dataPagamento: proximaDataPagamento(valorPago, valorPagoAntigo, reservaOriginal?reservaOriginal.dataPagamento:null),
        entregue: entregueSel.value,
      };
      try{
        btnFinalizar.disabled = true;
        await col('reservas').doc(editingReservaId).update(dadosReserva);
        await auditLog('Atualizou', 'reservas', `Reserva de ${cliente} editada — ${itemObj.item} (${qtd}x, ${fmtMoney(valorTotal)})${ajusteAplicado?` [${descreverAjuste(ajusteTipo, ajusteValor, ajusteAplicado)}]`:''}`);
        await salvarContatoCliente(cliente, telefone);
        sairDoPedido(false);
      }catch(e){ btnFinalizar.disabled=false; alert('Não foi possível salvar a edição.'); console.error(e); }
      return;
    }

    if(!carrinho.length){ alert('Adicione pelo menos um item ao pedido antes de finalizar.'); return; }
    if(pagoSel.value==='Parcial' && carrinho.length>1){ alert('Pagamento parcial na hora de finalizar só funciona quando o pedido tem 1 item só. Finalize como "Ainda não" ou "Tudo" e ajuste o pagamento depois, item por item, em "Pedidos".'); return; }
    const valorPagoDigitadoCarrinho = pagoSel.value==='Parcial' ? moneyVal(valorPagoInput) : 0;
    // revalida no Firestore o limite de produção de cada combinação item+versão do carrinho
    const combosUnicos = [...new Set(carrinho.map(l=>`${l.item}||${l.versao||''}`))];
    for(const combo of combosUnicos){
      const [nomeItem, versaoNomeRaw] = combo.split('||');
      const versaoNome = versaoNomeRaw || null;
      const itemObj = DB.cardapio.find(i=>i.item===nomeItem);
      const versaoObj = versaoNome && itemObj ? (itemObj.versoes||[]).find(v=>v.nome===versaoNome) : null;
      const limite = itemObj ? limiteEfetivo(itemObj, versaoObj) : null;
      if(itemObj && limite!==null && limite!==undefined && limite>0){
        const qtdCarrinho = carrinho.filter(l=>l.item===nomeItem && (l.versao||null)===versaoNome).reduce((s,l)=>s+l.qtd,0);
        let jaReservadoFresco;
        try{
          let query = col('reservas').where('data','==',sel.data).where('tipo','==',sel.tipo).where('item','==',nomeItem);
          if(versaoNome) query = query.where('versao','==',versaoNome);
          const snap = await query.get();
          jaReservadoFresco = snap.docs.filter(d=>!versaoNome || (d.data().versao||null)===versaoNome).reduce((s,d)=>s+(d.data().qtd||0),0);
        }catch(e){ console.error('Falha ao revalidar limite', e); jaReservadoFresco = DB.reservas.filter(r=>r.data===sel.data && r.tipo===sel.tipo && r.item===nomeItem && (r.versao||null)===versaoNome).reduce((s,r)=>s+(Number(r.qtd)||0),0); }
        if((jaReservadoFresco + qtdCarrinho) > limite){ alert(`Não é possível finalizar: "${nomeItem}${versaoNome?' — '+versaoNome:''}" já tem ${jaReservadoFresco} de ${limite} reservados neste evento, e este pedido pede mais ${qtdCarrinho}. Restam apenas ${Math.max(0,limite-jaReservadoFresco)} — ajuste a quantidade e tente de novo.`); return; }
      }
    }
    btnFinalizar.disabled = true;
    try{
      const vendedor = userName();
      for(const linha of carrinho){
        let valorPago;
        if(pagoSel.value==='Sim') valorPago = linha.valorTotal;
        else if(pagoSel.value==='Parcial') valorPago = Math.min(valorPagoDigitadoCarrinho, linha.valorTotal);
        else valorPago = 0;
        const dadosReserva = {
          data: sel.data, tipo: sel.tipo, horario: linha.horario,
          cliente, item: linha.item, versao: linha.versao||null, qtd: linha.qtd, precoUnit: linha.precoUnit, valorTotal: linha.valorTotal,
          ajusteTipo: linha.ajusteTipo, ajusteValor: linha.ajusteValor, ajusteAplicado: linha.ajusteAplicado, ajusteMotivo: linha.ajusteMotivo,
          opcoesSelecionadas: linha.opcoesSelecionadas, opcoesTexto: linha.opcoesTexto, observacao: linha.observacao,
          formaPagamento: pagtoSel.value, conta: contaReservaSel.value || null,
          pago: statusPagamento(valorPago, linha.valorTotal), valorPago,
          dataPagamento: proximaDataPagamento(valorPago, 0, null),
          entregue: entregueSel.value, vendedor,
        };
        await col('reservas').add(dadosReserva);
        await auditLog('Criou', 'reservas', `Pedido de ${cliente} — ${linha.item} (${linha.qtd}x) em ${fmtDateBR(sel.data)}, horário ${linha.horario}${linha.ajusteAplicado?`, com ${descreverAjuste(linha.ajusteTipo, linha.ajusteValor, linha.ajusteAplicado)}`:''}`);
      }
      await salvarContatoCliente(cliente, telefone);
      sairDoPedido(true, `Pedido de ${cliente} salvo (${fmtMoney(carrinho.reduce((s,l)=>s+l.valorTotal,0))})`);
    }catch(e){ btnFinalizar.disabled=false; alert('Não foi possível salvar o pedido.'); console.error(e); }
  });

  // estado inicial
  atualizarDisponibilidadeForm();
  if(evSel.value){ refreshHorarios(); refreshItemOptions(); }
  atualizarVisibilidadePago(); sincEntregue();
  renderCarrinho();
  if(reservaParaEditar) carregarReservaParaEdicao(reservaParaEditar);
}

/* ---------------------------------------------------------------- PEDIDOS LANÇADOS */
function renderPedidosLista(c){
  const opts = eventosOptions();
  const perm = { criar: podeCriar('reservas'), editar: podeEditar('reservas'), excluir: podeExcluir('reservas') };
  telaSuja = false;
  window._filtros = window._filtros || {evento:'', rapido:'', eventoTocado:false};
  sincronizarSelecaoEvento(()=>window._filtros.evento, v=>{window._filtros.evento=v;}, ()=>!!window._filtros.eventoTocado, v=>{window._filtros.eventoTocado=v;}, opts, ['__todos']);
  window._reservaSort = window._reservaSort || {key:'data', dir:'desc'};
  const visao = window._pedidosVisao || 'lista';

  const selEv = el(`<select id="filtEvento" class="pillselect"><option value="">— Selecione a cantina —</option>${eventoOptionsHtml(opts, window._filtros.evento)}<option value="__todos" ${window._filtros.evento==='__todos'?'selected':''}>Todos (histórico completo)</option></select>`);
  selEv.addEventListener('change', e=>{ window._filtros.evento=e.target.value; window._filtros.eventoTocado=true; render(); });
  cabecalho(c, 'Pedidos', { direita: selEv });

  let base = [];
  if(window._filtros.evento==='__todos') base = [...DB.reservas];
  else if(window._filtros.evento){ const [d,t]=window._filtros.evento.split('|'); base = DB.reservas.filter(r=>r.data===d && r.tipo===t); }
  const cont = { todos: base.length, apagar: base.filter(r=>statusPagamento(valorPagoDe(r),valorReserva(r))!=='Sim').length, aentregar: base.filter(r=>r.entregue!=='Sim').length, obs: base.filter(temParticularidade).length };
  const filtrosRapidos = { apagar: r=>statusPagamento(valorPagoDe(r),valorReserva(r))!=='Sim', aentregar: r=>r.entregue!=='Sim', obs: temParticularidade };
  let list = window._filtros.rapido && filtrosRapidos[window._filtros.rapido] ? base.filter(filtrosRapidos[window._filtros.rapido]) : base;

  const busca = el(`<div class="field" style="margin-bottom:10px;"><input type="search" id="buscaPedido" placeholder="Buscar cliente ou item"></div>`);
  c.appendChild(busca);
  const chips = el(`<div class="chips mb10">
    <button class="chip ${!window._filtros.rapido?'on':''}" data-rapido="">Todos ${cont.todos}</button>
    <button class="chip ${window._filtros.rapido==='apagar'?'on':''}" data-rapido="apagar">A pagar ${cont.apagar}</button>
    <button class="chip ${window._filtros.rapido==='aentregar'?'on':''}" data-rapido="aentregar">A entregar ${cont.aentregar}</button>
    <button class="chip ${window._filtros.rapido==='obs'?'on':''}" data-rapido="obs" style="${window._filtros.rapido==='obs'?'':'color:var(--warn);'}">⚠ Obs. ${cont.obs}</button>
  </div>`);
  c.appendChild(chips);
  chips.querySelectorAll('[data-rapido]').forEach(b=>b.addEventListener('click', ()=>{ window._filtros.rapido = b.dataset.rapido; render(); }));
  const seg = segmentado([['lista','Lista'],['montagem','Montagem'],['cliente','Por cliente']], visao, v=>{ window._pedidosVisao=v; render(); });
  seg.classList.add('mb12'); c.appendChild(seg);

  if(!window._filtros.evento){
    c.appendChild(el(`<div class="card pad empty-state">A cantina mais próxima já passou — escolha acima qual evento você quer ver (ou "Todos" para o histórico completo).</div>`));
  } else if(!list.length){
    c.appendChild(el(`<div class="card pad empty-state">Nenhum pedido encontrado${window._filtros.rapido?' com este filtro':''}.</div>`));
  }

  let horarios = null;
  if(window._filtros.evento && window._filtros.evento!=='__todos'){
    const [d,t] = window._filtros.evento.split('|');
    const evObj = DB.eventos.find(e=>e.data===d && e.tipo===t);
    horarios = [...new Set([...((evObj&&evObj.cultos)||[]), ...list.map(r=>r.horario)])].filter(Boolean);
  }
  const buscaKey = r => escapeHtml(normalizarNome(`${r.cliente} ${r.item} ${r.versao||''}`));

  if(visao==='lista' && list.length){
    const SORT = [['data','Data'],['cliente','Cliente'],['item','Item'],['valor','Valor'],['pago','Pagamento'],['entregue','Entrega'],['vendedor','Lançado por']];
    const ord = el(`<div class="row mb10" style="gap:8px;"><span class="sub">Ordenar por</span><select id="ordCampo" class="pillselect" style="background-color:#fff;border-color:var(--line);color:var(--ink);">${SORT.map(([k,l])=>`<option value="${k}" ${window._reservaSort.key===k?'selected':''}>${l}</option>`).join('')}</select><button class="chip sm" id="ordDir">${window._reservaSort.dir==='asc'?'▲ crescente':'▼ decrescente'}</button></div>`);
    ord.querySelector('#ordCampo').addEventListener('change', e=>{ window._reservaSort.key=e.target.value; render(); });
    ord.querySelector('#ordDir').addEventListener('click', ()=>{ window._reservaSort.dir = window._reservaSort.dir==='asc'?'desc':'asc'; render(); });
    c.appendChild(ord);
    const valorOrd = (r,k)=>({data:r.data+' '+r.horario, cliente:normalizarNome(r.cliente), item:r.item||'', valor:valorReserva(r), pago:statusPagamento(valorPagoDe(r),valorReserva(r)), entregue:r.entregue||'', vendedor:r.vendedor||''}[k]);
    list.sort((a,b)=>{ const va=valorOrd(a,window._reservaSort.key), vb=valorOrd(b,window._reservaSort.key); let cmp=(typeof va==='number'&&typeof vb==='number')?va-vb:String(va).localeCompare(String(vb)); if(cmp===0 && window._reservaSort.key!=='cliente') cmp=normalizarNome(a.cliente).localeCompare(normalizarNome(b.cliente)); return window._reservaSort.dir==='asc'?cmp:-cmp; });
    const card = r => {
      const total = valorReserva(r), pago = valorPagoDe(r), st = statusPagamento(pago,total);
      return `<div class="pcard ${temParticularidade(r)?'obs':''}" data-pedido="${r.id}" data-busca="${buscaKey(r)}">
        <div class="between"><div class="row" style="gap:7px;min-width:0;"><span class="nome ell">${escapeHtml(r.cliente)}</span>${linkWa(contatoDoCliente(r.cliente))}</div><span class="valor ${st==='Sim'?'':'warn'}">${fmtMoney(total)}</span></div>
        <div class="sub mt4">${escapeHtml(r.item)}${r.versao?' — '+escapeHtml(r.versao):''} ×${r.qtd} · ${escapeHtml(r.horario||'')}${window._filtros.evento==='__todos'?' · '+fmtDataCurta(r.data)+' '+escapeHtml(r.tipo||''):''}${st==='Parcial'?` · pagou ${fmtMoney(pago)}`:''}</div>
        ${r.opcoesTexto?`<div class="optline">${escapeHtml(r.opcoesTexto)}</div>`:''}
        ${r.observacao?`<div class="obsline">⚠️ ${escapeHtml(r.observacao)}</div>`:''}
        <div class="chips wrap mt10">
          <button class="chip sm ${st==='Sim'?'done':st==='Parcial'?'part':''}" ${perm.editar?`data-pago="${r.id}"`:'disabled'} title="Toque para quitar tudo (ou desfazer)">${ic('coins',13,'currentColor',2)}${st==='Sim'?'Pago':st==='Parcial'?'Parcial':'Pago'}</button>
          <button class="chip sm ${r.entregue==='Sim'?'done':''}" ${perm.editar?`data-ent="${r.id}"`:'disabled'}>${ic('box',13,'currentColor',2)}Entregue</button>
          <button class="chip sm ${r.montada==='Sim'?'done':''}" ${perm.editar?`data-montada="${r.id}"`:'disabled'}>${ic('check',13,'currentColor',2)}Montada</button>
          ${r.confirmadoEm?`<span class="tag ok" style="align-self:center;">avisado</span>`:''}
        </div></div>`;
    };
    const wrap = el(`<div id="listaPedidos"></div>`);
    if(horarios && horarios.length>1 && window._reservaSort.key==='data'){
      horarios.forEach(h=>{ const rs=list.filter(r=>r.horario===h); if(!rs.length) return; wrap.insertAdjacentHTML('beforeend', `<div class="hora-head">${ic('clock',16,'var(--gold)')} ${escapeHtml(h)} <span class="sub" style="font-style:normal;font-family:Inter;">(${rs.length})</span></div>` + rs.map(card).join('')); });
    } else wrap.innerHTML = list.map(card).join('');
    c.appendChild(wrap);
  }

  if(visao==='montagem' && list.length){
    const grupos = (horarios && horarios.length) ? horarios : [...new Set(list.map(r=>r.horario))];
    const ck = (r, tipo) => {
      const st = statusPagamento(valorPagoDe(r),valorReserva(r));
      const on = tipo==='pago' ? (st==='Sim'?'on':st==='Parcial'?'part':'') : (tipo==='ent'? (r.entregue==='Sim'?'on':'') : (r.montada==='Sim'?'on':''));
      const attr = perm.editar ? `data-${tipo==='pago'?'pago':tipo==='ent'?'ent':'montada'}="${r.id}"` : 'disabled';
      return `<button class="chk ${on}" ${attr} aria-label="${tipo}">${on?ic('check',16,'#fff',2.6):''}</button>`;
    };
    grupos.forEach(h=>{
      const rs = list.filter(r=>r.horario===h).sort((a,b)=>normalizarNome(a.cliente).localeCompare(normalizarNome(b.cliente)));
      if(!rs.length) return;
      c.appendChild(el(`<div class="grp"><div class="gh"><span class="lbl" style="color:var(--ink);">${ic('clock',12,'var(--gold)',2)} Culto das ${escapeHtml(h)}</span><span class="sub fs11">${rs.filter(r=>r.entregue==='Sim').length} de ${rs.length} entregues</span></div>
        <div class="box table-wrap"><table><thead><tr><th>Cliente / item</th><th class="r">Pago</th><th class="r">Mont.</th><th class="r">Entr.</th></tr></thead><tbody>
        ${rs.map(r=>`<tr data-busca="${buscaKey(r)}"><td class="clickable" data-pedido="${r.id}"><div class="fw6">${escapeHtml(r.cliente)}</div><div class="sub fs11">${escapeHtml(r.item)}${r.versao?' — '+escapeHtml(r.versao):''} ×${r.qtd}</div>${r.opcoesTexto?`<div class="fs11 gold fw6">${escapeHtml(r.opcoesTexto)}</div>`:''}${r.observacao?`<div class="fs11 warn fw6">⚠ ${escapeHtml(r.observacao)}</div>`:''}</td><td class="r">${ck(r,'pago')}</td><td class="r">${ck(r,'mont')}</td><td class="r">${ck(r,'ent')}</td></tr>`).join('')}
        </tbody></table></div></div>`));
    });
    c.appendChild(el(`<div class="sub fs11 center">Toque nos quadrados para marcar · toque no nome para abrir o pedido</div>`));
  }

  if(visao==='cliente' && list.length){
    const grupos = {};
    list.forEach(r=>{ const k=normalizarNome(r.cliente); (grupos[k]=grupos[k]||{nome:r.cliente, itens:[]}).itens.push(r); });
    Object.values(grupos).sort((a,b)=>{ const fa=a.itens.reduce((s,r)=>s+saldoPendente(r),0), fb=b.itens.reduce((s,r)=>s+saldoPendente(r),0); return fb-fa || normalizarNome(a.nome).localeCompare(normalizarNome(b.nome)); }).forEach(g=>{
      const total = g.itens.reduce((s,r)=>s+valorReserva(r),0), falta = g.itens.reduce((s,r)=>s+saldoPendente(r),0);
      const grp = el(`<div class="grp" data-busca="${escapeHtml(normalizarNome(g.nome+' '+g.itens.map(r=>r.item).join(' ')))}"><div class="box">
        <div class="li"><span class="avatar">${escapeHtml(iniciais(g.nome))}</span><div class="m"><div class="t1">${escapeHtml(g.nome)}</div><div class="t2">${g.itens.length} ${g.itens.length===1?'item':'itens'} · total ${fmtMoney(total)}</div></div>${linkWa(contatoDoCliente(g.nome))}</div>
        ${g.itens.map(r=>`<div class="li sublist clickable" data-pedido="${r.id}"><div class="m"><div class="t2" style="color:var(--ink);font-size:13px;">${escapeHtml(r.item)}${r.versao?' — '+escapeHtml(r.versao):''} ×${r.qtd} · ${escapeHtml(r.horario||'')}</div></div>${tagPagamento(r)}<div class="rt fs13" style="min-width:70px;">${fmtMoney(valorReserva(r))}</div></div>`).join('')}
        ${falta>0.004?`<div class="li" style="background:var(--warn-wash);"><div class="m"><div class="t1 warn">Falta pagar ${fmtMoney(falta)}</div></div>${perm.editar?`<button class="btn sm" data-receber-tudo="${escapeHtml(normalizarNome(g.nome))}">Receber tudo</button>`:''}</div>`:`<div class="li" style="background:var(--ok-wash);"><div class="m"><div class="t1 ok">${ic('check',14,'var(--ok)',2.4)} Tudo pago</div></div></div>`}
      </div></div>`);
      c.appendChild(grp);
    });
    c.querySelectorAll('[data-receber-tudo]').forEach(b=>b.addEventListener('click', async ()=>{
      const g = grupos[b.dataset.receberTudo]; if(!g) return;
      const pend = g.itens.filter(r=>saldoPendente(r)>0.004);
      const falta = pend.reduce((s,r)=>s+saldoPendente(r),0);
      if(!confirm(`Marcar como pago tudo o que ${g.nome} deve aqui (${fmtMoney(falta)} em ${pend.length} pedido${pend.length===1?'':'s'})?`)) return;
      b.disabled = true;
      for(const r of pend) await marcarPagoTotal(r);
    }));
  }

  // busca: só esconde/mostra (sem redesenhar, pra não perder o teclado)
  busca.querySelector('input').addEventListener('input', e=>{
    const q = normalizarNome(e.target.value);
    c.querySelectorAll('[data-busca]').forEach(x=>{ x.style.display = !q || x.dataset.busca.includes(q) ? '' : 'none'; });
    c.querySelectorAll('.hora-head').forEach(h=>{ let n=h.nextElementSibling, vis=false; while(n && !n.classList.contains('hora-head')){ if(n.style.display!=='none') vis=true; n=n.nextElementSibling; } h.style.display = vis?'':'none'; });
  });

  // ações rápidas (mesmas regras de antes)
  c.querySelectorAll('[data-pago]').forEach(btn=>btn.addEventListener('click', async e=>{
    e.stopPropagation();
    const r = DB.reservas.find(x=>x.id===btn.dataset.pago); if(!r) return;
    const total = valorReserva(r), valorPagoAntigo = valorPagoDe(r);
    const jaEstaPagoTotal = statusPagamento(valorPagoAntigo, total)==='Sim';
    const novoValorPago = jaEstaPagoTotal ? 0 : total, novoPago = jaEstaPagoTotal ? 'Não' : 'Sim';
    const dataPagamento = proximaDataPagamento(novoValorPago, valorPagoAntigo, r.dataPagamento);
    btn.disabled = true;
    await col('reservas').doc(r.id).update({pago:novoPago, valorPago:novoValorPago, dataPagamento});
    await auditLog('Atualizou', 'reservas', `Pagamento de ${r.cliente} (${r.item}): ${r.pago||'Não'} → ${novoPago}${novoPago==='Sim'?` (recebido em ${fmtDateBR(dataPagamento)})`:''}`);
  }));
  c.querySelectorAll('[data-ent]').forEach(btn=>btn.addEventListener('click', async e=>{ e.stopPropagation(); const r=DB.reservas.find(x=>x.id===btn.dataset.ent); if(!r) return; btn.disabled=true; await alternarEntregue(r); }));
  c.querySelectorAll('[data-montada]').forEach(btn=>btn.addEventListener('click', async e=>{
    e.stopPropagation(); const r=DB.reservas.find(x=>x.id===btn.dataset.montada); if(!r) return; btn.disabled=true;
    const novo = r.montada==='Sim'?'Não':'Sim';
    await col('reservas').doc(r.id).update({montada:novo});
    await auditLog('Atualizou', 'reservas', `Montagem de ${r.cliente} (${r.item}): ${r.montada||'Não'} → ${novo}`);
  }));
  c.querySelectorAll('[data-pedido]').forEach(x=>x.addEventListener('click', e=>{
    if(e.target.closest('button,a')) return;
    const r = DB.reservas.find(y=>y.id===x.dataset.pedido); if(r) abrirDetalhePedido(r, perm);
  }));
  if(perm.criar && opts.length && DB.cardapio.some(i=>i.ativo)) definirFab(null, abrirNovoPedido, 'fabNovoPedido');
}

/* Folha com tudo de um pedido: receber (com a máscara de R$), entregar, montar, avisar, editar, excluir. */
function abrirDetalhePedido(r, perm){
  const total = valorReserva(r), pago = valorPagoDe(r), falta = Math.max(0, Math.round((total-pago)*100)/100);
  const pct = total>0 ? Math.min(100, pago/total*100) : 0;
  const corpo = el(`<div>
    <div class="between"><div class="grow"><div class="h2" style="font-size:22px;">${escapeHtml(r.cliente)}</div><div class="sub">${escapeHtml(r.item)}${r.versao?' — '+escapeHtml(r.versao):''} ×${r.qtd} · culto ${escapeHtml(r.horario||'')} · ${fmtDataCurta(r.data)} ${escapeHtml(r.tipo||'')}</div><div class="sub fs11">${escapeHtml(r.formaPagamento||'')}${r.conta?' · '+escapeHtml(r.conta):''} · lançado por ${escapeHtml(r.vendedor||'—')}</div></div>${linkWa(contatoDoCliente(r.cliente))}</div>
    ${r.opcoesTexto?`<div class="optline">${escapeHtml(r.opcoesTexto)}</div>`:''}
    ${r.ajusteAplicado?`<div class="optline" style="background:#F1EEE3;">${r.ajusteAplicado>0?'➕':'➖'} ${escapeHtml(descreverAjuste(r.ajusteTipo, r.ajusteValor, r.ajusteAplicado))}${r.ajusteMotivo?' — '+escapeHtml(r.ajusteMotivo):''}</div>`:''}
    ${r.observacao?`<div class="obsline">⚠️ ${escapeHtml(r.observacao)}</div>`:''}
    <div class="card pad mt12"><div class="grid3 center" style="gap:4px;"><div><div class="lbl">Total</div><div class="money fs14 mt4">${fmtMoney(total)}</div></div><div><div class="lbl">Pago</div><div class="money fs14 ok mt4">${fmtMoney(pago)}</div></div><div><div class="lbl">Falta</div><div class="money fs14 ${falta>0?'warn':''} mt4">${fmtMoney(falta)}</div></div></div><div class="bar mt10"><i style="width:${pct}%"></i></div></div>
    <div id="blocoReceber"></div>
    <div class="grid2 mt12" id="blocoToggles"></div>
    <div class="row wrap mt16" style="justify-content:space-around;gap:10px;" id="blocoAcoes"></div>
  </div>`);
  if(perm.editar){
    if(falta>0){
      const rec = el(`<div><label class="mt14">Receber agora</label><div class="row" style="gap:8px;"><input type="text" id="valorReceber" style="flex:1;font-size:18px;"><button class="btn" id="btnReceber" style="min-width:120px;">Receber</button></div>
        ${DB.contasCaixa.length?`<select id="contaReceber" class="hide">${contaOptionsHtml(DB.contasCaixa, r.conta||'')}</select><div id="contaReceberChips" class="mt8"></div>`:''}</div>`);
      corpo.querySelector('#blocoReceber').appendChild(rec);
      const inp = rec.querySelector('#valorReceber'); attachMoneyMask(inp); setMoneyVal(inp, falta);
      const contaSel = rec.querySelector('#contaReceber');
      if(contaSel){ contaSel.value = r.conta||''; rec.querySelector('#contaReceberChips').appendChild(chipsDoSelect(contaSel, {quebrar:true, sm:true, rotulo:o=>o.value===''?'Sem conta':o.textContent})); }
      rec.querySelector('#btnReceber').addEventListener('click', async ()=>{
        const digitado = moneyVal(inp);
        if(!(digitado>0)){ alert('Informe quanto está recebendo agora.'); return; }
        const novoPago = Math.min(total, Math.round((pago+digitado)*100)/100);
        const status = statusPagamento(novoPago, total);
        const dataPagamento = proximaDataPagamento(novoPago, pago, r.dataPagamento);
        const upd = { valorPago: novoPago, pago: status, dataPagamento };
        if(contaSel && contaSel.value) upd.conta = contaSel.value;
        rec.querySelector('#btnReceber').disabled = true;
        await col('reservas').doc(r.id).update(upd);
        await auditLog('Atualizou', 'reservas', `Pagamento de ${r.cliente} (${r.item}): ${fmtMoney(pago)} → ${fmtMoney(novoPago)} de ${fmtMoney(total)}${status==='Sim'?' (quitado)':' (parcial)'}`);
        fecharFolhaERedesenhar();
      });
    }
    if(pago>0){
      const desf = el(`<button class="linkbtn mt10" style="color:var(--warn);">Desfazer pagamento (voltar para "não pago")</button>`);
      desf.addEventListener('click', async ()=>{
        if(!confirm(`Zerar o pagamento de ${r.cliente} (${fmtMoney(pago)})? Isso tira esse valor do caixa.`)) return;
        await col('reservas').doc(r.id).update({ valorPago:0, pago:'Não', dataPagamento:null });
        await auditLog('Atualizou', 'reservas', `Pagamento de ${r.cliente} (${r.item}): ${fmtMoney(pago)} → R$ 0,00 (zerado)`);
        fecharFolhaERedesenhar();
      });
      corpo.querySelector('#blocoReceber').appendChild(desf);
    }
    const tog = corpo.querySelector('#blocoToggles');
    [['entregue','Entregue'],['montada','Montada']].forEach(([campo,rot])=>{
      const box = el(`<div class="card flat pad between"><span class="fw6 fs13">${rot}</span><button class="sw ${r[campo]==='Sim'?'on':''}" data-campo="${campo}"></button></div>`);
      box.querySelector('.sw').addEventListener('click', async e=>{
        const sw = e.currentTarget; const atual = sw.classList.contains('on') ? 'Sim' : 'Não'; const novo = atual==='Sim'?'Não':'Sim';
        sw.classList.toggle('on'); sw.disabled = true;
        await col('reservas').doc(r.id).update({[campo]: novo});
        await auditLog('Atualizou', 'reservas', `${rot==='Entregue'?'Entrega':'Montagem'} de ${r.cliente} (${r.item}): ${atual} → ${novo}`);
        sw.disabled = false;
      });
      tog.appendChild(box);
    });
  }
  const acoes = corpo.querySelector('#blocoAcoes');
  if(perm.editar){
    const av = el(`<button class="linkbtn row ok" style="gap:6px;font-size:13.5px;color:var(--ok);">${ic('bell',17,'var(--ok)')} ${r.confirmadoEm?'Avisar de novo':'Avisar cliente'}</button>`);
    av.addEventListener('click', async ()=>{
      const contato = contatoDoCliente(r.cliente); const teste = whatsappUrl(contato);
      if(!teste || teste==='INVALIDO'){ alert(`"${r.cliente}" não tem um telefone válido cadastrado. Cadastre (ou corrija) em Clientes antes de avisar.`); return; }
      window.open(whatsappUrl(contato, mensagemConfirmacao(r)), '_blank');
      try{ await col('reservas').doc(r.id).update({ confirmadoEm: firebase.firestore.FieldValue.serverTimestamp(), confirmadoPor: userName() }); await auditLog('Atualizou', 'reservas', `Confirmação enviada por WhatsApp para ${r.cliente} (${r.item})`); }catch(e){ console.error('Falha ao registrar confirmação', e); }
    });
    acoes.appendChild(av);
    const ed = el(`<button class="linkbtn row" style="gap:6px;font-size:13.5px;" id="btnEditarPedido">${ic('edit',17,'var(--gold)')} Editar</button>`);
    ed.addEventListener('click', ()=>{ fecharFolha(); abrirEdicaoPedido(r.id); });
    acoes.appendChild(ed);
  }
  if(perm.excluir){
    const ex = el(`<button class="linkbtn row" style="gap:6px;font-size:13.5px;color:var(--warn);">${ic('trash',17,'var(--warn)')} Excluir</button>`);
    ex.addEventListener('click', async ()=>{
      if(!confirm('Excluir este pedido?')) return;
      await col('reservas').doc(r.id).delete();
      await auditLog('Excluiu', 'reservas', `Pedido de ${r.cliente} — ${r.item} (${fmtMoney(valorReserva(r))}, pago: ${r.pago||'Não'})`);
      fecharFolhaERedesenhar();
    });
    acoes.appendChild(ex);
  }
  abrirFolha({ semTitulo:true, corpo });
}


/* ==================== DESPESAS ====================
   Lista agrupada por cantina (com subtotal de cada uma) + filtro por evento e categoria.
   Lançar/editar abre uma folha: valor em destaque, Qtd × Preço calcula sozinho, categoria e
   conta em botões. Mesma gravação/auditoria de antes. */
const UNIDADES_PADRAO = ['kg','g','L','ml','unidade','pacote','caixa','dúzia','fardo','saco'];
const SEM_EVENTO_DESP = '__avulsa';

function renderDespesas(c){
  const opts = eventosOptions();
  const perm = { criar: podeCriar('despesas'), editar: podeEditar('despesas'), excluir: podeExcluir('despesas') };
  telaSuja = false;
  cabecalho(c, 'Despesas', { voltar: ()=>irPara('mais'), voltarTexto:'Mais' });
  if(!perm.criar && !perm.editar) avisoSoConsulta(c, 'Despesas');

  window._filtrosDespesa = window._filtrosDespesa || {evento:'', categoria:''};
  const F = window._filtrosDespesa;

  const filtros = el(`<div class="mb12">
    <div class="row wrap" style="gap:8px;">
      <select id="filtEventoDespesa" class="pillselect"><option value="">Todas as cantinas</option><option value="${SEM_EVENTO_DESP}" ${F.evento===SEM_EVENTO_DESP?'selected':''}>Sem evento (geral)</option>${eventoOptionsHtml(opts, F.evento)}</select>
    </div>
    <div class="chips mt8" id="catChipsFiltro"></div>
  </div>`);
  c.appendChild(filtros);
  filtros.querySelector('#filtEventoDespesa').addEventListener('change', e=>{ F.evento = e.target.value; render(); });
  const catsUsadas = [...new Set([...DB.categoriasDespesas.map(x=>x.nome), ...DB.despesas.map(d=>d.categoria).filter(Boolean)])].sort((a,b)=>a.localeCompare(b));
  const catChips = filtros.querySelector('#catChipsFiltro');
  catChips.innerHTML = [['','Todas'], ...catsUsadas.map(n=>[n,n])].map(([v,l])=>`<button type="button" class="chip sm ${F.categoria===v?'on':''}" data-catfilt="${escapeHtml(v)}">${escapeHtml(l)}</button>`).join('');
  catChips.addEventListener('click', e=>{ const b=e.target.closest('[data-catfilt]'); if(!b) return; F.categoria = b.dataset.catfilt; render(); });

  let list = [...DB.despesas];
  if(F.evento===SEM_EVENTO_DESP) list = list.filter(x=>!x.tipo);
  else if(F.evento){ const [d,t]=F.evento.split('|'); list = list.filter(x=>x.data===d && x.tipo===t); }
  if(F.categoria) list = list.filter(x=>(x.categoria||'')===F.categoria);

  const total = list.reduce((s,d)=>s+Number(d.valor||0),0);
  c.appendChild(el(`<div class="card pad mb12 row" style="gap:12px;"><div class="icobox warn">${ic('receipt',19,'var(--warn)')}</div>
    <div class="grow"><div class="lbl">Total gasto${F.evento||F.categoria?' (filtro)':''}</div><div class="money warn" style="font-size:24px;">${fmtMoney(total)}</div></div>
    <div class="right sub">${list.length} lançamento${list.length===1?'':'s'}</div></div>`));

  if(!list.length){
    c.appendChild(el(`<div class="card pad empty-state">Nenhuma despesa${F.evento||F.categoria?' com esse filtro':' cadastrada'}${perm.criar?' — use o botão + para lançar.':'.'}</div>`));
  }

  // Agrupa por cantina (data|tipo); saídas sem evento ficam em "Saídas gerais".
  const grupos = {};
  list.forEach(d=>{
    const k = d.tipo ? eventoKey(d.data,d.tipo) : SEM_EVENTO_DESP;
    (grupos[k] = grupos[k] || []).push(d);
  });
  const chaves = Object.keys(grupos).sort((a,b)=>{
    if(a===SEM_EVENTO_DESP) return 1; if(b===SEM_EVENTO_DESP) return -1;
    return b.localeCompare(a);
  });
  chaves.forEach(k=>{
    const itens = grupos[k].sort((a,b)=>(b.data||'').localeCompare(a.data||''));
    const sub = itens.reduce((s,d)=>s+Number(d.valor||0),0);
    let titulo;
    if(k===SEM_EVENTO_DESP) titulo = 'Saídas gerais (sem evento)';
    else { const [dt,tp]=k.split('|'); const ev = DB.eventos.find(e=>e.data===dt && e.tipo===tp); titulo = `${fmtDateBR(dt)} — ${tp}${ev&&ev.nomeEvento?` (${ev.nomeEvento})`:''}`; }
    const g = el(`<div class="grp"><div class="gh"><span class="fw6 fs13 ell">${escapeHtml(titulo)}</span><span class="money fs13 warn">${fmtMoney(sub)}</span></div>
      <div class="box">${itens.map(d=>`<div class="li clickable" data-desp="${d.id}">
        <div class="icobox">${ic('tag',16,'var(--gold)')}</div>
        <div class="m"><div class="t1 ell">${escapeHtml(d.descricao)}</div>
          <div class="t2 ell">${[d.categoria?escapeHtml(d.categoria):'Sem categoria', (d.quantidade===null||d.quantidade===undefined)?'':`${d.quantidade} ${escapeHtml(d.unidade||'')}${d.precoUnitario!=null?' × '+fmtMoney(d.precoUnitario):''}`, k===SEM_EVENTO_DESP?fmtDateBR(d.data):'', d.conta?escapeHtml(d.conta):''].filter(Boolean).join(' · ')}</div></div>
        <div class="rt warn">${fmtMoney(d.valor)}</div>
      </div>`).join('')}</div></div>`);
    c.appendChild(g);
  });
  c.querySelectorAll('[data-desp]').forEach(li=>li.addEventListener('click', ()=>{
    const d = DB.despesas.find(x=>x.id===li.dataset.desp);
    if(d) abrirFormDespesa(d, perm, opts);
  }));

  if(perm.criar) definirFab('Despesa', ()=>abrirFormDespesa(null, perm, opts), 'fabNovaDespesa');
  if(window._ui.abrirNovaDespesa){
    window._ui.abrirNovaDespesa = false;
    if(perm.criar) abrirFormDespesa(null, perm, opts);
  }
}

function abrirFormDespesa(d, perm, opts){
  opts = opts || eventosOptions();
  const editando = !!d;
  const somenteVer = editando ? !perm.editar : !perm.criar;
  const padraoEv = editando ? (d.tipo ? eventoKey(d.data,d.tipo) : SEM_EVENTO_DESP) : (F_evDespPadrao(opts));
  const unidadeOutra = editando && d.unidade && !UNIDADES_PADRAO.includes(d.unidade);
  const form = el(`<div>
    <div class="card pad mb12 center"><div class="lbl">Valor total</div>
      <input type="text" id="f_valor" class="moneybig warn" placeholder="R$ 0,00" inputmode="numeric"></div>
    <div class="field"><label>Descrição</label><input type="text" id="f_desc" placeholder="Ex: Massa e recheio" value="${escapeHtml(editando?d.descricao||'':'')}"></div>
    <div class="field"><label>Cantina</label>
      <select id="f_evento"><option value="${SEM_EVENTO_DESP}">— Sem evento (saída geral) —</option>${eventoOptionsHtml(opts, padraoEv)}</select></div>
    <div class="field" id="f_dataAvulsaWrap" style="display:none;"><label>Data desta saída</label><input type="date" id="f_dataAvulsa" value="${editando && !d.tipo ? d.data : hojeStr()}"></div>
    <label>Categoria</label>
    <select id="f_cat" class="hide">${categoriaOptionsHtml(DB.categoriasDespesas, editando?d.categoria||'':'')}</select>
    <div id="catChips" class="mb12"></div>
    <details class="acc" id="accQtd" ${editando && d.quantidade!=null ? 'open':''}><summary><span class="fw6 fs14">Quantidade × preço <span class="sub">(opcional)</span></span><span class="chev">${ic('chev',16)}</span></summary>
      <div class="acc-body">
        <div class="grid2"><div class="field"><label>Quantidade</label><input type="number" step="0.01" min="0" id="f_qtd" placeholder="Ex: 5" value="${editando && d.quantidade!=null ? d.quantidade : ''}"></div>
          <div class="field"><label>Preço unitário</label><input type="text" id="f_precoUnit" placeholder="R$ 0,00" inputmode="numeric"></div></div>
        <label>Unidade</label>
        <select id="f_unidade" class="hide">${UNIDADES_PADRAO.map(u=>`<option value="${u}">${u}</option>`).join('')}<option value="__outra">Outra…</option></select>
        <div id="unidChips"></div>
        <div class="field mt8" id="f_unidadeOutraWrap" style="display:none;"><input type="text" id="f_unidadeOutra" placeholder="Qual unidade? Ex: bandeja" value="${unidadeOutra?escapeHtml(d.unidade):''}"></div>
        <div class="small-note">Preenchendo os dois, o valor total é calculado sozinho (Qtd × Preço). Para gastos sem unidade (ex: conta de luz), digite só o valor total.</div>
      </div></details>
    <label class="mt14">Saiu de qual conta? <span style="text-transform:none;letter-spacing:0;font-weight:400;">(opcional)</span></label>
    <select id="f_contaDespesa" class="hide">${contaOptionsHtml(DB.contasCaixa, editando?d.conta||'':'')}</select>
    <div id="contaChips"></div>
    ${editando?`<div class="small-note mt12">Lançado por ${escapeHtml(d.lancadoPor||'—')}</div>`:''}
    ${somenteVer?'':`<button class="btn block mt16" id="btnAdd">${editando?'Salvar alterações':'+ Lançar despesa'}</button>`}
    ${editando && perm.excluir?`<button class="btn danger block mt8" id="btnDelDespesa">${ic('trash',17,'var(--warn)')} Excluir despesa</button>`:''}
  </div>`);
  abrirFolha({ titulo: editando ? 'Despesa' : 'Nova despesa', corpo: form });

  const evSel = form.querySelector('#f_evento');
  const dataAvulsaWrap = form.querySelector('#f_dataAvulsaWrap');
  const dataAvulsaInput = form.querySelector('#f_dataAvulsa');
  const descInput = form.querySelector('#f_desc');
  const catSel = form.querySelector('#f_cat');
  const qtdInput = form.querySelector('#f_qtd');
  const unidadeSel = form.querySelector('#f_unidade');
  const unidadeOutraWrap = form.querySelector('#f_unidadeOutraWrap');
  const unidadeOutraInput = form.querySelector('#f_unidadeOutra');
  const precoUnitInput = form.querySelector('#f_precoUnit');
  const valorInput = form.querySelector('#f_valor');
  const contaSel = form.querySelector('#f_contaDespesa');
  attachMoneyMask(precoUnitInput); attachMoneyMask(valorInput);
  if(editando){
    setMoneyVal(valorInput, d.valor);
    if(d.precoUnitario!=null) setMoneyVal(precoUnitInput, d.precoUnitario);
    unidadeSel.value = unidadeOutra ? '__outra' : (d.unidade || UNIDADES_PADRAO[0]);
  }
  evSel.value = padraoEv;
  form.querySelector('#catChips').appendChild(chipsDoSelect(catSel, {quebrar:true, rotulo:o=>o.value===''?'Sem categoria':o.textContent}));
  form.querySelector('#unidChips').appendChild(chipsDoSelect(unidadeSel, {quebrar:true, sm:true}));
  form.querySelector('#contaChips').appendChild(chipsDoSelect(contaSel, {quebrar:true, icone:'wallet', rotulo:o=>o.value===''?'Não informar':o.textContent}));

  function atualizarVisibilidadeEvento(){ dataAvulsaWrap.style.display = evSel.value===SEM_EVENTO_DESP ? 'block' : 'none'; }
  evSel.addEventListener('change', atualizarVisibilidadeEvento); atualizarVisibilidadeEvento();
  function atualizarUnidade(){ unidadeOutraWrap.style.display = unidadeSel.value==='__outra' ? 'block' : 'none'; }
  unidadeSel.addEventListener('change', atualizarUnidade); atualizarUnidade();
  function recalcularValorAutomatico(){
    const qtd = parseFloat(qtdInput.value);
    const precoUnit = moneyVal(precoUnitInput);
    if(!isNaN(qtd) && qtd>0 && precoUnitInput.value.trim()!=='' && precoUnit>=0){
      setMoneyVal(valorInput, Math.round(qtd*precoUnit*100)/100);
    }
  }
  qtdInput.addEventListener('input', recalcularValorAutomatico);
  precoUnitInput.addEventListener('input', recalcularValorAutomatico);
  if(somenteVer) form.querySelectorAll('input,select,textarea,.chip').forEach(x=>x.disabled=true);

  const btnAdd = form.querySelector('#btnAdd');
  if(btnAdd) btnAdd.addEventListener('click', async ()=>{
    if(editando ? !perm.editar : !perm.criar){ alert(editando ? 'Você não tem permissão para editar despesas.' : 'Você não tem permissão para lançar despesas.'); return; }
    const semEvento = evSel.value===SEM_EVENTO_DESP;
    const sel = semEvento ? null : opts.find(o=>o.value===evSel.value);
    const descricao = descInput.value.trim();
    const categoria = catSel.value;
    const valor = moneyVal(valorInput);
    const quantidadeRaw = qtdInput.value.trim();
    const quantidade = quantidadeRaw==='' ? null : parseFloat(quantidadeRaw);
    const unidade = unidadeSel.value==='__outra' ? unidadeOutraInput.value.trim() : unidadeSel.value;
    const precoUnitario = precoUnitInput.value.trim()==='' ? null : moneyVal(precoUnitInput);
    const conta = contaSel.value || null;
    if(!descricao || !(valor>0)){ alert('Preencha descrição e valor.'); return; }
    if(semEvento && !dataAvulsaInput.value){ alert('Preencha a data desta saída.'); return; }
    if(!semEvento && !sel){ alert('Selecione um evento (ou "Sem evento").'); return; }
    const dadosDespesa = {
      data: semEvento ? dataAvulsaInput.value : sel.data,
      tipo: semEvento ? null : sel.tipo,
      descricao, categoria, valor, quantidade, unidade: quantidade!==null ? unidade : null,
      precoUnitario: (quantidade!==null && precoUnitario!==null && !isNaN(precoUnitario)) ? precoUnitario : null,
      conta,
    };
    btnAdd.disabled = true;
    try{
      if(editando){
        await col('despesas').doc(d.id).update(dadosDespesa);
        await auditLog('Atualizou', 'despesas', `Despesa "${descricao}" editada (${fmtMoney(valor)})`);
      } else {
        dadosDespesa.lancadoPor = userName();
        await col('despesas').add(dadosDespesa);
        await auditLog('Criou', 'despesas', `Despesa "${descricao}" (${fmtMoney(valor)}) em ${fmtDateBR(dadosDespesa.data)}${semEvento?' (sem evento)':''}`);
      }
      fecharFolhaERedesenhar();
    }catch(e){ btnAdd.disabled = false; alert(editando?'Não foi possível salvar a edição.':'Não foi possível lançar a despesa.'); console.error(e); }
  });
  const btnDel = form.querySelector('#btnDelDespesa');
  if(btnDel) btnDel.addEventListener('click', async ()=>{
    if(!perm.excluir){ alert('Você não tem permissão para excluir despesas.'); return; }
    if(!confirm('Excluir esta despesa?')) return;
    try{
      await col('despesas').doc(d.id).delete();
      await auditLog('Excluiu', 'despesas', `Despesa "${d.descricao}" (${fmtMoney(d.valor)})`);
      fecharFolhaERedesenhar();
    }catch(e){ alert('Não foi possível excluir.'); console.error(e); }
  });
}
/* Cantina sugerida para uma despesa nova: a do filtro (se houver), senão a cantina atual,
   senão a primeira da lista, senão "sem evento". */
function F_evDespPadrao(opts){
  const f = (window._filtrosDespesa||{}).evento;
  if(f) return f;
  return eventoAtualPadrao(opts) || (opts.length ? opts[0].value : SEM_EVENTO_DESP);
}

/* ==================== CAIXA ==================== */
function dataEntradaReserva(r){ return r.dataPagamento || r.data; }

function calcularResumoCaixa(){
  const entradasVendas = DB.reservas.reduce((s,r)=>s+valorPagoDe(r),0);
  const entradasAvulsasTotal = DB.entradasAvulsas.reduce((s,e)=>s+Number(e.valor),0);
  const totalEntradas = entradasVendas + entradasAvulsasTotal;
  const totalSaidas = DB.despesas.reduce((s,d)=>s+Number(d.valor),0);
  return { entradasVendas, entradasAvulsasTotal, totalEntradas, totalSaidas, saldo: totalEntradas - totalSaidas };
}

function construirMovimentosCaixa(){
  const movs = [];
  DB.reservas.filter(r=>valorPagoDe(r)>0).forEach(r=>{
    movs.push({
      data: dataEntradaReserva(r), tipoMov:'entrada', origem:'venda',
      descricao: `${r.cliente} — ${r.item}${r.pago==='Parcial'?' (parcial)':''}`,
      categoriaEvento: r.tipo ? `${fmtDateBR(r.data)} — ${r.tipo}` : '—',
      valor: valorPagoDe(r), idOrigem: r.id, conta: r.conta || null,
    });
  });
  DB.entradasAvulsas.forEach(e=>{
    movs.push({
      data: e.data, tipoMov:'entrada', origem:'avulsa',
      descricao: e.descricao, categoriaEvento: e.categoria || '—',
      valor: Number(e.valor), idOrigem: e.id, conta: e.conta || null,
    });
  });
  DB.despesas.forEach(d=>{
    movs.push({
      data: d.data, tipoMov:'saida', origem: d.tipo ? 'evento' : 'avulsa',
      descricao: d.descricao,
      categoriaEvento: d.tipo ? `${fmtDateBR(d.data)} — ${d.tipo}` : (d.categoria || 'Geral'),
      valor: Number(d.valor), idOrigem: d.id, conta: d.conta || null,
    });
  });
  movs.sort((a,b)=> a.data===b.data ? 0 : (a.data<b.data?-1:1));
  let saldo = 0;
  movs.forEach(m=>{ saldo += (m.tipoMov==='entrada'? m.valor : -m.valor); m.saldoAcumulado = saldo; });
  return movs;
}
/* Saldo por conta (ex: "Espécie" R$200 / "Conta do Banco" R$300) — soma as mesmas movimentações de
   construirMovimentosCaixa(), só que agrupadas por conta em vez de listadas em ordem cronológica.
   Lançamentos sem conta definida (feitos antes dessa opção existir, ou deixados em branco de
   propósito) entram no grupo "Sem conta definida" — nada se perde, só fica sem essa quebra extra. */
function calcularSaldoPorConta(movs){
  const porConta = {};
  movs.forEach(m=>{
    const chave = m.conta || '__semconta';
    porConta[chave] = porConta[chave] || { conta: m.conta || 'Sem conta definida', entradas:0, saidas:0 };
    if(m.tipoMov==='entrada') porConta[chave].entradas += m.valor; else porConta[chave].saidas += m.valor;
  });
  return Object.values(porConta).map(x=>({...x, saldo: x.entradas-x.saidas})).sort((a,b)=>b.saldo-a.saldo);
}


/* ==================== CAIXA ====================
   Quatro abas: Resumo (dinheiro disponível hoje, saldo por conta, botões de Entrada/Saída e
   últimas movimentações), Extrato (linha do tempo com filtros), Contas (tabela por conta) e
   Gráficos. Os cálculos são os mesmos de antes (calcularResumoCaixa / construirMovimentosCaixa /
   calcularSaldoPorConta) — só entra no caixa o que foi efetivamente recebido. */
function renderCaixa(c){
  const perm = { criar: podeCriar('caixa'), excluir: podeExcluir('caixa') };
  const permDesp = { criar: podeCriar('despesas'), editar: podeEditar('despesas'), excluir: podeExcluir('despesas') };
  const resumo = calcularResumoCaixa();
  const movs = construirMovimentosCaixa();
  telaSuja = false;
  const aba = window._ui.caixaAba || 'resumo';

  cabecalho(c, 'Caixa');
  c.appendChild(segmentado([['resumo','Resumo'],['extrato','Extrato'],['contas','Contas'],['graficos','Gráficos']], aba, v=>{ window._ui.caixaAba = v; render(); }, 'mb12'));

  if(aba==='resumo') caixaResumo(c, resumo, movs, perm, permDesp);
  else if(aba==='extrato') caixaExtrato(c, movs, perm, permDesp);
  else if(aba==='contas') caixaContas(c, movs);
  else caixaGraficos(c, resumo, movs);

  if(window._ui.abrirNovaEntrada){ window._ui.abrirNovaEntrada = false; if(perm.criar) abrirFormEntrada(); }
}

function linhaMov(m, perm){
  const ent = m.tipoMov==='entrada';
  const origemTxt = m.origem==='venda' ? 'Venda' : ent ? 'Entrada avulsa' : (m.origem==='evento' ? 'Despesa da cantina' : 'Saída geral');
  const podeExcluirEsta = m.origem==='avulsa' && ent && perm.excluir;
  return `<div class="li" data-mov="${m.tipoMov}|${m.origem}|${m.idOrigem}">
    <div class="icobox ${ent?'ok':'warn'}">${ic(ent?'down':'up',17,ent?'var(--ok)':'var(--warn)',2.2)}</div>
    <div class="m"><div class="t1 ell">${escapeHtml(m.descricao)}</div>
      <div class="t2 ell">${fmtDataCurta(m.data)} · ${origemTxt}${m.categoriaEvento&&m.categoriaEvento!=='—'?' · '+escapeHtml(m.categoriaEvento):''}${m.conta?' · '+escapeHtml(m.conta):''}</div></div>
    <div class="rt ${ent?'ok':'warn'}">${ent?'+':'−'} ${fmtMoney(m.valor)}${m.saldoAcumulado!==undefined?`<div class="t2" style="font-weight:400;">saldo ${fmtMoney(m.saldoAcumulado)}</div>`:''}</div>
    ${podeExcluirEsta?`<button class="iconbtn plain" data-delentrada="${m.idOrigem}" aria-label="Excluir entrada">${ic('trash',16,'var(--warn)')}</button>`:''}
  </div>`;
}
function ligarExclusaoEntradas(scope, perm){
  scope.querySelectorAll('[data-delentrada]').forEach(btn=>btn.addEventListener('click', async ev=>{
    ev.stopPropagation();
    if(!perm.excluir){ alert('Você não tem permissão para excluir entradas.'); return; }
    if(!confirm('Excluir esta entrada avulsa?')) return;
    const en = DB.entradasAvulsas.find(x=>x.id===btn.dataset.delentrada);
    await col('entradasAvulsas').doc(btn.dataset.delentrada).delete();
    await auditLog('Excluiu', 'entradasAvulsas', `Entrada avulsa "${en?en.descricao:''}" (${fmtMoney(en?en.valor:0)})`);
  }));
  // Tocar numa saída abre a despesa (quem pode ver Despesas)
  scope.querySelectorAll('[data-mov^="saida|"]').forEach(li=>{
    if(!podeVer('despesas')) return;
    li.classList.add('clickable');
    li.addEventListener('click', ()=>{
      const id = li.dataset.mov.split('|')[2];
      const d = DB.despesas.find(x=>x.id===id);
      if(d) abrirFormDespesa(d, { criar: podeCriar('despesas'), editar: podeEditar('despesas'), excluir: podeExcluir('despesas') });
    });
  });
}

function caixaResumo(c, resumo, movs, perm, permDesp){
  c.appendChild(el(`<div class="hero mb12">
    <div class="lbl">Dinheiro disponível hoje</div>
    <div class="money" style="font-size:36px;margin-top:4px;position:relative;z-index:1;" id="caixaSaldo">${fmtMoney(resumo.saldo)}</div>
    <div class="grid2 mt12" style="position:relative;z-index:1;gap:8px;">
      <div style="background:rgba(255,255,255,.14);border-radius:12px;padding:8px 10px;"><div class="fs11" style="opacity:.85;">${ic('down',12,'#DDF0D2',2.2)} Entrou</div><div class="money fs14">${fmtMoney(resumo.totalEntradas)}</div><div class="fs11" style="opacity:.8;">vendas ${moneyCurto(resumo.entradasVendas)} · avulsas ${moneyCurto(resumo.entradasAvulsasTotal)}</div></div>
      <div style="background:rgba(255,255,255,.14);border-radius:12px;padding:8px 10px;"><div class="fs11" style="opacity:.85;">${ic('up',12,'#F6D3CB',2.2)} Saiu</div><div class="money fs14">${fmtMoney(resumo.totalSaidas)}</div><div class="fs11" style="opacity:.8;">despesas</div></div>
    </div>
  </div>`));

  if(perm.criar || permDesp.criar){
    const acoes = el(`<div class="grid2 mb12">
      ${perm.criar?`<button class="btn okbtn" id="btnNovaEntrada">${ic('plus',18,'#fff',2.3)} Entrada</button>`:''}
      ${permDesp.criar?`<button class="btn warnbtn" id="btnNovaSaida">${ic('minus',18,'#fff',2.3)} Saída</button>`:''}
    </div>`);
    c.appendChild(acoes);
    const be = acoes.querySelector('#btnNovaEntrada'); if(be) be.addEventListener('click', ()=>abrirFormEntrada());
    const bs = acoes.querySelector('#btnNovaSaida'); if(bs) bs.addEventListener('click', ()=>abrirFormDespesa(null, permDesp));
  }

  if(DB.contasCaixa.length){
    const porConta = calcularSaldoPorConta(movs);
    c.appendChild(el(`<div class="sechead"><span class="h3">Onde está o dinheiro</span><button class="linkbtn" id="verContas">Detalhes</button></div>`));
    c.appendChild(el(`<div class="grid2 mb12" id="contasCards">${porConta.map(x=>`<div class="tile"><div class="row" style="gap:6px;">${ic(/banco|pix|cart/i.test(x.conta)?'bank':'coins',15,'var(--gold)')}<span class="lbl ell">${escapeHtml(x.conta)}</span></div><div class="v ${x.saldo<0?'warn':''}">${fmtMoney(x.saldo)}</div></div>`).join('')}</div>`));
    c.querySelector('#verContas').addEventListener('click', ()=>{ window._ui.caixaAba='contas'; render(); });
  } else if(isAdmin()){
    c.appendChild(el(`<div class="card wash pad fs12 mb12">${ic('wallet',15,'var(--gold)')} Quer ver quanto tem em espécie e quanto tem no banco separado? Cadastre as contas em <button class="linkbtn" data-ir-contas>Mais › Contas do caixa</button>.</div>`));
    c.querySelector('[data-ir-contas]').addEventListener('click', ()=>irPara('contas'));
  }

  const ultimos = [...movs].reverse().slice(0,8);
  c.appendChild(el(`<div class="sechead"><span class="h3">Últimas movimentações</span><button class="linkbtn" id="verExtrato">Ver extrato</button></div>`));
  const box = el(`<div class="box">${ultimos.length ? ultimos.map(m=>linhaMov(m, perm)).join('') : '<div class="empty-state">Nenhuma movimentação ainda</div>'}</div>`);
  c.appendChild(box);
  ligarExclusaoEntradas(box, perm);
  c.querySelector('#verExtrato').addEventListener('click', ()=>{ window._ui.caixaAba='extrato'; render(); });
  c.appendChild(el(`<div class="small-note mt10">Vendas entram aqui só com o valor já recebido, na data de cada pagamento. O que ainda falta receber aparece em Início › A receber — não no caixa.</div>`));
  if(perm.criar) definirFab(null, ()=>abrirFormEntrada(), 'fabNovaEntrada');
}

function caixaExtrato(c, movs, perm, permDesp){
  window._filtrosCaixa = window._filtrosCaixa || {de:'', ate:''};
  const F = window._filtrosCaixa;
  F.tipo = F.tipo || ''; F.conta = F.conta || '';
  const filtros = el(`<div class="mb12">
    <div class="chips mb8" id="tipoMovChips">${[['','Tudo'],['entrada','Entradas'],['saida','Saídas']].map(([v,l])=>`<button class="chip sm ${F.tipo===v?'on':''}" data-tipomov="${v}">${l}</button>`).join('')}
      ${DB.contasCaixa.length?`<span style="width:1px;background:var(--line);flex:none;"></span>`+[['','Todas as contas'], ...DB.contasCaixa.map(x=>[x.nome,x.nome]), ['__semconta','Sem conta']].map(([v,l])=>`<button class="chip sm ${F.conta===v?'gold':''}" data-contafilt="${escapeHtml(v)}">${escapeHtml(l)}</button>`).join(''):''}</div>
    <div class="row" style="gap:8px;"><div class="grow"><label>De</label><input type="date" id="filtCaixaDe" value="${F.de}"></div><div class="grow"><label>Até</label><input type="date" id="filtCaixaAte" value="${F.ate}"></div>
      <button class="btn ghost sm" id="btnLimparFiltroCaixa" style="align-self:flex-end;min-height:44px;">Limpar</button></div>
  </div>`);
  c.appendChild(filtros);
  filtros.querySelectorAll('[data-tipomov]').forEach(b=>b.addEventListener('click', ()=>{ F.tipo=b.dataset.tipomov; render(); }));
  filtros.querySelectorAll('[data-contafilt]').forEach(b=>b.addEventListener('click', ()=>{ F.conta=b.dataset.contafilt; render(); }));
  filtros.querySelector('#filtCaixaDe').addEventListener('change', e=>{ F.de = e.target.value; render(); });
  filtros.querySelector('#filtCaixaAte').addEventListener('change', e=>{ F.ate = e.target.value; render(); });
  filtros.querySelector('#btnLimparFiltroCaixa').addEventListener('click', ()=>{ window._filtrosCaixa = {de:'', ate:'', tipo:'', conta:''}; render(); });

  let lista = movs;
  if(F.de) lista = lista.filter(m=>m.data >= F.de);
  if(F.ate) lista = lista.filter(m=>m.data <= F.ate);
  if(F.tipo) lista = lista.filter(m=>m.tipoMov===F.tipo);
  if(F.conta) lista = lista.filter(m=> F.conta==='__semconta' ? !m.conta : m.conta===F.conta);
  const ent = lista.filter(m=>m.tipoMov==='entrada').reduce((s,m)=>s+m.valor,0);
  const sai = lista.filter(m=>m.tipoMov==='saida').reduce((s,m)=>s+m.valor,0);
  c.appendChild(el(`<div class="grid3 mb12"><div class="tile"><div class="lbl">Entradas</div><div class="v ok" style="font-size:16px;">${fmtMoney(ent)}</div></div><div class="tile"><div class="lbl">Saídas</div><div class="v warn" style="font-size:16px;">${fmtMoney(sai)}</div></div><div class="tile"><div class="lbl">Resultado</div><div class="v" style="font-size:16px;">${fmtMoney(ent-sai)}</div></div></div>`));

  // Linha do tempo: mais recente primeiro, agrupado por dia
  const ordenados = [...lista].sort((a,b)=> a.data===b.data?0:(a.data<b.data?1:-1));
  if(!ordenados.length){ c.appendChild(el(`<div class="card pad empty-state">Nenhuma movimentação no período selecionado</div>`)); }
  const porDia = {};
  ordenados.forEach(m=>{ (porDia[m.data] = porDia[m.data] || []).push(m); });
  const wrap = el(`<div id="extratoLista"></div>`);
  Object.keys(porDia).forEach(dia=>{
    const ms = porDia[dia];
    const liq = ms.reduce((s,m)=>s+(m.tipoMov==='entrada'?m.valor:-m.valor),0);
    wrap.appendChild(el(`<div class="grp"><div class="gh"><span class="fw6 fs13">${diaSemana(dia)}, ${fmtDateBR(dia)}</span><span class="fs12 ${liq>=0?'ok':'warn'} fw6">${liq>=0?'+':'−'} ${fmtMoney(Math.abs(liq))}</span></div><div class="box">${ms.map(m=>linhaMov(m, perm)).join('')}</div></div>`));
  });
  c.appendChild(wrap);
  ligarExclusaoEntradas(wrap, perm);
  if(perm.criar) definirFab(null, ()=>abrirFormEntrada(), 'fabNovaEntrada');
}

function caixaGraficos(c, resumo, movs){
  const monthsCaixa = {};
  movs.forEach(m=>{ const k=m.data.slice(0,7); monthsCaixa[k]=monthsCaixa[k]||{entrada:0,saida:0}; monthsCaixa[k][m.tipoMov]+=m.valor; });
  const monthKeysCaixa = Object.keys(monthsCaixa).sort();
  let saldoAcum=0; const saldoPorMes = monthKeysCaixa.map(k=>{ saldoAcum += monthsCaixa[k].entrada - monthsCaixa[k].saida; return saldoAcum; });

  c.appendChild(el(`<div class="sechead" style="margin-top:4px;"><span class="h3">Saldo ao longo do tempo</span></div>`));
  c.appendChild(el(`<div class="chart-box"><canvas id="chartSaldoCaixa"></canvas></div>`));
  c.appendChild(el(`<div class="sechead"><span class="h3">Entradas × saídas por mês</span></div>`));
  c.appendChild(el(`<div class="chart-box"><canvas id="chartEntradaSaida"></canvas></div>`));

  const catAgg = {};
  DB.despesas.forEach(d=>{ const k = (d.categoria && d.categoria.trim()) ? d.categoria.trim() : (d.tipo || 'Sem categoria'); catAgg[k]=(catAgg[k]||0)+Number(d.valor); });
  const catEntries = Object.entries(catAgg).sort((a,b)=>b[1]-a[1]);
  c.appendChild(el(`<div class="sechead"><span class="h3">Saídas por categoria</span></div>`));
  const two1 = el(`<div class="two-col"></div>`);
  two1.appendChild(el(`<div class="chart-box"><canvas id="chartSaidaCategoria"></canvas></div>`));
  two1.appendChild(el(`<div class="box">${catEntries.length? catEntries.map(([k,v])=>`<div class="li"><div class="m"><div class="t1 ell">${escapeHtml(k)}</div><div class="bar mt4"><i style="width:${resumo.totalSaidas? v/resumo.totalSaidas*100:0}%;background:var(--warn);"></i></div></div><div class="rt">${fmtMoney(v)}<div class="t2" style="font-weight:400;">${fmtPct(resumo.totalSaidas? v/resumo.totalSaidas*100:0)}</div></div></div>`).join('') : '<div class="empty-state">Nenhuma saída registrada</div>'}</div>`));
  c.appendChild(two1);

  const eventoAgg = {};
  DB.reservas.filter(r=>valorPagoDe(r)>0).forEach(r=>{
    const k = r.tipo ? eventoKey(r.data, r.tipo) : '__semevento';
    const label = r.tipo ? `${fmtDateBR(r.data)} — ${r.tipo}` : 'Sem evento vinculado';
    eventoAgg[k] = eventoAgg[k] || {label, total:0};
    eventoAgg[k].total += valorPagoDe(r);
  });
  const eventoEntries = Object.values(eventoAgg).sort((a,b)=>b.total-a.total);
  c.appendChild(el(`<div class="sechead"><span class="h3">Recebido por cantina</span></div>`));
  c.appendChild(el(`<div class="chart-box" style="height:${Math.max(220, eventoEntries.length*34+40)}px;"><canvas id="chartEntradaEvento"></canvas></div>`));

  const gold = ministerioAtual.corGold;
  charts.saldoCaixa = new Chart(document.getElementById('chartSaldoCaixa'), {
    type:'line',
    data:{ labels: monthKeysCaixa.map(k=>monthLabel(k+'-01')), datasets:[
      {label:'Saldo Acumulado', data: saldoPorMes, borderColor: gold, backgroundColor: gold+'33', tension:.3, fill:true, pointRadius:4, pointHoverRadius:6, pointBackgroundColor: gold},
    ]},
    options: chartOpts({ plugins:{legend:{display:false}} })
  });
  charts.entradaSaida = new Chart(document.getElementById('chartEntradaSaida'), {
    type:'bar',
    data:{ labels: monthKeysCaixa.map(k=>monthLabel(k+'-01')), datasets:[
      {label:'Entradas', data: monthKeysCaixa.map(k=>monthsCaixa[k].entrada), backgroundColor: gold, ...CHART_BAR},
      {label:'Saídas', data: monthKeysCaixa.map(k=>monthsCaixa[k].saida), backgroundColor:'#A5493A', ...CHART_BAR},
    ]},
    options: chartOpts()
  });
  const paletaCat = [gold,'#5C7A4B','#A5493A','#8B7B62','#C9A961','#6E8FA3','#B08D3E','#7A5C3E','#4C6B3C','#9C5A4A'];
  charts.saidaCategoria = new Chart(document.getElementById('chartSaidaCategoria'), {
    type:'doughnut',
    data:{ labels: catEntries.map(e=>e[0]), datasets:[{ data: catEntries.map(e=>e[1]), backgroundColor: catEntries.map((_,i)=>paletaCat[i%paletaCat.length]), borderColor:'#fff', borderWidth:2, hoverOffset:6 }] },
    options: chartOpts({ scales:null, cutout:'62%' })
  });
  charts.entradaEvento = new Chart(document.getElementById('chartEntradaEvento'), {
    type:'bar',
    data:{ labels: eventoEntries.map(e=>e.label), datasets:[{label:'Total Recebido', data: eventoEntries.map(e=>e.total), backgroundColor: gold, ...CHART_BAR_H}] },
    options: chartOpts({ indexAxis:'y', plugins:{legend:{display:false}} })
  });
}

    <div class="field"><label>Descrição</label><input type="text" id="f_descEntrada" placeholder="Ex: Doação da Família Silva"></div>

    <div class="small-note">Use para dinheiro que entra sem ser de uma venda — doações, repasses etc. Recebimento de pedido se lança no próprio pedido.</div>
    <button class="btn okbtn block mt16" id="btnAddEntrada">+ Registrar entrada</button>
  </div>`);
  abrirFolha({ titulo:'Nova entrada', corpo: form });
  const valorEntradaInput = form.querySelector('#f_valorEntrada');
  attachMoneyMask(valorEntradaInput);
  const catInput = form.querySelector('#f_catEntrada');
  form.querySelector('#catEntradaChips').addEventListener('click', e=>{
    const b = e.target.closest('[data-catent]'); if(!b) return;
    catInput.value = b.dataset.catent;
    form.querySelectorAll('[data-catent]').forEach(x=>x.classList.toggle('on', x===b));
  });
  const contaSel = form.querySelector('#f_contaEntrada');
  form.querySelector('#contaEntradaChips').appendChild(chipsDoSelect(contaSel, {quebrar:true, icone:'wallet', rotulo:o=>o.value===''?'Não informar':o.textContent}));
  const btn = form.querySelector('#btnAddEntrada');
  btn.addEventListener('click', async ()=>{
    const data = form.querySelector('#f_dataEntrada').value;
    const descricao = form.querySelector('#f_descEntrada').value.trim();
    const categoria = catInput.value.trim();
    const valor = moneyVal(valorEntradaInput);
    const conta = contaSel.value || null;
    if(!data || !descricao || !(valor>0)){ alert('Preencha data, descrição e valor.'); return; }
    btn.disabled = true;
    try{
      await col('entradasAvulsas').add({ data, descricao, categoria, valor, conta, lancadoPor: userName() });
      await auditLog('Criou', 'entradasAvulsas', `Entrada avulsa "${descricao}" (${fmtMoney(valor)}) em ${fmtDateBR(data)}`);
      fecharFolhaERedesenhar();
    }catch(e){ btn.disabled = false; alert('Não foi possível registrar a entrada.'); console.error(e); }
  });
}


/* ==================== CLIENTES ====================
   Busca + filtros rápidos (Todos / Devendo / Mais compram), lista com avatar e, ao tocar,
   o perfil da pessoa (quanto comprou, quanto deve, histórico de pedidos). Cadastro/edição
   numa folha, com aviso de nome parecido na hora e telefone padronizado "DD 9XXXX-XXXX". */
function resumoCliente(cl){
  const rs = DB.reservas.filter(r=>normalizarNome(r.cliente)===normalizarNome(cl.nome));
  const total = rs.reduce((s,r)=>s+valorReserva(r),0);
  const deve = rs.reduce((s,r)=>s+saldoPendente(r),0);
  const ultima = rs.reduce((m,r)=> (r.data||'')>m ? r.data : m, '');
  return { rs, total, deve, ultima, pedidos: rs.length };
}

function renderClientes(c){
  const perm = { criar: podeCriar('clientes'), editar: podeEditar('clientes'), excluir: podeExcluir('clientes') };
  telaSuja = false;
  if(window._ui.clienteAberto){
    const cl = DB.clientes.find(x=>x.id===window._ui.clienteAberto);
    if(cl) return renderPerfilCliente(c, cl, perm);
    delete window._ui.clienteAberto;
  }
  cabecalho(c, 'Clientes', { voltar: ()=>irPara('mais'), voltarTexto:'Mais' });
  if(!perm.criar && !perm.editar) avisoSoConsulta(c, 'Clientes');

  window._filtrosCliente = window._filtrosCliente || {busca:'', modo:''};
  const F = window._filtrosCliente;
  const topo = el(`<div class="mb12">
    <div class="row" style="position:relative;"><span style="position:absolute;left:12px;top:12px;">${ic('search',18,'var(--ink-faint)')}</span><input type="search" id="buscaCliente" placeholder="Buscar por nome ou telefone" value="${escapeHtml(F.busca)}" style="padding-left:38px;"></div>
    <div class="chips mt8">${[['','Todos'],['devendo','Devendo'],['top','Mais compram']].map(([v,l])=>`<button class="chip sm ${F.modo===v?'on':''}" data-modocli="${v}">${l}</button>`).join('')}</div>
  </div>`);
  c.appendChild(topo);
  topo.querySelectorAll('[data-modocli]').forEach(b=>b.addEventListener('click', ()=>{ F.modo = b.dataset.modocli; render(); }));

  let lista = DB.clientes.map(cl=>({cl, ...resumoCliente(cl)}));
  if(F.modo==='devendo') lista = lista.filter(x=>x.deve>0.004).sort((a,b)=>b.deve-a.deve);
  else if(F.modo==='top') lista = lista.sort((a,b)=>b.total-a.total);
  else lista = lista.sort((a,b)=>a.cl.nome.localeCompare(b.cl.nome));

  const totalDeve = lista.reduce((s,x)=>s+x.deve,0);
  c.appendChild(el(`<div class="sub mb8" style="padding:0 4px;">${lista.length} cliente${lista.length===1?'':'s'}${F.modo==='devendo'&&lista.length?` · devendo ${fmtMoney(totalDeve)} no total`:''}</div>`));

  const box = el(`<div class="box" id="listaClientes">${lista.length ? lista.map((x,i)=>{
    const cl = x.cl;
    const bad = cl.contato && !formatarTelefoneBR(cl.contato);
    return `<div class="li clickable" data-cli="${cl.id}" data-busca="${escapeHtml(normalizarNome(cl.nome)+' '+(cl.contato||'').replace(/\D/g,''))}">
      <div class="avatar sm">${F.modo==='top'&&i<3?['1º','2º','3º'][i]:iniciais(cl.nome)}</div>
      <div class="m"><div class="t1 ell">${escapeHtml(cl.nome)}</div><div class="t2 ell">${cl.contato?escapeHtml(cl.contato):'sem telefone'}${bad?' <span class="warn">· confira o telefone</span>':''} · ${x.pedidos} pedido${x.pedidos===1?'':'s'}</div></div>
      <div class="rt">${x.deve>0.004?`<span class="warn">deve ${fmtMoney(x.deve)}</span>`:fmtMoney(x.total)}</div>
      ${linkWa(cl.contato)}
    </div>`;
  }).join('') : `<div class="empty-state">${F.modo==='devendo'?'Ninguém devendo no momento':'Nenhum cliente cadastrado'}</div>`}</div>`);
  c.appendChild(box);
  box.querySelectorAll('[data-cli]').forEach(li=>li.addEventListener('click', ()=>{ window._ui.clienteAberto = li.dataset.cli; render(); window.scrollTo(0,0); }));
  const busca = topo.querySelector('#buscaCliente');
  function filtrarBusca(){
    F.busca = busca.value;
    const q = normalizarNome(busca.value), qd = busca.value.replace(/\D/g,'');
    box.querySelectorAll('[data-cli]').forEach(li=>{
      const b = li.dataset.busca;
      li.style.display = (!q || b.includes(q) || (qd && b.includes(qd))) ? '' : 'none';
    });
  }
  busca.addEventListener('input', filtrarBusca);
  if(F.busca) filtrarBusca();

  if(isAdmin()){
    const b = el(`<button class="btn ghost block mt16" id="btnPadronizarContatos">${ic('phone',16)} Padronizar contatos já cadastrados</button>`);
    c.appendChild(b);
    b.addEventListener('click', padronizarContatos);
  }
  if(perm.criar) definirFab(null, ()=>abrirFormCliente(null, perm), 'fabNovoCliente');
}

async function padronizarContatos(){
  const alvos = DB.clientes.filter(cl=>cl.contato && cl.contato.trim());
  if(!alvos.length){ alert('Nenhum cliente com contato cadastrado ainda.'); return; }
  if(!confirm(`Isso vai reformatar o contato de até ${alvos.length} cliente(s) pro padrão "DD 9XXXX-XXXX" (o mesmo formato que já sai certo em novos cadastros). Continuar?`)) return;
  let corrigidos = 0, jaCertos = 0;
  const semDDD = [];
  for(const cl of alvos){
    const f = formatarTelefoneBR(cl.contato);
    if(!f){ semDDD.push(cl.nome); continue; }
    if(f.formatado !== cl.contato){
      try{ await col('clientes').doc(cl.id).update({ contato: f.formatado }); corrigidos++; }
      catch(e){ console.error('Falha ao padronizar contato de', cl.nome, e); }
    } else { jaCertos++; }
  }
  if(corrigidos>0) await auditLog('Atualizou', 'clientes', `Padronização em lote: ${corrigidos} contato(s) reformatado(s) pro padrão "DD 9XXXX-XXXX"`);
  let msg = `${corrigidos} contato(s) corrigido(s). ${jaCertos} já estavam no padrão.`;
  if(semDDD.length) msg += `\n\nNão deu pra corrigir automaticamente (provavelmente falta o DDD) — confira manualmente: ${semDDD.join(', ')}.`;
  alert(msg);
}
